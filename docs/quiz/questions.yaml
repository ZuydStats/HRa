  # bron: Research Skills oefenvragen, slide 13
  - id: 43
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Which set of numbers has the smallest standard deviation?"
    question_nl: "Welke reeks getallen heeft de kleinste standaarddeviatie?"
    answers:
      - text_en: "10, 20, 30"
        text_nl: "10, 20, 30"
        correct: false
        feedback_en: "Incorrect. The mean is 20 and the values are 10 away from it. That is more spread than in 18, 20, 22."
        feedback_nl: "Onjuist. Het gemiddelde is 20 en de waarden liggen er 10 vanaf. Dat is meer spreiding dan bij 18, 20, 22."
      - text_en: "18, 20, 22"
        text_nl: "18, 20, 22"
        correct: true
        feedback_en: "Correct! All sets have mean 20; the SD depends on how far the values lie from that mean. In this set they deviate only 2 (versus 10, 15 and 20 in the others), so it has the smallest spread."
        feedback_nl: "Correct! Alle reeksen hebben gemiddelde 20; de standaarddeviatie hangt af van hoe ver de waarden van dat gemiddelde liggen. In deze reeks wijken ze maar 2 af (tegenover 10, 15 en 20 in de andere), dus deze heeft de kleinste spreiding."
      - text_en: "5, 20, 35"
        text_nl: "5, 20, 35"
        correct: false
        feedback_en: "Incorrect. The values deviate 15 from the mean of 20: a large spread."
        feedback_nl: "Onjuist. De waarden wijken 15 af van het gemiddelde van 20: een grote spreiding."
      - text_en: "0, 20, 40"
        text_nl: "0, 20, 40"
        correct: false
        feedback_en: "Incorrect. The values deviate 20 from the mean of 20: this set actually has the largest standard deviation."
        feedback_nl: "Onjuist. De waarden wijken 20 af van het gemiddelde van 20: deze reeks heeft juist de grootste standaarddeviatie."

  # ── BETROUWBAARHEIDSINTERVAL ──────────────────────────────────────────────

  - id: 44
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "Which of the options below results in a smaller confidence interval?"
    question_nl: "Welke van de onderstaande opties resulteert in een kleiner betrouwbaarheidsinterval?"
    answers:
      - text_en: "Decreasing the reliability"
        text_nl: "Het betrouwbaarheidsniveau verlagen"
        correct: false
        feedback_en: "Incorrect. Decreasing the confidence level (e.g. from 95% to 90%) does narrow the interval, but this option says 'decreasing the reliability' which is not the same as reducing the confidence level."
        feedback_nl: "Onjuist. Het betrouwbaarheidsniveau verlagen (bijv. van 95% naar 90%) versmalt wel het interval, maar dit is niet het beste antwoord hier."
      - text_en: "Decreasing the reliability and the sample size"
        text_nl: "Het betrouwbaarheidsniveau en de steekproefgrootte verlagen"
        correct: false
        feedback_en: "Incorrect. Decreasing sample size WIDENS the interval. These two effects work against each other."
        feedback_nl: "Onjuist. Het verkleinen van de steekproef VERBREEDT het interval. Deze twee effecten werken tegen elkaar in."
      - text_en: "Increasing the sample size"
        text_nl: "De steekproefgrootte vergroten"
        correct: true
        feedback_en: "Correct! A larger sample reduces the standard error, which narrows the confidence interval. More data = more precision."
        feedback_nl: "Correct! Een grotere steekproef vermindert de standaardfout, waardoor het betrouwbaarheidsinterval smaller wordt. Meer data = meer precisie."
      - text_en: "Decreasing the sample size"
        text_nl: "De steekproefgrootte verkleinen"
        correct: false
        feedback_en: "Incorrect. Smaller samples increase uncertainty, which WIDENS the confidence interval."
        feedback_nl: "Onjuist. Kleinere steekproeven vergroten de onzekerheid, waardoor het betrouwbaarheidsinterval BREDER wordt."

  - id: 45
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "Which are the symbols for: population mean, population standard deviation, significance level?"
    question_nl: "Wat zijn de symbolen voor: populatiegemiddelde, populatiestandaarddeviatie, significantieniveau?"
    answers:
      - text_en: "σ, x and $"
        text_nl: "σ, x en $"
        correct: false
        feedback_en: "Incorrect. σ is standard deviation, but x̄ is the sample mean (not population mean μ), and $ is not a statistics symbol."
        feedback_nl: "Onjuist. σ is standaarddeviatie, maar x̄ is het steekproefgemiddelde (niet populatiegemiddelde μ), en $ is geen statistieksymbool."
      - text_en: "μ, σ and α"
        text_nl: "μ, σ en α"
        correct: true
        feedback_en: "Correct! μ (mu) = population mean, σ (sigma) = population standard deviation, α (alpha) = significance level."
        feedback_nl: "Correct! μ (mu) = populatiegemiddelde, σ (sigma) = populatiestandaarddeviatie, α (alpha) = significantieniveau."
      - text_en: "μ, n and σ"
        text_nl: "μ, n en σ"
        correct: false
        feedback_en: "Incorrect. n is the sample size, not the significance level. The significance level is α (alpha)."
        feedback_nl: "Onjuist. n is de steekproefgrootte, niet het significantieniveau. Het significantieniveau is α (alpha)."
      - text_en: "x̄, α and n"
        text_nl: "x̄, α en n"
        correct: false
        feedback_en: "Incorrect. x̄ is the sample mean (not population mean μ), and n is sample size (not standard deviation σ)."
        feedback_nl: "Onjuist. x̄ is het steekproefgemiddelde (niet populatiegemiddelde μ), en n is de steekproefgrootte (niet standaarddeviatie σ)."

  - id: 46
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A point estimate with a 95% confidence interval is given as 15 ± 12. What is the upper value for the interval?"
    question_nl: "Een puntschatting met een 95% betrouwbaarheidsinterval is gegeven als 15 ± 12. Wat is de bovengrens van het interval?"
    answers:
      - text_en: "27"
        text_nl: "27"
        correct: true
        feedback_en: "Correct! Upper bound = point estimate + margin of error = 15 + 12 = 27."
        feedback_nl: "Correct! Bovengrens = puntschatting + foutmarge = 15 + 12 = 27."
      - text_en: "3"
        text_nl: "3"
        correct: false
        feedback_en: "Incorrect. 3 is the lower bound (15 − 12 = 3). The question asks for the upper bound."
        feedback_nl: "Onjuist. 3 is de ondergrens (15 − 12 = 3). De vraag vraagt naar de bovengrens."
      - text_en: "21"
        text_nl: "21"
        correct: false
        feedback_en: "Incorrect. 21 does not follow from 15 ± 12. Upper = 15 + 12 = 27."
        feedback_nl: "Onjuist. 21 volgt niet uit 15 ± 12. Bovengrens = 15 + 12 = 27."
      - text_en: "12"
        text_nl: "12"
        correct: false
        feedback_en: "Incorrect. 12 is the margin of error, not the upper bound of the interval."
        feedback_nl: "Onjuist. 12 is de foutmarge, niet de bovengrens van het interval."

  - id: 47
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A point estimate with a 95% confidence interval is given as 72 ± 7. What is the lower value for the interval?"
    question_nl: "Een puntschatting met een 95% betrouwbaarheidsinterval is gegeven als 72 ± 7. Wat is de ondergrens van het interval?"
    answers:
      - text_en: "72"
        text_nl: "72"
        correct: false
        feedback_en: "Incorrect. 72 is the point estimate itself, not the lower bound. Lower = 72 − 7 = 65."
        feedback_nl: "Onjuist. 72 is de puntschatting zelf, niet de ondergrens. Ondergrens = 72 − 7 = 65."
      - text_en: "79"
        text_nl: "79"
        correct: false
        feedback_en: "Incorrect. 79 is the upper bound (72 + 7). The question asks for the lower bound."
        feedback_nl: "Onjuist. 79 is de bovengrens (72 + 7). De vraag vraagt naar de ondergrens."
      - text_en: "7"
        text_nl: "7"
        correct: false
        feedback_en: "Incorrect. 7 is the margin of error. Lower bound = point estimate − margin = 72 − 7 = 65."
        feedback_nl: "Onjuist. 7 is de foutmarge. Ondergrens = puntschatting − marge = 72 − 7 = 65."
      - text_en: "65"
        text_nl: "65"
        correct: true
        feedback_en: "Correct! Lower bound = 72 − 7 = 65."
        feedback_nl: "Correct! Ondergrens = 72 − 7 = 65."

  - id: 48
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "We asked 120 people whether they drink cola. 90 people indicated they drink cola. What percentage drinks cola?"
    question_nl: "We vroegen 120 mensen of ze cola drinken. 90 mensen gaven aan cola te drinken. Welk percentage drinkt cola?"
    answers:
      - text_en: "25%"
        text_nl: "25%"
        correct: false
        feedback_en: "Incorrect. 25% would be 30 out of 120. We have 90 out of 120."
        feedback_nl: "Onjuist. 25% zou 30 van de 120 zijn. We hebben 90 van de 120."
      - text_en: "75%"
        text_nl: "75%"
        correct: true
        feedback_en: "Correct! 90 / 120 × 100% = 75%."
        feedback_nl: "Correct! 90 / 120 × 100% = 75%."
      - text_en: "100%"
        text_nl: "100%"
        correct: false
        feedback_en: "Incorrect. 100% would mean all 120 people drink cola. Only 90 do."
        feedback_nl: "Onjuist. 100% zou betekenen dat alle 120 mensen cola drinken. Slechts 90 doen dat."
      - text_en: "90%"
        text_nl: "90%"
        correct: false
        feedback_en: "Incorrect. 90 is the count, not the percentage. Percentage = (90 / 120) × 100 = 75%."
        feedback_nl: "Onjuist. 90 is het aantal, niet het percentage. Percentage = (90 / 120) × 100 = 75%."

  # bron: Research Skills oefenvragen, slide 28
  - id: 49
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "The 95% confidence interval for the mean amount guests spend in the hotel restaurant is €42 to €58. Which interpretation is correct?"
    question_nl: "Het 95%-betrouwbaarheidsinterval voor het gemiddelde bedrag dat gasten in het hotelrestaurant besteden, loopt van €42 tot €58. Welke interpretatie is juist?"
    answers:
      - text_en: "We are 95% confident that the population mean lies between €42 and €58"
        text_nl: "We zijn er 95% zeker van dat het populatiegemiddelde tussen €42 en €58 ligt"
        correct: true
        feedback_en: "Correct! A confidence interval is an estimate of the population mean: we are 95% confident that the true mean spending of all guests lies between €42 and €58."
        feedback_nl: "Correct! Een betrouwbaarheidsinterval is een schatting van het populatiegemiddelde: we zijn er 95% zeker van dat de echte gemiddelde besteding van alle gasten tussen €42 en €58 ligt."
      - text_en: "95% of all guests spend between €42 and €58"
        text_nl: "95% van alle gasten besteedt tussen €42 en €58"
        correct: false
        feedback_en: "Incorrect. The interval is about the population mean, not about individual guests. Individual amounts vary much more."
        feedback_nl: "Onjuist. Het interval zegt iets over het populatiegemiddelde, niet over individuele gasten. Individuele bedragen variëren veel meer."
      - text_en: "The sample mean lies between €42 and €58 with 95% probability"
        text_nl: "Het steekproefgemiddelde ligt met 95% kans tussen €42 en €58"
        correct: false
        feedback_en: "Incorrect. The sample mean (€50) always lies exactly in the middle of the interval; there is no probability attached to it."
        feedback_nl: "Onjuist. Het steekproefgemiddelde (€50) ligt altijd precies in het midden van het interval; daar is geen kans aan verbonden."
      - text_en: "5% of all guests spend more than €58"
        text_nl: "5% van alle gasten besteedt meer dan €58"
        correct: false
        feedback_en: "Incorrect. The interval says nothing about individual guests' spending, and the 5% would in any case be split over both sides."
        feedback_nl: "Onjuist. Het interval zegt niets over de besteding van individuele gasten, en de 5% zou bovendien over beide kanten verdeeld zijn."

  # bron: Research Skills oefenvragen, slide 30
  - id: 50
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "Which change makes a confidence interval narrower, all else being equal?"
    question_nl: "Welke verandering maakt een betrouwbaarheidsinterval smaller, als al het andere gelijk blijft?"
    answers:
      - text_en: "Raising the confidence level from 95% to 99%"
        text_nl: "Het betrouwbaarheidsniveau verhogen van 95% naar 99%"
        correct: false
        feedback_en: "Incorrect. More confidence requires a wider interval: a 99% interval is wider than a 95% interval."
        feedback_nl: "Onjuist. Meer zekerheid vraagt een breder interval: een 99%-interval is breder dan een 95%-interval."
      - text_en: "Increasing the sample size"
        text_nl: "De steekproef vergroten"
        correct: true
        feedback_en: "Correct! A larger sample gives a smaller standard error and therefore a narrower interval."
        feedback_nl: "Correct! Een grotere steekproef geeft een kleinere standaardfout en dus een smaller interval."
      - text_en: "Decreasing the sample size"
        text_nl: "De steekproef verkleinen"
        correct: false
        feedback_en: "Incorrect. A smaller sample gives a larger standard error, so the interval becomes wider."
        feedback_nl: "Onjuist. Een kleinere steekproef geeft een grotere standaardfout, dus het interval wordt breder."
      - text_en: "A larger standard deviation in the sample"
        text_nl: "Een grotere standaarddeviatie in de steekproef"
        correct: false
        feedback_en: "Incorrect. More spread increases the standard error and makes the interval wider."
        feedback_nl: "Onjuist. Meer spreiding vergroot de standaardfout en maakt het interval breder."

  # ── HYPOTHESETOETSING ─────────────────────────────────────────────────────

  # bron: Research Skills oefenvragen, slide 25
  - id: 51
    topic_en: "Hypothesis Testing"
    topic_nl: "Hypothesetoetsing"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A statistical test gives p = 0.003 (α = 0.05). Which statement is correct?"
    question_nl: "Een statistische toets geeft p = 0,003 (α = 0,05). Welke uitspraak is juist?"
    answers:
      - text_en: "We retain H0, because p is smaller than α"
        text_nl: "We behouden H0, omdat p kleiner is dan α"
        correct: false
        feedback_en: "Incorrect. It is the other way around: if p is smaller than α, you reject H0."
        feedback_nl: "Onjuist. Het is precies andersom: als p kleiner is dan α, verwerp je H0."
      - text_en: "There is a 0.3% probability that H1 is true"
        text_nl: "Er is 0,3% kans dat H1 waar is"
        correct: false
        feedback_en: "Incorrect. The p-value is the probability of these (or more extreme) results if H0 is true, not the probability that H1 (or H0) is true."
        feedback_nl: "Onjuist. De p-waarde is de kans op deze (of extremere) resultaten als H0 waar is, niet de kans dat H1 (of H0) waar is."
      - text_en: "The effect is large, because p is very small"
        text_nl: "Het effect is groot, omdat p heel klein is"
        correct: false
        feedback_en: "Incorrect. A small p says nothing about the size of the effect: with a large sample even a small effect is significant. Use an effect size for that."
        feedback_nl: "Onjuist. Een kleine p zegt niets over de grootte van het effect: bij een grote steekproef is ook een klein effect significant. Daarvoor gebruik je een effectgrootte."
      - text_en: "We reject H0; the result is statistically significant"
        text_nl: "We verwerpen H0; het resultaat is statistisch significant"
        correct: true
        feedback_en: "Correct! p = 0.003 is smaller than α = 0.05, so H0 is rejected and the result is statistically significant."
        feedback_nl: "Correct! p = 0,003 is kleiner dan α = 0,05, dus H0 wordt verworpen en het resultaat is statistisch significant."

  # bron: Research Skills oefenvragen, slide 31
  - id: 52
    topic_en: "Hypothesis Testing"
    topic_nl: "Hypothesetoetsing"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "H1: 'The average length of stay of business guests differs from that of leisure guests.' Which kind of test fits this hypothesis?"
    question_nl: "H1: 'De gemiddelde verblijfsduur van zakelijke gasten verschilt van die van toeristische gasten.' Welk type toets past bij deze hypothese?"
    answers:
      - text_en: "A one-tailed test (left)"
        text_nl: "Een eenzijdige toets (links)"
        correct: false
        feedback_en: "Incorrect. A left-tailed test fits a directed hypothesis such as 'shorter than'. 'Differs from' gives no direction."
        feedback_nl: "Onjuist. Een linkszijdige toets past bij een gerichte hypothese zoals 'korter dan'. 'Verschilt van' noemt geen richting."
      - text_en: "A one-tailed test (right)"
        text_nl: "Een eenzijdige toets (rechts)"
        correct: false
        feedback_en: "Incorrect. A right-tailed test fits a directed hypothesis such as 'longer than'. 'Differs from' gives no direction."
        feedback_nl: "Onjuist. Een rechtszijdige toets past bij een gerichte hypothese zoals 'langer dan'. 'Verschilt van' noemt geen richting."
      - text_en: "A two-tailed test"
        text_nl: "Een tweezijdige toets"
        correct: true
        feedback_en: "Correct! 'Differs from' names no direction: business guests could stay longer or shorter. With an undirected hypothesis you test two-tailed."
        feedback_nl: "Correct! 'Verschilt van' noemt geen richting: zakelijke gasten kunnen zowel langer als korter blijven. Bij een ongerichte hypothese toets je tweezijdig."
      - text_en: "No test is needed"
        text_nl: "Er is geen toets nodig"
        correct: false
        feedback_en: "Incorrect. To conclude from a sample whether the population means differ, you always need a statistical test."
        feedback_nl: "Onjuist. Om op basis van een steekproef te concluderen of de populatiegemiddelden verschillen, heb je altijd een statistische toets nodig."

