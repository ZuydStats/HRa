# HRa Quiz Questions
# Edit directly in GitHub. No rebuild needed — the quiz loads this file at runtime.
# Format: question_en (English, shown in italics), question_nl (Dutch, regular)
# Each answer: text_en, text_nl, correct (true/false), feedback_en, feedback_nl
# topic_link: absolute path on the site for the study material page
# Questions are shown in id order and grouped by topic (course order).

questions:

  # ── HYPOTHESEN ────────────────────────────────────────────────────────────

  - id: 1
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A hypothesis is a statement about"
    question_nl: "Een hypothese is een uitspraak over"
    answers:
      - text_en: "A proportion"
        text_nl: "Een proportie"
        correct: false
        feedback_en: "Incorrect. A proportion is a calculated statistic, not what a hypothesis makes a claim about."
        feedback_nl: "Onjuist. Een proportie is een berekende statistiek, niet waar een hypothese een uitspraak over doet."
      - text_en: "A population"
        text_nl: "Een populatie"
        correct: true
        feedback_en: "Correct! A hypothesis is a statement about a population — a claim we test using sample data."
        feedback_nl: "Correct! Een hypothese is een uitspraak over een populatie — een bewering die we testen met steekproefdata."
      - text_en: "A result"
        text_nl: "Een resultaat"
        correct: false
        feedback_en: "Incorrect. A result is what you find after analysis. A hypothesis is formulated before testing."
        feedback_nl: "Onjuist. Een resultaat is wat je vindt ná de analyse. Een hypothese formuleer je vóór het testen."

  - id: 2
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A null hypothesis in the context of an experiment is"
    question_nl: "Een nulhypothese is in de context van een experiment"
    answers:
      - text_en: "The hypothesis that gets rejected if the alternative hypothesis is not true"
        text_nl: "De hypothese die verworpen wordt als de alternatieve hypothese niet waar is"
        correct: false
        feedback_en: "Incorrect. The null hypothesis is not rejected because the alternative is false — it is rejected only when the data provide sufficient evidence against it."
        feedback_nl: "Onjuist. De nulhypothese wordt niet verworpen omdat de alternatieve hypothese onwaar is — maar alleen als de data voldoende bewijs leveren tégen de nulhypothese."
      - text_en: "The hypothesis that gets rejected only if sufficient statistical evidence is present"
        text_nl: "De hypothese die alleen verworpen wordt als er voldoende statistisch bewijs aanwezig is"
        correct: true
        feedback_en: "Correct! The null hypothesis (H₀) is the default assumption of no effect. We reject it only when the p-value falls below the significance level (α)."
        feedback_nl: "Correct! De nulhypothese (H₀) is de standaardaanname dat er geen effect is. We verwerpen hem alleen als de p-waarde onder het significantieniveau (α) valt."

  - id: 3
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "If my experimental hypothesis were \"eating cheese before bed affects the number of nightmares you have\", what would the null hypothesis be?"
    question_nl: "Als mijn onderzoekshypothese luidt: 'Het eten van kaas voor het slapengaan beïnvloedt het aantal nachtmerries', wat is dan de nulhypothese?"
    answers:
      - text_en: "The number of nightmares you have is not affected by eating cheese before bed"
        text_nl: "Het aantal nachtmerries wordt niet beïnvloed door het eten van kaas voor het slapengaan"
        correct: true
        feedback_en: "Correct! The null hypothesis always states there is no effect. It is the logical opposite of the experimental (alternative) hypothesis."
        feedback_nl: "Correct! De nulhypothese stelt altijd dat er geen effect is. Het is het logische tegendeel van de onderzoekshypothese (alternatieve hypothese)."
      - text_en: "The number of nightmares you have is affected by eating cheese before bed"
        text_nl: "Het aantal nachtmerries wordt wél beïnvloed door het eten van kaas voor het slapengaan"
        correct: false
        feedback_en: "Incorrect. This is the alternative hypothesis (H₁), not the null hypothesis. H₀ always states the absence of an effect."
        feedback_nl: "Onjuist. Dit is de alternatieve hypothese (H₁), niet de nulhypothese. H₀ stelt altijd de afwezigheid van een effect."

  - id: 4
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "Research hypotheses (null / alternative) must be posed in forms that allow them to be"
    question_nl: "Onderzoekshypothesen (nul- / alternatief) moeten zo geformuleerd worden dat ze"
    answers:
      - text_en: "Assumed"
        text_nl: "Aangenomen"
        correct: false
        feedback_en: "Incorrect. We never simply assume a hypothesis to be true — we test it."
        feedback_nl: "Onjuist. We nemen een hypothese nooit zomaar als waar aan — we toetsen hem."
      - text_en: "Rejected"
        text_nl: "Verworpen"
        correct: true
        feedback_en: "Correct! Hypotheses must be falsifiable — formulated so they can be statistically rejected. We can only reject H₀; we never 'prove' it true."
        feedback_nl: "Correct! Hypothesen moeten falsifieerbaar zijn — zo geformuleerd dat ze statistisch verworpen kunnen worden. We kunnen H₀ alleen verwerpen; we 'bewijzen' hem nooit."
      - text_en: "Analysed"
        text_nl: "Geanalyseerd"
        correct: false
        feedback_en: "Incorrect. Analysis is a method, not the goal of formulation. The key requirement is that hypotheses must be testable and rejectable."
        feedback_nl: "Onjuist. Analyse is een methode, niet het doel van de formulering. De kerneis is dat hypothesen toetsbaar en verwerpbaar moeten zijn."

  - id: 5
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "You expect that male HMSM students spend more hours on their side job compared to female HMSM students. How do you formulate the null hypothesis and the alternative hypothesis?"
    question_nl: "Je verwacht dat mannelijke HMSM-studenten meer uren aan hun bijbaan besteden dan vrouwelijke HMSM-studenten. Hoe formuleer je de nulhypothese en de alternatieve hypothese?"
    answers:
      - text_en: "H₀: πmale ≤ πfemale and H₁: πmale > πfemale"
        text_nl: "H₀: πmale ≤ πfemale en H₁: πmale > πfemale"
        correct: false
        feedback_en: "Incorrect. π (pi) is the symbol for a proportion. Hours worked is a continuous variable, so use μ (mean), not π."
        feedback_nl: "Onjuist. π (pi) is het symbool voor een proportie. Gewerkte uren is een continue variabele, dus gebruik μ (gemiddelde), niet π."
      - text_en: "H₀: μmale ≤ μfemale and H₁: μmale > μfemale"
        text_nl: "H₀: μmale ≤ μfemale en H₁: μmale > μfemale"
        correct: true
        feedback_en: "Correct! Hours worked is continuous → use μ. The expectation is that males work more (H₁: μmale > μfemale), so H₀ is the opposite: μmale ≤ μfemale."
        feedback_nl: "Correct! Gewerkte uren is continu → gebruik μ. De verwachting is dat mannen meer werken (H₁: μmale > μfemale), dus H₀ is het tegendeel: μmale ≤ μfemale."
      - text_en: "H₀: μmale > μfemale and H₁: μmale ≤ μfemale"
        text_nl: "H₀: μmale > μfemale en H₁: μmale ≤ μfemale"
        correct: false
        feedback_en: "Incorrect. H₀ and H₁ are swapped. H₀ always represents 'no effect' or the opposite of your expectation."
        feedback_nl: "Onjuist. H₀ en H₁ zijn omgedraaid. H₀ vertegenwoordigt altijd 'geen effect' of het tegendeel van je verwachting."
      - text_en: "H₀: πmale > πfemale and H₁: πmale ≤ πfemale"
        text_nl: "H₀: πmale > πfemale en H₁: πmale ≤ πfemale"
        correct: false
        feedback_en: "Incorrect. π is for proportions (e.g. yes/no questions). Use μ for continuous variables like hours worked. Also H₀ and H₁ are reversed."
        feedback_nl: "Onjuist. π is voor proporties (bijv. ja/nee-vragen). Gebruik μ voor continue variabelen zoals gewerkte uren. Ook zijn H₀ en H₁ omgedraaid."

  - id: 6
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "You assume that of all HMSM students more males than females smoke. How do you formulate the null hypothesis and alternative hypothesis?"
    question_nl: "Je neemt aan dat van alle HMSM-studenten meer mannen dan vrouwen roken. Hoe formuleer je de nulhypothese en de alternatieve hypothese?"
    answers:
      - text_en: "H₀: πmale > πfemale and H₁: πmale ≤ πfemale"
        text_nl: "H₀: πmale > πfemale en H₁: πmale ≤ πfemale"
        correct: false
        feedback_en: "Incorrect. H₀ and H₁ are swapped. H₀ is the null (no effect / opposite of expectation). Your expectation (more males smoke) becomes H₁."
        feedback_nl: "Onjuist. H₀ en H₁ zijn omgedraaid. H₀ is de nul (geen effect / tegendeel van verwachting). Je verwachting (meer mannen roken) wordt H₁."
      - text_en: "H₀: μmale > μfemale and H₁: μmale ≤ μfemale"
        text_nl: "H₀: μmale > μfemale en H₁: μmale ≤ μfemale"
        correct: false
        feedback_en: "Incorrect. Smoking (yes/no) is a proportion, so use π (not μ). Also H₀ and H₁ are reversed."
        feedback_nl: "Onjuist. Roken (ja/nee) is een proportie, dus gebruik π (niet μ). Ook zijn H₀ en H₁ omgedraaid."
      - text_en: "H₀: πmale ≤ πfemale and H₁: πmale > πfemale"
        text_nl: "H₀: πmale ≤ πfemale en H₁: πmale > πfemale"
        correct: true
        feedback_en: "Correct! Smoking is categorical (yes/no) → use π (proportion). The expectation (more males smoke) = H₁: πmale > πfemale. H₀ is the opposite."
        feedback_nl: "Correct! Roken is categorisch (ja/nee) → gebruik π (proportie). De verwachting (meer mannen roken) = H₁: πmale > πfemale. H₀ is het tegendeel."
      - text_en: "H₀: μmale ≤ μfemale and H₁: μmale > μfemale"
        text_nl: "H₀: μmale ≤ μfemale en H₁: μmale > μfemale"
        correct: false
        feedback_en: "Incorrect. Use π for proportions (binary variables like yes/no smoking), not μ which is for continuous variables."
        feedback_nl: "Onjuist. Gebruik π voor proporties (binaire variabelen zoals ja/nee roken), niet μ dat voor continue variabelen is."

  # bron: Research Skills oefenvragen, slide 24
  - id: 7
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A hotel chain expects guests who receive a welcome drink (μ1) to give a higher satisfaction score than guests who do not (μ2). Which hypotheses fit this expectation?"
    question_nl: "Een hotelketen verwacht dat gasten die een welkomstdrankje krijgen (μ1) een hogere tevredenheidsscore geven dan gasten die dat niet krijgen (μ2). Welke hypothesen passen bij deze verwachting?"
    answers:
      - text_en: "H0: μ1 = μ2 · H1: μ1 ≠ μ2"
        text_nl: "H0: μ1 = μ2 · H1: μ1 ≠ μ2"
        correct: false
        feedback_en: "Incorrect. This is a two-sided pair of hypotheses. The expectation has a direction ('higher'), so H1 should be one-sided."
        feedback_nl: "Onjuist. Dit is een tweezijdig paar hypothesen. De verwachting heeft een richting ('hoger'), dus H1 moet eenzijdig zijn."
      - text_en: "H0: μ1 ≤ μ2 · H1: μ1 > μ2"
        text_nl: "H0: μ1 ≤ μ2 · H1: μ1 > μ2"
        correct: true
        feedback_en: "Correct! The expectation (μ1 is larger) goes into H1; H0 contains the equals sign and the other direction. The question is about mean scores, so μ is used."
        feedback_nl: "Correct! De verwachting (μ1 is groter) staat in H1; H0 bevat het gelijkteken en de andere richting. Het gaat om gemiddelde scores, dus gebruik je μ."
      - text_en: "H0: μ1 > μ2 · H1: μ1 ≤ μ2"
        text_nl: "H0: μ1 > μ2 · H1: μ1 ≤ μ2"
        correct: false
        feedback_en: "Incorrect. H0 and H1 are swapped: the expectation belongs in H1, and the equals sign always belongs in H0."
        feedback_nl: "Onjuist. H0 en H1 zijn omgedraaid: de verwachting hoort in H1, en het gelijkteken hoort altijd in H0."
      - text_en: "H0: π1 ≤ π2 · H1: π1 > π2"
        text_nl: "H0: π1 ≤ π2 · H1: π1 > π2"
        correct: false
        feedback_en: "Incorrect. The direction is right, but π is used for proportions. Satisfaction scores are compared as means, so μ is the correct symbol."
        feedback_nl: "Onjuist. De richting klopt, maar π gebruik je voor proporties. Tevredenheidsscores vergelijk je als gemiddelden, dus μ is het juiste symbool."

  # ── ONDERZOEKSMETHODEN ────────────────────────────────────────────────────

  - id: 8
    topic_en: "Research Methods"
    topic_nl: "Onderzoeksmethoden"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "What does operationalization mean?"
    question_nl: "Wat betekent operationalisering?"
    answers:
      - text_en: "Using multiple methods to increase reliability"
        text_nl: "Meerdere methoden gebruiken om de betrouwbaarheid te verhogen"
        correct: false
        feedback_en: "Incorrect. Using multiple methods is called triangulation. Operationalization is about making abstract concepts measurable."
        feedback_nl: "Onjuist. Het gebruik van meerdere methoden heet triangulatie. Operationalisering gaat over het meetbaar maken van abstracte concepten."
      - text_en: "Generalizing findings from the sample to the population"
        text_nl: "Bevindingen vanuit de steekproef generaliseren naar de populatie"
        correct: false
        feedback_en: "Incorrect. Generalizing findings is called external validity or generalizability. Operationalization is defining how you will measure a concept."
        feedback_nl: "Onjuist. Het generaliseren van bevindingen heet externe validiteit of generaliseerbaarheid. Operationalisering is het definiëren van hoe je een concept gaat meten."
      - text_en: "Developing standard instruments"
        text_nl: "Standaardinstrumenten ontwikkelen"
        correct: false
        feedback_en: "Incorrect. While developing instruments is part of the process, operationalization specifically means translating abstract concepts into measurable variables."
        feedback_nl: "Onjuist. Hoewel het ontwikkelen van instrumenten deel uitmaakt van het proces, betekent operationalisering specifiek het vertalen van abstracte concepten naar meetbare variabelen."
      - text_en: "Developing concepts into measurable instruments"
        text_nl: "Concepten omzetten in meetbare instrumenten"
        correct: true
        feedback_en: "Correct! Operationalization is the process of defining how an abstract concept (e.g. 'job satisfaction') will be measured in practice."
        feedback_nl: "Correct! Operationalisering is het proces waarbij een abstract concept (bijv. 'werktevredenheid') wordt omgezet in een meetbare variabele."

  # ── TYPE I & II FOUTEN ────────────────────────────────────────────────────

  - id: 9
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "What does it mean if something is statistically significant?"
    question_nl: "Wat betekent het als iets statistisch significant is?"
    answers:
      - text_en: "That it is reliable"
        text_nl: "Dat het betrouwbaar is"
        correct: false
        feedback_en: "Incorrect. Reliability refers to consistency of measurement. Statistical significance means the result is unlikely due to chance."
        feedback_nl: "Onjuist. Betrouwbaarheid verwijst naar consistentie van meting. Statistische significantie betekent dat het resultaat waarschijnlijk niet op toeval berust."
      - text_en: "That it is valid"
        text_nl: "Dat het valide is"
        correct: false
        feedback_en: "Incorrect. Validity means we are measuring what we intend to measure. Significance is about the probability that results occurred by chance."
        feedback_nl: "Onjuist. Validiteit betekent dat we meten wat we bedoelen te meten. Significantie gaat over de kans dat resultaten op toeval berusten."
      - text_en: "That it has meaning"
        text_nl: "Dat het betekenis heeft"
        correct: true
        feedback_en: "Correct! Statistical significance means the observed result is unlikely to have occurred by chance (p < α). Note: significant does not always mean practically important."
        feedback_nl: "Correct! Statistische significantie betekent dat het gevonden resultaat waarschijnlijk niet op toeval berust (p < α). Let op: significant betekent niet altijd praktisch belangrijk."

  - id: 10
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "What is correct when talking about a type I error?"
    question_nl: "Wat is juist over een type I-fout?"
    answers:
      - text_en: "It can be ruled out"
        text_nl: "Hij kan worden uitgesloten"
        correct: false
        feedback_en: "Incorrect. A Type I error can never be completely ruled out — it occurs with probability α (the significance level) every time we test."
        feedback_nl: "Onjuist. Een type I-fout kan nooit volledig worden uitgesloten — hij treedt op met kans α (het significantieniveau) elke keer dat we toetsen."
      - text_en: "It is a false negative"
        text_nl: "Het is een vals negatief"
        correct: false
        feedback_en: "Incorrect. A false negative is a Type II error (failing to reject H₀ when it is actually false). A Type I error is a false positive."
        feedback_nl: "Onjuist. Een vals negatief is een type II-fout (H₀ niet verwerpen terwijl hij wél onjuist is). Een type I-fout is een vals positief."
      - text_en: "It is a false positive"
        text_nl: "Het is een vals positief"
        correct: true
        feedback_en: "Correct! A Type I error (α) occurs when we reject H₀ even though it is true — a false positive. The probability equals the significance level α."
        feedback_nl: "Correct! Een type I-fout (α) treedt op als we H₀ verwerpen terwijl hij waar is — een vals positief. De kans hierop is gelijk aan het significantieniveau α."

  - id: 11
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    image: "images/q_type_errors_ab.png"
    question_en: "See the figure above. Which error is made in situation A and in situation B?"
    question_nl: "Zie de figuur hierboven. Welke fout wordt gemaakt in situatie A en in situatie B?"
    answers:
      - text_en: "A: type II error – B: type I error"
        text_nl: "A: type II-fout – B: type I-fout"
        correct: true
        feedback_en: "Correct! Type II error (β): failing to reject a false H₀. Type I error (α): rejecting a true H₀."
        feedback_nl: "Correct! Type II-fout (β): een onjuiste H₀ niet verwerpen. Type I-fout (α): een juiste H₀ wel verwerpen."
      - text_en: "A: type I error – B: type II error"
        text_nl: "A: type I-fout – B: type II-fout"
        correct: false
        feedback_en: "Incorrect. The labels are reversed. A = Type II (false negative), B = Type I (false positive)."
        feedback_nl: "Onjuist. De labels zijn omgewisseld. A = type II (vals negatief), B = type I (vals positief)."
      - text_en: "A and B are both a type I error"
        text_nl: "A en B zijn allebei een type I-fout"
        correct: false
        feedback_en: "Incorrect. They represent different errors. Type I = false positive (reject true H₀). Type II = false negative (retain false H₀)."
        feedback_nl: "Onjuist. Ze vertegenwoordigen verschillende fouten. Type I = vals positief (juiste H₀ verwerpen). Type II = vals negatief (onjuiste H₀ behouden)."
      - text_en: "A and B are both a type II error"
        text_nl: "A en B zijn allebei een type II-fout"
        correct: false
        feedback_en: "Incorrect. A is Type II, but B is Type I. They are different errors with different probabilities (β and α respectively)."
        feedback_nl: "Onjuist. A is type II, maar B is type I. Het zijn verschillende fouten met verschillende kansen (respectievelijk β en α)."

  - id: 12
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "Which statement about a type II error is false?"
    question_nl: "Welke uitspraak over een type II-fout is onjuist?"
    answers:
      - text_en: "The null hypothesis will not be rejected in a type II error"
        text_nl: "De nulhypothese wordt niet verworpen bij een type II-fout"
        correct: false
        feedback_en: "This statement is TRUE — in a Type II error, H₀ is not rejected even though it should be. This is therefore not the false statement."
        feedback_nl: "Deze uitspraak is WAAR — bij een type II-fout wordt H₀ niet verworpen, terwijl dat wel zou moeten. Dit is dus niet de onjuiste uitspraak."
      - text_en: "The chance of a type II error is equal to the significance level alpha"
        text_nl: "De kans op een type II-fout is gelijk aan het significantieniveau alpha"
        correct: true
        feedback_en: "Correct — this statement IS false! Alpha (α) is the probability of a Type I error. The probability of a Type II error is beta (β), not alpha."
        feedback_nl: "Correct — deze uitspraak IS onjuist! Alpha (α) is de kans op een type I-fout. De kans op een type II-fout is bèta (β), niet alpha."
      - text_en: "The alternative hypothesis will be rejected in a type II error"
        text_nl: "De alternatieve hypothese wordt verworpen bij een type II-fout"
        correct: false
        feedback_en: "This statement is TRUE — when H₀ is not rejected, H₁ (the alternative) is implicitly rejected. This is therefore not the false statement."
        feedback_nl: "Deze uitspraak is WAAR — als H₀ niet verworpen wordt, wordt H₁ (de alternatieve) impliciet verworpen. Dit is dus niet de onjuiste uitspraak."

  # bron: Research Skills oefenvragen, slide 26
  - id: 13
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "A hotel tests whether a new booking website increases the number of bookings (H0: no increase). It concludes that bookings increase, but in reality they do not. Which error is made?"
    question_nl: "Een hotel toetst of een nieuwe boekingswebsite het aantal boekingen verhoogt (H0: geen stijging). Het hotel concludeert dat de boekingen stijgen, maar in werkelijkheid is dat niet zo. Welke fout wordt gemaakt?"
    answers:
      - text_en: "A type II error"
        text_nl: "Een type II-fout"
        correct: false
        feedback_en: "Incorrect. A type II error means not rejecting a false H0 (missing a real effect). Here H0 is true and is wrongly rejected."
        feedback_nl: "Onjuist. Een type II-fout is een onware H0 niet verwerpen (een echt effect missen). Hier is H0 waar en wordt hij onterecht verworpen."
      - text_en: "No error"
        text_nl: "Geen fout"
        correct: false
        feedback_en: "Incorrect. The hotel concludes there is an increase while there is none: that is a wrong conclusion, so an error is made."
        feedback_nl: "Onjuist. Het hotel concludeert dat er een stijging is terwijl die er niet is: dat is een verkeerde conclusie, dus er wordt wel een fout gemaakt."
      - text_en: "A type I error"
        text_nl: "Een type I-fout"
        correct: true
        feedback_en: "Correct! H0 (no increase) is actually true, but the hotel rejects it. A type I error is wrongly rejecting a true H0: a 'false alarm'. Its probability is α."
        feedback_nl: "Correct! H0 (geen stijging) is in werkelijkheid waar, maar het hotel verwerpt H0. Een type I-fout is het onterecht verwerpen van een ware H0: een 'vals alarm'. De kans hierop is α."
      - text_en: "A measurement error"
        text_nl: "Een meetfout"
        correct: false
        feedback_en: "Incorrect. The bookings may have been counted correctly; the error is in the statistical conclusion, not in the measurement."
        feedback_nl: "Onjuist. De boekingen kunnen best correct geteld zijn; de fout zit in de statistische conclusie, niet in de meting."

  # bron: Research Skills oefenvragen, slide 27
  - id: 14
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "In court, H0 is 'the defendant is innocent'. A judge acquits a defendant who is actually guilty. Which error is this?"
    question_nl: "In de rechtszaal is H0 'de verdachte is onschuldig'. Een rechter spreekt een verdachte vrij die in werkelijkheid schuldig is. Welke fout is dit?"
    answers:
      - text_en: "A type I error"
        text_nl: "Een type I-fout"
        correct: false
        feedback_en: "Incorrect. A type I error would be convicting an innocent defendant (rejecting a true H0). Here H0 is false and is not rejected."
        feedback_nl: "Onjuist. Een type I-fout zou zijn: een onschuldige veroordelen (een ware H0 verwerpen). Hier is H0 onwaar en wordt hij niet verworpen."
      - text_en: "A type II error"
        text_nl: "Een type II-fout"
        correct: true
        feedback_en: "Correct! H0 (innocent) is actually false, but the judge does not reject it. A type II error is failing to reject a false H0: you miss an effect that really exists."
        feedback_nl: "Correct! H0 (onschuldig) is in werkelijkheid onwaar, maar de rechter verwerpt H0 niet. Een type II-fout is het niet verwerpen van een onware H0: je mist een effect dat er wel is."
      - text_en: "No error, the judge followed the rules"
        text_nl: "Geen fout, de rechter volgde de regels"
        correct: false
        feedback_en: "Incorrect. Following the rules does not prevent a wrong conclusion: a guilty person walks free, so an error is made."
        feedback_nl: "Onjuist. De regels volgen voorkomt geen verkeerde conclusie: een schuldige gaat vrijuit, dus er wordt wel een fout gemaakt."
      - text_en: "Both a type I and a type II error"
        text_nl: "Zowel een type I- als een type II-fout"
        correct: false
        feedback_en: "Incorrect. One decision can only lead to one type of error: either H0 is wrongly rejected (type I) or wrongly not rejected (type II)."
        feedback_nl: "Onjuist. Eén beslissing kan maar tot één soort fout leiden: H0 wordt óf onterecht verworpen (type I) óf onterecht niet verworpen (type II)."

  # ── BETROUWBAARHEID & VALIDITEIT ──────────────────────────────────────────

  - id: 15
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    image: "images/q016_target.png"
    question_en: "See the figure above. The black dots represent the results of a test. It can be said that this test has:"
    question_nl: "Zie de figuur hierboven. De zwarte stippen staan voor de resultaten van een test. Er kan worden gesteld dat deze test:"
    answers:
      - text_en: "Low reliability and high validity"
        text_nl: "Lage betrouwbaarheid en hoge validiteit"
        correct: false
        feedback_en: "Incorrect. The dots are tightly clustered (high reliability), but not on the bullseye (low validity)."
        feedback_nl: "Onjuist. De stippen liggen dicht bij elkaar (hoge betrouwbaarheid), maar niet in de roos (lage validiteit)."
      - text_en: "High reliability and low validity"
        text_nl: "Hoge betrouwbaarheid en lage validiteit"
        correct: true
        feedback_en: "Correct! Clustered dots = consistent = reliable. Off-centre cluster = not measuring the target = low validity."
        feedback_nl: "Correct! Geclusterde stippen = consistent = betrouwbaar. Cluster niet in het midden = meet niet het doel = lage validiteit."
      - text_en: "High reliability and high validity"
        text_nl: "Hoge betrouwbaarheid en hoge validiteit"
        correct: false
        feedback_en: "Incorrect. High on both would mean dots clustered on the bullseye. The cluster here is off-centre."
        feedback_nl: "Onjuist. Hoog op beide zou betekenen dat de stippen geclusterd in de roos liggen. De cluster hier zit niet in het midden."
      - text_en: "Low reliability and low validity"
        text_nl: "Lage betrouwbaarheid en lage validiteit"
        correct: false
        feedback_en: "Incorrect. Low reliability would show scattered dots. These are tightly clustered, so reliability is high."
        feedback_nl: "Onjuist. Lage betrouwbaarheid zou verspreid liggende stippen geven. Deze zijn dicht geclusterd, dus de betrouwbaarheid is hoog."

  - id: 16
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "When the same questionnaire is filled in again and shows the same results, this questionnaire has got a high degree of:"
    question_nl: "Als dezelfde vragenlijst opnieuw wordt ingevuld en dezelfde resultaten oplevert, heeft deze vragenlijst een hoge mate van:"
    answers:
      - text_en: "Reliability"
        text_nl: "Betrouwbaarheid"
        correct: true
        feedback_en: "Correct! Reliability is consistency over repeated measurement. If results are the same each time, the instrument is reliable (test-retest reliability)."
        feedback_nl: "Correct! Betrouwbaarheid is consistentie bij herhaalde meting. Als de resultaten elke keer hetzelfde zijn, is het instrument betrouwbaar (test-hertestbetrouwbaarheid)."
      - text_en: "Validity"
        text_nl: "Validiteit"
        correct: false
        feedback_en: "Incorrect. Validity means the instrument measures what it is supposed to measure. Consistent results address reliability, not validity."
        feedback_nl: "Onjuist. Validiteit betekent dat het instrument meet wat het zou moeten meten. Consistente resultaten zeggen iets over betrouwbaarheid, niet over validiteit."
      - text_en: "Significance"
        text_nl: "Significantie"
        correct: false
        feedback_en: "Incorrect. Significance is a statistical concept about whether results are due to chance. It is not a property of a questionnaire's consistency."
        feedback_nl: "Onjuist. Significantie is een statistisch concept over of resultaten op toeval berusten. Het is geen eigenschap van de consistentie van een vragenlijst."

  - id: 17
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "Which concept refers to the degree to which an instrument accurately assesses the concept or skill a researcher is attempting to measure?"
    question_nl: "Welk concept verwijst naar de mate waarin een instrument nauwkeurig het concept of de vaardigheid meet die een onderzoeker probeert te meten?"
    answers:
      - text_en: "Criterion validity"
        text_nl: "Criteriumvaliditeit"
        correct: false
        feedback_en: "Incorrect. Criterion validity checks whether your measure correlates with an established criterion (e.g. a gold standard test), not whether it captures the construct itself."
        feedback_nl: "Onjuist. Criteriumvaliditeit controleert of jouw meting correleert met een vastgesteld criterium (bijv. een gouden standaardtest), niet of het de constructie zelf vastlegt."
      - text_en: "Construct validity"
        text_nl: "Constructvaliditeit"
        correct: true
        feedback_en: "Correct! Construct validity is the degree to which a test measures the theoretical construct it claims to measure (e.g. 'intelligence', 'job satisfaction')."
        feedback_nl: "Correct! Constructvaliditeit is de mate waarin een test het theoretische construct meet dat het beweert te meten (bijv. 'intelligentie', 'werkplezier')."
      - text_en: "Content validity"
        text_nl: "Inhoudsvaliditeit"
        correct: false
        feedback_en: "Incorrect. Content validity refers to whether the instrument covers all relevant aspects of the construct — whether the content is representative."
        feedback_nl: "Onjuist. Inhoudsvaliditeit verwijst naar of het instrument alle relevante aspecten van het construct omvat — of de inhoud representatief is."
      - text_en: "Concurrent validity"
        text_nl: "Gelijktijdige validiteit"
        correct: false
        feedback_en: "Incorrect. Concurrent validity compares your instrument's scores against another established instrument at the same point in time."
        feedback_nl: "Onjuist. Gelijktijdige validiteit vergelijkt de scores van jouw instrument met een ander gevestigd instrument op hetzelfde moment."

  - id: 18
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "An experiment is reliable if:"
    question_nl: "Een experiment is betrouwbaar als:"
    answers:
      - text_en: "Results are repeatable"
        text_nl: "De resultaten herhaalbaar zijn"
        correct: true
        feedback_en: "Correct! Reliability = consistency. If the same experiment produces the same results under the same conditions, it is reliable."
        feedback_nl: "Correct! Betrouwbaarheid = consistentie. Als hetzelfde experiment onder dezelfde omstandigheden dezelfde resultaten geeft, is het betrouwbaar."
      - text_en: "It has an expected outcome"
        text_nl: "Het een verwacht resultaat heeft"
        correct: false
        feedback_en: "Incorrect. Having an expected outcome relates to hypothesis formulation, not to whether the experiment is reliable."
        feedback_nl: "Onjuist. Een verwacht resultaat hebben heeft betrekking op hypotheseformulering, niet op of het experiment betrouwbaar is."
      - text_en: "The proportion is big enough"
        text_nl: "De proportie groot genoeg is"
        correct: false
        feedback_en: "Incorrect. Sample size affects statistical power and precision, but reliability refers to consistency of results regardless of sample size."
        feedback_nl: "Onjuist. Steekproefgrootte beïnvloedt statistische kracht en precisie, maar betrouwbaarheid verwijst naar consistentie van resultaten ongeacht steekproefgrootte."

  # bron: Research Skills oefenvragen, slide 21
  - id: 19
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "The same employees complete a questionnaire on work stress twice, two weeks apart, and get almost the same scores. What does this indicate?"
    question_nl: "Dezelfde medewerkers vullen een vragenlijst over werkstress twee keer in, met twee weken ertussen, en scoren bijna hetzelfde. Waar wijst dit op?"
    answers:
      - text_en: "High validity"
        text_nl: "Een hoge validiteit"
        correct: false
        feedback_en: "Incorrect. Stable scores do not tell you whether the questionnaire really measures work stress. That is validity, and it is not tested here."
        feedback_nl: "Onjuist. Stabiele scores zeggen niet of de vragenlijst echt werkstress meet. Dat is validiteit, en die wordt hier niet getoetst."
      - text_en: "High reliability"
        text_nl: "Een hoge betrouwbaarheid"
        correct: true
        feedback_en: "Correct! This is test-retest reliability: a reliable instrument gives the same outcome when repeated under the same conditions. Whether it really measures work stress (validity) is still unknown."
        feedback_nl: "Correct! Dit is test-hertestbetrouwbaarheid: een betrouwbaar instrument geeft bij herhaling onder dezelfde omstandigheden dezelfde uitkomst. Of de vragenlijst echt werkstress meet (validiteit), weet je hiermee nog niet."
      - text_en: "High generalisability"
        text_nl: "Een hoge generaliseerbaarheid"
        correct: false
        feedback_en: "Incorrect. Generalisability is about whether results apply to other people or situations, not about repeating a measurement with the same people."
        feedback_nl: "Onjuist. Generaliseerbaarheid gaat over de vraag of resultaten gelden voor andere mensen of situaties, niet over het herhalen van een meting bij dezelfde mensen."
      - text_en: "High representativeness"
        text_nl: "Een hoge representativiteit"
        correct: false
        feedback_en: "Incorrect. Representativeness is about whether the sample resembles the population, not about consistent scores over time."
        feedback_nl: "Onjuist. Representativiteit gaat over de vraag of de steekproef lijkt op de populatie, niet over consistente scores in de tijd."

  # bron: Research Skills oefenvragen, slide 22
  - id: 20
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A kitchen scale always shows exactly 200 grams too much. Measurements with this scale are…"
    question_nl: "Een keukenweegschaal geeft altijd precies 200 gram te veel aan. Metingen met deze weegschaal zijn…"
    answers:
      - text_en: "valid but not reliable"
        text_nl: "valide maar niet betrouwbaar"
        correct: false
        feedback_en: "Incorrect. It is the other way around: the scale is consistent (reliable) but always wrong (not valid)."
        feedback_nl: "Onjuist. Het is precies andersom: de weegschaal is consistent (betrouwbaar) maar zit er altijd naast (niet valide)."
      - text_en: "neither reliable nor valid"
        text_nl: "niet betrouwbaar en niet valide"
        correct: false
        feedback_en: "Incorrect. The error is always exactly the same (200 g), so the measurements are consistent and therefore reliable."
        feedback_nl: "Onjuist. De fout is steeds precies even groot (200 g), dus de metingen zijn consistent en daarmee betrouwbaar."
      - text_en: "reliable but not valid"
        text_nl: "betrouwbaar maar niet valide"
        correct: true
        feedback_en: "Correct! The scale gives the same (wrong) outcome every time: consistent, so reliable. But it does not measure the true weight: a systematic error, so not valid."
        feedback_nl: "Correct! De weegschaal geeft bij herhaling steeds dezelfde (verkeerde) uitkomst: consistent, dus betrouwbaar. Maar ze meet niet het echte gewicht: een systematische fout, dus niet valide."
      - text_en: "reliable and valid"
        text_nl: "betrouwbaar en valide"
        correct: false
        feedback_en: "Incorrect. The scale is reliable, but because it is always 200 g off it does not measure the true weight, so it is not valid."
        feedback_nl: "Onjuist. De weegschaal is wel betrouwbaar, maar omdat ze altijd 200 g te veel aangeeft meet ze niet het echte gewicht, dus ze is niet valide."

  # bron: Research Skills oefenvragen, slide 23
  - id: 21
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A research skills exam only contains questions about descriptive statistics, while the course also covers sampling and hypothesis testing. Which type of validity is low?"
    question_nl: "Een tentamen onderzoeksvaardigheden bevat alleen vragen over beschrijvende statistiek, terwijl de cursus ook steekproeven en hypothesetoetsing behandelt. Welke vorm van validiteit is laag?"
    answers:
      - text_en: "Content validity"
        text_nl: "Inhoudsvaliditeit"
        correct: true
        feedback_en: "Correct! Content validity is about whether an instrument covers the whole domain it should measure. An exam with only descriptive statistics covers just part of the course content."
        feedback_nl: "Correct! Inhoudsvaliditeit gaat over de vraag of een meetinstrument het hele domein dekt dat het moet meten. Een tentamen met alleen beschrijvende statistiek dekt maar een deel van de leerstof."
      - text_en: "Criterion validity"
        text_nl: "Criteriumvaliditeit"
        correct: false
        feedback_en: "Incorrect. Criterion validity compares scores with an external criterion (e.g. later performance). The problem here is missing content."
        feedback_nl: "Onjuist. Criteriumvaliditeit vergelijkt scores met een extern criterium (bijv. latere prestaties). Het probleem hier is ontbrekende inhoud."
      - text_en: "External validity"
        text_nl: "Externe validiteit"
        correct: false
        feedback_en: "Incorrect. External validity is about generalising results to other people or settings, not about which topics an exam covers."
        feedback_nl: "Onjuist. Externe validiteit gaat over het generaliseren van resultaten naar andere mensen of situaties, niet over welke onderwerpen een tentamen dekt."
      - text_en: "Internal validity"
        text_nl: "Interne validiteit"
        correct: false
        feedback_en: "Incorrect. Internal validity is about whether a study can draw causal conclusions (no confounding). That is not the issue here."
        feedback_nl: "Onjuist. Interne validiteit gaat over de vraag of een onderzoek causale conclusies kan trekken (geen verstorende variabelen). Daar gaat het hier niet om."

  # ── STEEKPROEF ────────────────────────────────────────────────────────────

  - id: 22
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "What is the most reliable type of sample?"
    question_nl: "Wat is het meest betrouwbare type steekproef?"
    answers:
      - text_en: "Stratified sample"
        text_nl: "Gestratificeerde steekproef"
        correct: false
        feedback_en: "Incorrect. Stratified sampling ensures representation of subgroups, but a simple random sample is considered the gold standard for reliability."
        feedback_nl: "Onjuist. Gestratificeerde steekproef zorgt voor representatie van subgroepen, maar een aselecte steekproef geldt als de gouden standaard voor betrouwbaarheid."
      - text_en: "Cluster sample"
        text_nl: "Clustersteekproef"
        correct: false
        feedback_en: "Incorrect. Cluster sampling is practical but less reliable because entire groups (clusters) are selected, introducing group-level bias."
        feedback_nl: "Onjuist. Clustersteekproef is praktisch maar minder betrouwbaar, omdat hele groepen (clusters) worden geselecteerd, wat groepsniveaubias introduceert."
      - text_en: "Random sample"
        text_nl: "Aselecte steekproef"
        correct: true
        feedback_en: "Correct! A random (probability) sample gives every member of the population an equal chance of selection, minimising systematic bias."
        feedback_nl: "Correct! Een aselecte (kansgebaseerde) steekproef geeft elk lid van de populatie een gelijke kans om geselecteerd te worden, waardoor systematische bias wordt geminimaliseerd."
      - text_en: "Convenience sample"
        text_nl: "Gelegenheidssteekproef"
        correct: false
        feedback_en: "Incorrect. A convenience sample uses whoever is easily available, making it highly susceptible to selection bias and the least reliable type."
        feedback_nl: "Onjuist. Een gelegenheidssteekproef gebruikt wie er gemakkelijk beschikbaar is, waardoor het erg gevoelig is voor selectiebias en het minst betrouwbare type is."

  # bron: Research Skills oefenvragen, slide 18
  - id: 23
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "To measure guest satisfaction, a researcher asks every guest who is in the hotel bar on Friday evening to fill in a questionnaire. What kind of sample is this?"
    question_nl: "Om de gasttevredenheid te meten, vraagt een onderzoeker alle gasten die vrijdagavond in de hotelbar zitten een vragenlijst in te vullen. Wat voor steekproef is dit?"
    answers:
      - text_en: "A simple random sample"
        text_nl: "Een enkelvoudige aselecte steekproef"
        correct: false
        feedback_en: "Incorrect. In a simple random sample every guest has the same chance of being selected. Guests who never visit the bar have no chance at all here."
        feedback_nl: "Onjuist. Bij een enkelvoudige aselecte steekproef heeft elke gast dezelfde kans om gekozen te worden. Gasten die nooit in de bar komen, maken hier geen enkele kans."
      - text_en: "A stratified sample"
        text_nl: "Een gestratificeerde steekproef"
        correct: false
        feedback_en: "Incorrect. A stratified sample divides the population into groups and draws at random within each group. Nothing like that happens here."
        feedback_nl: "Onjuist. Bij een gestratificeerde steekproef verdeel je de populatie in groepen en trek je binnen elke groep aselect. Dat gebeurt hier niet."
      - text_en: "A convenience sample"
        text_nl: "Een gemakssteekproef"
        correct: true
        feedback_en: "Correct! The researcher takes whoever happens to be easy to reach. Not every guest has an equal chance: guests who never visit the bar fall outside the study, so the sample is not representative."
        feedback_nl: "Correct! De onderzoeker neemt wie toevallig makkelijk bereikbaar is. Niet elke gast heeft een gelijke kans: gasten die nooit in de bar komen, vallen buiten het onderzoek, dus de steekproef is niet representatief."
      - text_en: "A systematic sample"
        text_nl: "Een systematische steekproef"
        correct: false
        feedback_en: "Incorrect. A systematic sample selects every k-th person from a list (e.g. every 10th guest). Here everyone present is asked."
        feedback_nl: "Onjuist. Bij een systematische steekproef kies je elke k-de persoon van een lijst (bijv. elke 10e gast). Hier wordt iedereen gevraagd die er toevallig zit."

  # bron: Research Skills oefenvragen, slide 19
  - id: 24
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "Every member of a fitness chain (2,000 members) gets a number, and a computer randomly draws 200 numbers. What kind of sample is this?"
    question_nl: "Alle leden van een fitnessketen (2.000 leden) krijgen een nummer en een computer trekt willekeurig 200 nummers. Wat voor steekproef is dit?"
    answers:
      - text_en: "A simple random sample"
        text_nl: "Een enkelvoudige aselecte steekproef"
        correct: true
        feedback_en: "Correct! There is a complete list of the population (all 2,000 members) and every member has the same chance of being drawn."
        feedback_nl: "Correct! Er is een volledige lijst van de populatie (alle 2.000 leden) en elk lid heeft dezelfde kans om getrokken te worden."
      - text_en: "A quota sample"
        text_nl: "Een quotasteekproef"
        correct: false
        feedback_en: "Incorrect. A quota sample fixes numbers per group and then selects non-randomly. Here nothing is fixed per group and the draw is random."
        feedback_nl: "Onjuist. Bij een quotasteekproef leg je aantallen per groep vast en kies je daarbinnen niet-willekeurig. Hier ligt niets per groep vast en wordt aselect getrokken."
      - text_en: "A snowball sample"
        text_nl: "Een sneeuwbalsteekproef"
        correct: false
        feedback_en: "Incorrect. In a snowball sample respondents recruit other respondents. Here the computer draws everyone."
        feedback_nl: "Onjuist. Bij een sneeuwbalsteekproef werven respondenten andere respondenten. Hier trekt de computer iedereen."
      - text_en: "A convenience sample"
        text_nl: "Een gemakssteekproef"
        correct: false
        feedback_en: "Incorrect. A convenience sample takes whoever is easy to reach. Here the selection is random from a complete list."
        feedback_nl: "Onjuist. Een gemakssteekproef neemt wie makkelijk bereikbaar is. Hier wordt aselect getrokken uit een volledige lijst."

  # bron: Research Skills oefenvragen, slide 20
  - id: 25
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A university wants the share of students per faculty in the sample to match the population. Within each faculty, students are drawn at random. What kind of sample is this?"
    question_nl: "Een hogeschool wil dat het aandeel studenten per faculteit in de steekproef gelijk is aan dat in de populatie. Binnen elke faculteit worden studenten willekeurig getrokken. Wat voor steekproef is dit?"
    answers:
      - text_en: "A cluster sample"
        text_nl: "Een clustersteekproef"
        correct: false
        feedback_en: "Incorrect. In a cluster sample you draw entire groups (e.g. a few complete faculties). Here students are drawn from every faculty."
        feedback_nl: "Onjuist. Bij een clustersteekproef trek je hele groepen (bijv. een paar complete faculteiten). Hier worden uit elke faculteit studenten getrokken."
      - text_en: "A quota sample"
        text_nl: "Een quotasteekproef"
        correct: false
        feedback_en: "Incorrect. A quota sample also fixes the numbers per group, but selects non-randomly within each group. Here the draw within each faculty is random."
        feedback_nl: "Onjuist. Bij een quotasteekproef liggen de aantallen per groep ook vast, maar wordt binnen de groep níét willekeurig gekozen. Hier wordt binnen elke faculteit aselect getrokken."
      - text_en: "A snowball sample"
        text_nl: "Een sneeuwbalsteekproef"
        correct: false
        feedback_en: "Incorrect. In a snowball sample respondents recruit other respondents. That does not happen here."
        feedback_nl: "Onjuist. Bij een sneeuwbalsteekproef werven respondenten andere respondenten. Dat gebeurt hier niet."
      - text_en: "A stratified sample"
        text_nl: "Een gestratificeerde steekproef"
        correct: true
        feedback_en: "Correct! The population is divided into groups (strata: faculties) and within each stratum students are drawn at random, in proportion to the population."
        feedback_nl: "Correct! De populatie wordt verdeeld in groepen (strata: faculteiten) en binnen elk stratum wordt aselect getrokken, in verhouding tot de populatie."

  # ── MEETNIVEAUS ───────────────────────────────────────────────────────────

  - id: 26
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Which statement about the measurement level and graphs of variables A and B is false?"
    question_nl: "Welke uitspraak over het meetniveau en grafieken van variabelen A en B is onjuist?"
    answers:
      - text_en: "If variable A is measured at ordinal level, and variable B at interval level, a scatterplot is a fitting graph type"
        text_nl: "Als variabele A op ordinaal niveau gemeten is, en variabele B op intervalniveau, is een spreidingsdiagram een passend grafiektype"
        correct: true
        feedback_en: "Correct — this IS the false statement. A scatterplot requires two interval/ratio variables. Ordinal + interval calls for a bar chart or box plot, not a scatterplot."
        feedback_nl: "Correct — dit IS de onjuiste uitspraak. Een spreidingsdiagram vereist twee interval/ratio-variabelen. Ordinaal + interval vraagt om een staafdiagram of boxplot, niet een spreidingsdiagram."
      - text_en: "If variable A is measured at ordinal level, and variable B at interval level, a histogram is a fitting graph type"
        text_nl: "Als variabele A op ordinaal niveau gemeten is, en variabele B op intervalniveau, is een histogram een passend grafiektype"
        correct: false
        feedback_en: "This statement is TRUE — a histogram can represent interval-level data grouped by an ordinal variable. This is not the false statement."
        feedback_nl: "Deze uitspraak is WAAR — een histogram kan intervaldata weergeven gegroepeerd naar een ordinale variabele. Dit is niet de onjuiste uitspraak."
      - text_en: "If variable A is measured at ordinal level, and variable B at interval level, a bar chart is a fitting graph type"
        text_nl: "Als variabele A op ordinaal niveau gemeten is, en variabele B op intervalniveau, is een staafdiagram een passend grafiektype"
        correct: false
        feedback_en: "This statement is TRUE — a bar chart is appropriate when comparing interval means across ordinal categories. This is not the false statement."
        feedback_nl: "Deze uitspraak is WAAR — een staafdiagram is geschikt voor het vergelijken van intervalmiddelen over ordinale categorieën. Dit is niet de onjuiste uitspraak."

  - id: 27
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "In a survey among students of Zuyd the following variables were used: (1) age, (2) faculty, (3) Pride (answer to the statement \"I am proud to be a student of Zuyd University\" with possible answers: \"1 totally disagree\" through \"5 totally agree\")."
    question_nl: "In een enquête onder studenten van Zuyd werden de volgende variabelen gebruikt: (1) leeftijd, (2) faculteit, (3) Trots (antwoord op de stelling 'Ik ben trots student te zijn aan Zuyd Hogeschool', met antwoorden: '1 totaal oneens' t/m '5 totaal eens')."
    answers:
      - text_en: "(1) nominal, (2) ordinal, (3) ordinal"
        text_nl: "(1) nominaal, (2) ordinaal, (3) ordinaal"
        correct: false
        feedback_en: "Incorrect. Age is a continuous number — interval-ratio, not nominal. Faculty (a category with no order) is nominal."
        feedback_nl: "Onjuist. Leeftijd is een continu getal — interval-ratio, niet nominaal. Faculteit (een categorie zonder volgorde) is nominaal."
      - text_en: "(1) nominal, (2) interval-ratio, (3) ordinal"
        text_nl: "(1) nominaal, (2) interval-ratio, (3) ordinaal"
        correct: false
        feedback_en: "Incorrect. Age is interval-ratio (not nominal), and faculty is nominal (not interval-ratio) — the labels are swapped."
        feedback_nl: "Onjuist. Leeftijd is interval-ratio (niet nominaal), en faculteit is nominaal (niet interval-ratio) — de labels zijn omgewisseld."
      - text_en: "(1) nominal, (2) interval-ratio, (3) nominal"
        text_nl: "(1) nominaal, (2) interval-ratio, (3) nominaal"
        correct: false
        feedback_en: "Incorrect. Pride on a 1–5 scale is ordinal (ordered categories), not nominal. And age is interval-ratio, not nominal."
        feedback_nl: "Onjuist. Trots op een 1–5 schaal is ordinaal (geordende categorieën), niet nominaal. En leeftijd is interval-ratio, niet nominaal."
      - text_en: "(1) interval-ratio, (2) nominal, (3) ordinal"
        text_nl: "(1) interval-ratio, (2) nominaal, (3) ordinaal"
        correct: true
        feedback_en: "Correct! Age = interval-ratio (numeric, ordered, equal intervals). Faculty = nominal (categories, no order). Pride 1–5 = ordinal (ordered but unequal intervals)."
        feedback_nl: "Correct! Leeftijd = interval-ratio (numeriek, geordend, gelijke intervallen). Faculteit = nominaal (categorieën zonder volgorde). Trots 1–5 = ordinaal (geordend maar ongelijke intervallen)."

  - id: 28
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "You have asked people to indicate how interested they are in wine-food combinations in your survey on gastronomy on a scale of 1 to 5. People can indicate a score of 1, 2, 3, 4 or 5, where 1 is not interested and 5 is very interested. What is the level of measurement of this variable?"
    question_nl: "Je hebt mensen gevraagd aan te geven hoe geïnteresseerd ze zijn in wijn-spijscombinaties op een schaal van 1 tot 5, waarbij 1 = niet geïnteresseerd en 5 = zeer geïnteresseerd. Wat is het meetniveau van deze variabele?"
    answers:
      - text_en: "Interval-ratio"
        text_nl: "Interval-ratio"
        correct: false
        feedback_en: "Incorrect. Interval-ratio requires equal distances between values and a true zero. A 1–5 Likert scale has ordered but not necessarily equal intervals."
        feedback_nl: "Onjuist. Interval-ratio vereist gelijke afstanden tussen waarden en een absoluut nulpunt. Een 1–5 Likertschaal heeft geordende maar niet noodzakelijk gelijke intervallen."
      - text_en: "Nominal"
        text_nl: "Nominaal"
        correct: false
        feedback_en: "Incorrect. Nominal variables have categories with no natural order. This scale clearly has an order (1 = least interested, 5 = most interested)."
        feedback_nl: "Onjuist. Nominale variabelen hebben categorieën zonder natuurlijke volgorde. Deze schaal heeft duidelijk een volgorde (1 = minst geïnteresseerd, 5 = meest geïnteresseerd)."
      - text_en: "Ordinal"
        text_nl: "Ordinaal"
        correct: true
        feedback_en: "Correct! A 1–5 Likert scale is ordinal — values are ordered, but the distance between 1 and 2 is not necessarily the same as between 4 and 5."
        feedback_nl: "Correct! Een 1–5 Likertschaal is ordinaal — de waarden zijn geordend, maar de afstand tussen 1 en 2 is niet noodzakelijk gelijk aan die tussen 4 en 5."

  - id: 29
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "What is the measurement level of each of the following types of data:"
    question_nl: "Wat is het meetniveau van elk van de volgende soorten data:"
    answers:
      - text_en: "1 interval-ratio, 2 nominal, 3 nominal, 4 interval-ratio"
        text_nl: "1 interval-ratio, 2 nominaal, 3 nominaal, 4 interval-ratio"
        correct: true
        feedback_en: "Correct! This matches the standard classification of those data types in the question."
        feedback_nl: "Correct! Dit komt overeen met de standaardclassificatie van die datatypes in de vraag."
      - text_en: "1 nominal, 2 ordinal, 3 interval-ratio, 4 nominal"
        text_nl: "1 nominaal, 2 ordinaal, 3 interval-ratio, 4 nominaal"
        correct: false
        feedback_en: "Incorrect. Check whether each variable has categories only (nominal), a meaningful order (ordinal), or equal numeric intervals (interval-ratio)."
        feedback_nl: "Onjuist. Controleer of elke variabele alleen categorieën heeft (nominaal), een betekenisvolle volgorde (ordinaal), of gelijke numerieke intervallen (interval-ratio)."
      - text_en: "1 ordinal, 2 ordinal, 3 interval-ratio, 4 ordinal"
        text_nl: "1 ordinaal, 2 ordinaal, 3 interval-ratio, 4 ordinaal"
        correct: false
        feedback_en: "Incorrect. The classification does not match. Apply the decision tree: no order = nominal, order without equal intervals = ordinal, equal intervals = interval-ratio."
        feedback_nl: "Onjuist. De classificatie klopt niet. Pas de beslisboom toe: geen volgorde = nominaal, volgorde zonder gelijke intervallen = ordinaal, gelijke intervallen = interval-ratio."

  - id: 30
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "In a survey investigating the political tendency of the Dutch people the following questions are being asked: (1) Are you a member of a political party? (2) How many hours per week do you spend on political activities? (3) How interested are you in politics on a scale of 1-5?"
    question_nl: "In een enquête over de politieke gezindheid van Nederlanders worden de volgende vragen gesteld: (1) Bent u lid van een politieke partij? (2) Hoeveel uur per week besteedt u aan politieke activiteiten? (3) Hoe geïnteresseerd bent u in politiek op een schaal van 1-5?"
    answers:
      - text_en: "(1) ordinal, (2) interval-ratio, (3) ordinal"
        text_nl: "(1) ordinaal, (2) interval-ratio, (3) ordinaal"
        correct: false
        feedback_en: "Incorrect. Party membership (yes/no) is nominal, not ordinal."
        feedback_nl: "Onjuist. Partijlidmaatschap (ja/nee) is nominaal, niet ordinaal."
      - text_en: "(1) nominal, (2) interval-ratio, (3) nominal"
        text_nl: "(1) nominaal, (2) interval-ratio, (3) nominaal"
        correct: false
        feedback_en: "Incorrect. Interest on a 1–5 scale is ordinal (ordered categories), not nominal."
        feedback_nl: "Onjuist. Interesse op een 1–5 schaal is ordinaal (geordende categorieën), niet nominaal."
      - text_en: "(1) nominal, (2) ordinal, (3) ordinal"
        text_nl: "(1) nominaal, (2) ordinaal, (3) ordinaal"
        correct: false
        feedback_en: "Incorrect. Hours per week is a continuous numeric variable with a true zero — that is interval-ratio, not ordinal."
        feedback_nl: "Onjuist. Uren per week is een continue numerieke variabele met een absoluut nulpunt — dat is interval-ratio, niet ordinaal."
      - text_en: "(1) nominal, (2) interval-ratio, (3) ordinal"
        text_nl: "(1) nominaal, (2) interval-ratio, (3) ordinaal"
        correct: true
        feedback_en: "Correct! Party membership (yes/no) = nominal. Hours per week = interval-ratio (continuous, equal intervals, true zero). Interest 1–5 = ordinal."
        feedback_nl: "Correct! Partijlidmaatschap (ja/nee) = nominaal. Uren per week = interval-ratio (continu, gelijke intervallen, absoluut nulpunt). Interesse 1–5 = ordinaal."

  # bron: Research Skills oefenvragen, slide 3
  - id: 31
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "A hotel records the nationality of its guests (Dutch, German, Belgian, other). What is the measurement level of this variable?"
    question_nl: "Een hotel registreert de nationaliteit van zijn gasten (Nederlands, Duits, Belgisch, overig). Wat is het meetniveau van deze variabele?"
    answers:
      - text_en: "Ordinal"
        text_nl: "Ordinaal"
        correct: false
        feedback_en: "Incorrect. Nationalities have no natural order: Dutch is not 'more' or 'higher' than German. Ordinal requires a ranking."
        feedback_nl: "Onjuist. Nationaliteiten hebben geen natuurlijke volgorde: Nederlands is niet 'meer' of 'hoger' dan Duits. Ordinaal vereist een rangorde."
      - text_en: "Nominal"
        text_nl: "Nominaal"
        correct: true
        feedback_en: "Correct! Nationality consists of categories without a natural order. You can only name and count them, not rank them."
        feedback_nl: "Correct! Nationaliteit bestaat uit categorieën zonder natuurlijke volgorde. Je kunt ze alleen benoemen en tellen, niet rangschikken."
      - text_en: "Interval"
        text_nl: "Interval"
        correct: false
        feedback_en: "Incorrect. Interval requires numerical values with equal distances. There is no 'distance' between two nationalities."
        feedback_nl: "Onjuist. Interval vereist getallen met gelijke afstanden. Er is geen 'afstand' tussen twee nationaliteiten."
      - text_en: "Ratio"
        text_nl: "Ratio"
        correct: false
        feedback_en: "Incorrect. Ratio requires numbers with equal distances and a true zero point. Nationality is not a number at all."
        feedback_nl: "Onjuist. Ratio vereist getallen met gelijke afstanden en een echt nulpunt. Nationaliteit is helemaal geen getal."

  # bron: Research Skills oefenvragen, slide 4
  - id: 32
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Guests rate their satisfaction as very dissatisfied – dissatisfied – neutral – satisfied – very satisfied. What is the measurement level?"
    question_nl: "Gasten beoordelen hun tevredenheid als zeer ontevreden – ontevreden – neutraal – tevreden – zeer tevreden. Wat is het meetniveau?"
    answers:
      - text_en: "Nominal"
        text_nl: "Nominaal"
        correct: false
        feedback_en: "Incorrect. The categories do have a clear order (from very dissatisfied to very satisfied), so the level is higher than nominal."
        feedback_nl: "Onjuist. De categorieën hebben wel een duidelijke volgorde (van zeer ontevreden tot zeer tevreden), dus het niveau is hoger dan nominaal."
      - text_en: "Ratio"
        text_nl: "Ratio"
        correct: false
        feedback_en: "Incorrect. There are no numerical values with equal distances and no true zero point; these are ranked answer categories."
        feedback_nl: "Onjuist. Er zijn geen getallen met gelijke afstanden en geen echt nulpunt; het zijn gerangschikte antwoordcategorieën."
      - text_en: "Ordinal"
        text_nl: "Ordinaal"
        correct: true
        feedback_en: "Correct! The answer categories have a clear ranking, but the distances between them are not equal or known. That makes it ordinal, not interval."
        feedback_nl: "Correct! De antwoordcategorieën hebben een duidelijke rangorde, maar de afstanden ertussen zijn niet gelijk of bekend. Daarom is het ordinaal en geen interval."
      - text_en: "Interval"
        text_nl: "Interval"
        correct: false
        feedback_en: "Incorrect. Interval requires equal distances. We do not know whether the step from 'neutral' to 'satisfied' equals the step from 'satisfied' to 'very satisfied'."
        feedback_nl: "Onjuist. Interval vereist gelijke afstanden. We weten niet of de stap van 'neutraal' naar 'tevreden' even groot is als die van 'tevreden' naar 'zeer tevreden'."

  # bron: Research Skills oefenvragen, slide 5
  - id: 33
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "The temperature in hotel rooms is measured in degrees Celsius. Which measurement level applies, and why?"
    question_nl: "De temperatuur in hotelkamers wordt gemeten in graden Celsius. Welk meetniveau is dit, en waarom?"
    answers:
      - text_en: "Interval, because the zero point is arbitrary"
        text_nl: "Interval, omdat het nulpunt willekeurig is"
        correct: true
        feedback_en: "Correct! The distances are equal (20 to 21 °C is the same step as 30 to 31 °C), but 0 °C is an agreed point and does not mean 'no temperature'. So 20 °C is not 'twice as warm' as 10 °C."
        feedback_nl: "Correct! De afstanden zijn gelijk (van 20 naar 21 °C is evenveel als van 30 naar 31 °C), maar 0 °C is een afgesproken punt en betekent niet 'geen temperatuur'. Daarom is 20 °C ook niet 'twee keer zo warm' als 10 °C."
      - text_en: "Ratio, because 0 °C means there is no temperature"
        text_nl: "Ratio, omdat 0 °C betekent dat er geen temperatuur is"
        correct: false
        feedback_en: "Incorrect. 0 °C is simply the freezing point of water, not the absence of temperature; negative temperatures exist. Without a true zero point it is not ratio."
        feedback_nl: "Onjuist. 0 °C is gewoon het vriespunt van water, niet de afwezigheid van temperatuur; negatieve temperaturen bestaan. Zonder echt nulpunt is het geen ratio."
      - text_en: "Ordinal, because the values can be ranked"
        text_nl: "Ordinaal, omdat de waarden te rangschikken zijn"
        correct: false
        feedback_en: "Incorrect. The values can indeed be ranked, but the distances are also equal. That makes the level higher than ordinal."
        feedback_nl: "Onjuist. De waarden zijn inderdaad te rangschikken, maar de afstanden zijn bovendien gelijk. Daardoor is het niveau hoger dan ordinaal."
      - text_en: "Nominal, because every temperature is a category"
        text_nl: "Nominaal, omdat elke temperatuur een categorie is"
        correct: false
        feedback_en: "Incorrect. Temperatures are numbers with an order and equal distances, not unordered categories."
        feedback_nl: "Onjuist. Temperaturen zijn getallen met een volgorde en gelijke afstanden, geen ongeordende categorieën."

  # bron: Research Skills oefenvragen, slide 6
  - id: 34
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "A survey contains three variables: (1) number of nights stayed, (2) payment method (cash, card, app), (3) hotel rating in stars (1–5). What are their measurement levels?"
    question_nl: "Een enquête bevat drie variabelen: (1) aantal overnachtingen, (2) betaalmethode (contant, pin, app), (3) hotelclassificatie in sterren (1–5). Wat zijn de meetniveaus?"
    answers:
      - text_en: "(1) ordinal, (2) nominal, (3) ratio"
        text_nl: "(1) ordinaal, (2) nominaal, (3) ratio"
        correct: false
        feedback_en: "Incorrect. Number of nights has equal distances and a true zero (0 nights), so it is ratio, not ordinal. Stars are ranked but without equal distances, so ordinal, not ratio."
        feedback_nl: "Onjuist. Aantal overnachtingen heeft gelijke afstanden en een echt nulpunt (0 nachten), dus ratio, niet ordinaal. Sterren zijn gerangschikt maar zonder gelijke afstanden, dus ordinaal, niet ratio."
      - text_en: "(1) ratio, (2) ordinal, (3) nominal"
        text_nl: "(1) ratio, (2) ordinaal, (3) nominaal"
        correct: false
        feedback_en: "Incorrect. Payment methods have no order (nominal), while stars do have an order (ordinal). The levels of (2) and (3) are swapped."
        feedback_nl: "Onjuist. Betaalmethoden hebben geen volgorde (nominaal), sterren wel (ordinaal). De niveaus van (2) en (3) zijn omgedraaid."
      - text_en: "(1) nominal, (2) nominal, (3) ordinal"
        text_nl: "(1) nominaal, (2) nominaal, (3) ordinaal"
        correct: false
        feedback_en: "Incorrect. Number of nights is a count with a true zero point and equal distances: ratio, not nominal."
        feedback_nl: "Onjuist. Aantal overnachtingen is een aantal met een echt nulpunt en gelijke afstanden: ratio, niet nominaal."
      - text_en: "(1) ratio, (2) nominal, (3) ordinal"
        text_nl: "(1) ratio, (2) nominaal, (3) ordinaal"
        correct: true
        feedback_en: "Correct! (1) Nights have a true zero (0 nights) and equal distances: ratio. (2) Payment methods are categories without order: nominal. (3) Stars are ranked, but the step from 1 to 2 stars is not necessarily equal to the step from 4 to 5: ordinal."
        feedback_nl: "Correct! (1) Overnachtingen hebben een echt nulpunt (0 nachten) en gelijke afstanden: ratio. (2) Betaalmethoden zijn categorieën zonder volgorde: nominaal. (3) Sterren hebben een rangorde, maar het verschil tussen 1 en 2 sterren is niet per se gelijk aan dat tussen 4 en 5: ordinaal."

  # bron: Research Skills oefenvragen, slide 7
  - id: 35
    topic_en: "Measurement Levels"
    topic_nl: "Meetniveaus"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Which statistic can you meaningfully report for a nominal variable such as favourite holiday destination?"
    question_nl: "Welke maat kun je zinvol rapporteren voor een nominale variabele zoals favoriete vakantiebestemming?"
    answers:
      - text_en: "The mean"
        text_nl: "Het gemiddelde"
        correct: false
        feedback_en: "Incorrect. A mean requires numbers with equal distances. You cannot add up 'Spain' and 'Italy' and divide by two."
        feedback_nl: "Onjuist. Een gemiddelde vereist getallen met gelijke afstanden. Je kunt 'Spanje' en 'Italië' niet optellen en door twee delen."
      - text_en: "The median"
        text_nl: "De mediaan"
        correct: false
        feedback_en: "Incorrect. A median requires the values to be sorted. Destinations have no natural order, so there is no 'middle' value."
        feedback_nl: "Onjuist. Een mediaan vereist dat je de waarden kunt sorteren. Bestemmingen hebben geen natuurlijke volgorde, dus er is geen 'middelste' waarde."
      - text_en: "The standard deviation"
        text_nl: "De standaarddeviatie"
        correct: false
        feedback_en: "Incorrect. A standard deviation measures distances from the mean, which does not exist for a nominal variable."
        feedback_nl: "Onjuist. Een standaarddeviatie meet afstanden tot het gemiddelde, en dat bestaat niet voor een nominale variabele."
      - text_en: "The mode"
        text_nl: "De modus"
        correct: true
        feedback_en: "Correct! For a nominal variable you can only count how often each category occurs. The mode (the most frequently chosen destination) is therefore the meaningful measure."
        feedback_nl: "Correct! Bij een nominale variabele kun je alleen tellen hoe vaak elke categorie voorkomt. De modus (de vaakst gekozen bestemming) is dan de zinvolle maat."

  # ── BESCHRIJVENDE STATISTIEK ──────────────────────────────────────────────

  - id: 36
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    image: "images/q046_two_bar_charts.png"
    question_en: "Consider the graphs above. Graph 1 has a mean μ1 and a standard deviation σ1. Graph 2 has a mean μ2 and a standard deviation σ2."
    question_nl: "Bekijk de grafieken hierboven. Grafiek 1 heeft een gemiddelde μ1 en een standaarddeviatie σ1. Grafiek 2 heeft een gemiddelde μ2 en een standaarddeviatie σ2."
    answers:
      - text_en: "μ1 = μ2 and σ1 > σ2"
        text_nl: "μ1 = μ2 en σ1 > σ2"
        correct: false
        feedback_en: "Incorrect. If the peaks are at the same position, the means are equal. But a wider spread = larger σ. Check which graph is wider."
        feedback_nl: "Onjuist. Als de pieken op dezelfde positie staan, zijn de gemiddelden gelijk. Maar een bredere spreiding = grotere σ. Controleer welke grafiek breder is."
      - text_en: "μ1 = μ2 and σ1 < σ2"
        text_nl: "μ1 = μ2 en σ1 < σ2"
        correct: true
        feedback_en: "Correct! Both curves peak at the same location (equal means). Graph 2 is wider/flatter, meaning it has a larger standard deviation (σ2 > σ1)."
        feedback_nl: "Correct! Beide curven hebben hun piek op dezelfde locatie (gelijke gemiddelden). Grafiek 2 is breder/platter, wat een grotere standaarddeviatie betekent (σ2 > σ1)."
      - text_en: "μ1 = μ2 and σ1 = σ2"
        text_nl: "μ1 = μ2 en σ1 = σ2"
        correct: false
        feedback_en: "Incorrect. Equal standard deviations would produce identical bell curves. The two graphs have different widths."
        feedback_nl: "Onjuist. Gelijke standaarddeviaties zouden identieke klokcurven opleveren. De twee grafieken hebben verschillende breedtes."
      - text_en: "μ1 < μ2 and σ1 = σ2"
        text_nl: "μ1 < μ2 en σ1 = σ2"
        correct: false
        feedback_en: "Incorrect. The curves peak at the same position — the means are equal, not different."
        feedback_nl: "Onjuist. De curven hebben hun piek op dezelfde positie — de gemiddelden zijn gelijk, niet verschillend."

  - id: 37
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "In a normal distribution most scores are located:"
    question_nl: "In een normale verdeling bevinden de meeste scores zich:"
    answers:
      - text_en: "At the right end of the distribution"
        text_nl: "Aan het rechteruiteinde van de verdeling"
        correct: false
        feedback_en: "Incorrect. Scores at the right extreme are rare (high values). The normal distribution is bell-shaped with most scores in the centre."
        feedback_nl: "Onjuist. Scores aan het rechteruiteinde zijn zeldzaam (hoge waarden). De normale verdeling heeft een klokvorm met de meeste scores in het midden."
      - text_en: "At the left end of the distribution"
        text_nl: "Aan het linkeruiteinde van de verdeling"
        correct: false
        feedback_en: "Incorrect. Scores at the left extreme are also rare. The normal distribution is symmetric and bell-shaped."
        feedback_nl: "Onjuist. Scores aan het linkeruiteinde zijn ook zeldzaam. De normale verdeling is symmetrisch en klokvormig."
      - text_en: "At the extremes of the distribution"
        text_nl: "Aan de uitersten van de verdeling"
        correct: false
        feedback_en: "Incorrect. In a normal distribution the extremes (tails) contain the fewest scores. Most scores cluster around the mean."
        feedback_nl: "Onjuist. In een normale verdeling bevatten de uitersten (staarten) de minste scores. De meeste scores clusteren rond het gemiddelde."
      - text_en: "In the center of the distribution"
        text_nl: "In het midden van de verdeling"
        correct: true
        feedback_en: "Correct! The normal distribution is bell-shaped. The majority of scores cluster around the mean (centre), with fewer scores in the tails."
        feedback_nl: "Correct! De normale verdeling is klokvormig. De meeste scores clusteren rond het gemiddelde (midden), met minder scores in de staarten."

  - id: 38
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "In a classroom we find 15 students with the following ages: 19, 21, 21, 18, 23, 22, 21, 21, 20, 19, 20, 21, 22, 19, 23. The sample has a mean=20.67, median=21, mode=21 and SD=1.5. A professor aged 68 enters the room. What happens to the age measures?"
    question_nl: "In een klas vinden we 15 studenten met de volgende leeftijden: 19, 21, 21, 18, 23, 22, 21, 21, 20, 19, 20, 21, 22, 19, 23. Gemiddelde=20,67, mediaan=21, modus=21 en SD=1,5. Een professor van 68 jaar betreedt de ruimte. Wat gebeurt er met de leeftijdsmaten?"
    answers:
      - text_en: "Mean, median, and SD increase"
        text_nl: "Gemiddelde, mediaan en SD nemen toe"
        correct: false
        feedback_en: "Incorrect. The median and mode are not strongly affected by outliers. The extreme value (68) pulls up the mean and widens the SD, but the median stays the same."
        feedback_nl: "Onjuist. De mediaan en modus worden niet sterk beïnvloed door uitbijters. De extreme waarde (68) trekt het gemiddelde omhoog en vergroot de SD, maar de mediaan blijft gelijk."
      - text_en: "Mean and SD increase, median and mode remain the same"
        text_nl: "Gemiddelde en SD nemen toe, mediaan en modus blijven gelijk"
        correct: true
        feedback_en: "Correct! The professor (68) is an extreme outlier. This pulls the mean up significantly and inflates the SD. The median (middle value) and mode (most frequent) are resistant to outliers and stay the same."
        feedback_nl: "Correct! De professor (68) is een extreme uitbijter. Dit trekt het gemiddelde flink omhoog en vergroot de SD. De mediaan (middelste waarde) en modus (meest voorkomende) zijn robuust voor uitbijters en blijven gelijk."
      - text_en: "Mean increases, median and mode remain the same, SD decreases"
        text_nl: "Gemiddelde neemt toe, mediaan en modus blijven gelijk, SD neemt af"
        correct: false
        feedback_en: "Incorrect. Adding an extreme outlier (68) makes the data more spread out, so SD increases, not decreases."
        feedback_nl: "Onjuist. Het toevoegen van een extreme uitbijter (68) maakt de data meer verspreid, dus SD neemt toe, niet af."
      - text_en: "Mean, median and mode increase, SD decreases"
        text_nl: "Gemiddelde, mediaan en modus nemen toe, SD neemt af"
        correct: false
        feedback_en: "Incorrect. The median and mode are robust to outliers — they do not change. And SD increases, not decreases, when an extreme value is added."
        feedback_nl: "Onjuist. Mediaan en modus zijn robuust voor uitbijters — ze veranderen niet. En SD neemt toe, niet af, als een extreme waarde wordt toegevoegd."

  # bron: Research Skills oefenvragen, slide 8
  - id: 39
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "The ages of seven tour guides are: 24, 26, 26, 28, 30, 31, 45. What are the mean, median and mode?"
    question_nl: "De leeftijden van zeven reisleiders zijn: 24, 26, 26, 28, 30, 31, 45. Wat zijn het gemiddelde, de mediaan en de modus?"
    answers:
      - text_en: "mean 30, median 28, mode 26"
        text_nl: "gemiddelde 30, mediaan 28, modus 26"
        correct: true
        feedback_en: "Correct! Mean: (24 + 26 + 26 + 28 + 30 + 31 + 45) / 7 = 210 / 7 = 30. Median: the middle (4th) value of the sorted list = 28. Mode: the most frequent value = 26."
        feedback_nl: "Correct! Gemiddelde: (24 + 26 + 26 + 28 + 30 + 31 + 45) / 7 = 210 / 7 = 30. Mediaan: de middelste (4e) waarde van de gesorteerde reeks = 28. Modus: de waarde die het vaakst voorkomt = 26."
      - text_en: "mean 28, median 30, mode 26"
        text_nl: "gemiddelde 28, mediaan 30, modus 26"
        correct: false
        feedback_en: "Incorrect. Mean and median are swapped: the mean is 210 / 7 = 30 and the median (4th value) is 28."
        feedback_nl: "Onjuist. Gemiddelde en mediaan zijn omgewisseld: het gemiddelde is 210 / 7 = 30 en de mediaan (4e waarde) is 28."
      - text_en: "mean 30, median 26, mode 28"
        text_nl: "gemiddelde 30, mediaan 26, modus 28"
        correct: false
        feedback_en: "Incorrect. Median and mode are swapped: 28 is the middle value, 26 is the value that occurs twice."
        feedback_nl: "Onjuist. Mediaan en modus zijn omgewisseld: 28 is de middelste waarde, 26 komt twee keer voor."
      - text_en: "mean 29, median 28, mode 45"
        text_nl: "gemiddelde 29, mediaan 28, modus 45"
        correct: false
        feedback_en: "Incorrect. The mean is 210 / 7 = 30, and 45 occurs only once; it is the largest value (an outlier), not the mode."
        feedback_nl: "Onjuist. Het gemiddelde is 210 / 7 = 30, en 45 komt maar één keer voor; het is de grootste waarde (een uitschieter), niet de modus."

  # bron: Research Skills oefenvragen, slide 9
  - id: 40
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "In the data of the previous question (24, 26, 26, 28, 30, 31, 45), the 45-year-old guide is replaced by a guide aged 31. What happens to the mean, the median and the standard deviation?"
    question_nl: "In de data van de vorige vraag (24, 26, 26, 28, 30, 31, 45) wordt de reisleider van 45 vervangen door een reisleider van 31. Wat gebeurt er met het gemiddelde, de mediaan en de standaarddeviatie?"
    answers:
      - text_en: "The mean and the median both decrease"
        text_nl: "Het gemiddelde en de mediaan dalen allebei"
        correct: false
        feedback_en: "Incorrect. The mean does decrease (to 28), but the median stays the 4th value = 28. The median is not sensitive to outliers."
        feedback_nl: "Onjuist. Het gemiddelde daalt wel (naar 28), maar de mediaan blijft de 4e waarde = 28. De mediaan is niet gevoelig voor uitschieters."
      - text_en: "The mean stays the same, the standard deviation increases"
        text_nl: "Het gemiddelde blijft gelijk, de standaarddeviatie stijgt"
        correct: false
        feedback_en: "Incorrect. The sum drops from 210 to 196, so the mean decreases. Removing the outlier reduces the spread, so the standard deviation decreases."
        feedback_nl: "Onjuist. De som daalt van 210 naar 196, dus het gemiddelde daalt. Door de uitschieter weg te halen neemt de spreiding af, dus de standaarddeviatie daalt."
      - text_en: "The mean decreases, the median stays the same, the standard deviation decreases"
        text_nl: "Het gemiddelde daalt, de mediaan blijft gelijk, de standaarddeviatie daalt"
        correct: true
        feedback_en: "Correct! New list: 24, 26, 26, 28, 30, 31, 31. Mean = 196 / 7 = 28 (down from 30). The median stays the 4th value = 28. The outlier of 45 disappears, so the spread and the standard deviation decrease. Lesson: the mean and SD are sensitive to outliers, the median is not."
        feedback_nl: "Correct! Nieuwe reeks: 24, 26, 26, 28, 30, 31, 31. Gemiddelde = 196 / 7 = 28 (daalt van 30). De mediaan blijft de 4e waarde = 28. De uitschieter van 45 verdwijnt, dus de spreiding en de standaarddeviatie nemen af. Les: het gemiddelde en de standaarddeviatie zijn gevoelig voor uitschieters, de mediaan niet."
      - text_en: "The mean decreases, the median increases, the standard deviation stays the same"
        text_nl: "Het gemiddelde daalt, de mediaan stijgt, de standaarddeviatie blijft gelijk"
        correct: false
        feedback_en: "Incorrect. The median stays 28 (the 4th value does not change), and the standard deviation decreases because the extreme value is gone."
        feedback_nl: "Onjuist. De mediaan blijft 28 (de 4e waarde verandert niet), en de standaarddeviatie daalt omdat de extreme waarde verdwenen is."

  # bron: Research Skills oefenvragen, slide 11
  - id: 41
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "You want to show how many guests come from each of five countries. Which graph is most suitable?"
    question_nl: "Je wilt laten zien hoeveel gasten uit elk van vijf landen komen. Welke grafiek is het meest geschikt?"
    answers:
      - text_en: "A histogram"
        text_nl: "Een histogram"
        correct: false
        feedback_en: "Incorrect. A histogram shows the distribution of one interval or ratio variable in classes. Country is nominal."
        feedback_nl: "Onjuist. Een histogram toont de verdeling van één interval- of ratiovariabele in klassen. Land is nominaal."
      - text_en: "A scatterplot"
        text_nl: "Een spreidingsdiagram"
        correct: false
        feedback_en: "Incorrect. A scatterplot shows the relationship between two interval/ratio variables. Here there is only one nominal variable."
        feedback_nl: "Onjuist. Een spreidingsdiagram toont het verband tussen twee interval-/ratiovariabelen. Hier is er maar één nominale variabele."
      - text_en: "A line graph"
        text_nl: "Een lijngrafiek"
        correct: false
        feedback_en: "Incorrect. A line graph shows a development, for example over time. The countries have no order that a line could connect."
        feedback_nl: "Onjuist. Een lijngrafiek toont een verloop, bijvoorbeeld in de tijd. De landen hebben geen volgorde die je met een lijn kunt verbinden."
      - text_en: "A bar chart"
        text_nl: "Een staafdiagram"
        correct: true
        feedback_en: "Correct! Country is a nominal variable; a bar chart shows the count per category, with one bar per country."
        feedback_nl: "Correct! Land is een nominale variabele; een staafdiagram toont het aantal per categorie, met één staaf per land."

