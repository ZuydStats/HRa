        feedback_nl: "Correct! Vuistregel: hoogstens 20% van de cellen mag een verwachte waarde onder de 5 hebben (en geen enkele onder de 1). Hier hebben 2 van de 4 cellen (3,20 en 4,80) een verwachte waarde onder de 5: 50%."
      - text_en: "No, because both variables are nominal"
        text_nl: "Nee, omdat beide variabelen nominaal zijn"
        correct: false
        feedback_en: "Incorrect. Two nominal variables are exactly what a chi-square test is meant for."
