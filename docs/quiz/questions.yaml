  # bron: Research Skills oefenvragen, slide 33
  - id: 58
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    image: "images/q_holiday_chisquare.png"
    question_en: "Based on the output above (α = 0.05), which conclusion is correct?"
    question_nl: "Welke conclusie is juist op basis van de output hierboven (α = 0,05)?"
    answers:
      - text_en: "There is no association, because χ² is larger than p"
        text_nl: "Er is geen verband, omdat χ² groter is dan p"
        correct: false
        feedback_en: "Incorrect. You do not compare χ² with p. You compare p with α: p = 0.015 < 0.05."
        feedback_nl: "Onjuist. Je vergelijkt χ² niet met p. Je vergelijkt p met α: p = 0,015 < 0,05."
      - text_en: "The test is not valid, because some expected counts are below 5"
        text_nl: "De toets is niet valide, omdat sommige verwachte waarden onder de 5 liggen"
        correct: false
        feedback_en: "Incorrect. The smallest expected count is 25 (Nature: 100 × 50 / 200), so the assumption is met."
        feedback_nl: "Onjuist. De kleinste verwachte waarde is 25 (Nature: 100 × 50 / 200), dus aan de voorwaarde is voldaan."
      - text_en: "Gender causes a different holiday preference"
        text_nl: "Geslacht veroorzaakt een andere vakantievoorkeur"
        correct: false
        feedback_en: "Incorrect. A chi-square test shows an association, not cause and effect."
        feedback_nl: "Onjuist. Een chi-kwadraattoets toont samenhang aan, geen oorzaak-gevolg."
      - text_en: "There is a significant association between gender and type of holiday"
        text_nl: "Er is een significant verband tussen geslacht en type vakantie"
        correct: true
        feedback_en: "Correct! χ²(2) = 8.43, p = 0.015. Because p is smaller than 0.05 we reject H0 (independence): there is a significant association."
        feedback_nl: "Correct! χ²(2) = 8,43, p = 0,015. Omdat p kleiner is dan 0,05, verwerpen we H0 (onafhankelijkheid): er is een significant verband."

  # bron: Research Skills oefenvragen, slide 35
  - id: 59
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    image: "images/q_smoker_purpose.png"
    question_en: "40 hotel guests were asked whether they smoke and what the purpose of their stay is (see the output above). May a chi-square test be performed on these data?"
    question_nl: "Aan 40 hotelgasten is gevraagd of ze roken en wat het doel van hun verblijf is (zie de output hierboven). Mag je op deze gegevens een chi-kwadraattoets uitvoeren?"
    answers:
      - text_en: "Yes, all observed counts are at least 2"
        text_nl: "Ja, alle geobserveerde aantallen zijn minstens 2"
        correct: false
        feedback_en: "Incorrect. The rule is about the expected counts, not the observed counts."
        feedback_nl: "Onjuist. De vuistregel gaat over de verwachte waarden, niet over de geobserveerde aantallen."
      - text_en: "Yes, the total sample is larger than 30"
        text_nl: "Ja, de totale steekproef is groter dan 30"
        correct: false
        feedback_en: "Incorrect. There is no 'n > 30' rule for chi-square; what matters is the expected count per cell."
        feedback_nl: "Onjuist. Voor de chi-kwadraattoets bestaat geen regel 'n > 30'; het gaat om de verwachte waarde per cel."
      - text_en: "No, two of the four cells have an expected count below 5"
        text_nl: "Nee, twee van de vier cellen hebben een verwachte waarde onder de 5"
