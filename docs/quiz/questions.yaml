    question_en: "The scatterplot above shows study hours and exam scores of 25 students. How would you describe the correlation?"
    question_nl: "Het spreidingsdiagram hierboven toont studie-uren en tentamencijfers van 25 studenten. Hoe beschrijf je de correlatie?"
    answers:
      - text_en: "Strong negative"
        text_nl: "Sterk negatief"
        correct: false
        feedback_en: "Incorrect. The points go up from left to right: more study hours go with higher scores. That is positive, not negative."
        feedback_nl: "Onjuist. De punten lopen van links naar rechts omhoog: meer studie-uren gaan samen met hogere cijfers. Dat is positief, niet negatief."
      - text_en: "Strong positive"
        text_nl: "Sterk positief"
        correct: true
        feedback_en: "Correct! More study hours go with higher scores (positive) and the points lie close to a straight line (strong). A correlation says nothing about cause and effect."
        feedback_nl: "Correct! Meer studie-uren gaan samen met hogere cijfers (positief) en de punten liggen dicht bij een rechte lijn (sterk). Een correlatie zegt niets over oorzaak en gevolg."
      - text_en: "No correlation"
        text_nl: "Geen correlatie"
        correct: false
        feedback_en: "Incorrect. There is a clear upward pattern; with no correlation the points would form a shapeless cloud."
        feedback_nl: "Onjuist. Er is een duidelijk stijgend patroon; zonder correlatie zouden de punten een vormeloze wolk vormen."
      - text_en: "Weak negative"
        text_nl: "Zwak negatief"
        correct: false
        feedback_en: "Incorrect. The direction is positive (rising) and the points are close to a line, so the relationship is strong, not weak."
        feedback_nl: "Onjuist. De richting is positief (stijgend) en de punten liggen dicht bij een lijn, dus het verband is sterk, niet zwak."

  # bron: Research Skills oefenvragen, slide 51
  - id: 69
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    image: "images/q_correlation_price_bookings.png"
    question_en: "The output above shows the correlation between price per night and number of bookings for 120 hotels. Which conclusion is correct?"
    question_nl: "De output hierboven toont de correlatie tussen de prijs per nacht en het aantal boekingen van 120 hotels. Welke conclusie is juist?"
    answers:
      - text_en: "There is a significant positive correlation"
        text_nl: "Er is een significante positieve correlatie"
        correct: false
        feedback_en: "Incorrect. r = −0.620 is negative: higher prices go with fewer bookings."
        feedback_nl: "Onjuist. r = −0,620 is negatief: hogere prijzen gaan samen met minder boekingen."
      - text_en: "A higher price causes fewer bookings"
        text_nl: "Een hogere prijs veroorzaakt minder boekingen"
        correct: false
        feedback_en: "Incorrect. Too strong: a correlation shows that variables go together, not that one causes the other."
        feedback_nl: "Onjuist. Te sterk geformuleerd: een correlatie toont samenhang, geen oorzaak."
      - text_en: "A significant, fairly strong negative correlation: higher prices go with fewer bookings"
        text_nl: "Een significante, vrij sterke negatieve correlatie: hogere prijzen gaan samen met minder boekingen"
        correct: true
        feedback_en: "Correct! r = −0.62: negative (higher price, fewer bookings) and fairly strong. p < 0.001: significant."
        feedback_nl: "Correct! r = −0,62: negatief (hogere prijs, minder boekingen) en vrij sterk. p < 0,001: significant."
      - text_en: "There is no correlation, because r is negative"
        text_nl: "Er is geen correlatie, omdat r negatief is"
        correct: false
        feedback_en: "Incorrect. A negative r means a negative relationship, not 'no relationship'. No correlation would be r close to 0."
        feedback_nl: "Onjuist. Een negatieve r betekent een negatief verband, niet 'geen verband'. Geen correlatie zou r dicht bij 0 zijn."

  # bron: Research Skills oefenvragen, slide 52
  - id: 70
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    image: "images/q_scatter_workload.png"
    question_en: "You want to compute Pearson's r for the two variables in the scatterplot above. Is that appropriate?"
    question_nl: "Je wilt voor de twee variabelen in het spreidingsdiagram hierboven Pearsons r berekenen. Is dat terecht?"
    answers:
      - text_en: "Yes, there is a strong positive correlation"
        text_nl: "Ja, er is een sterke positieve correlatie"
        correct: false
        feedback_en: "Incorrect. Performance first rises and then falls; the relationship is not positive over the whole range."
        feedback_nl: "Onjuist. De prestatie stijgt eerst en daalt daarna; het verband is niet over het hele bereik positief."
      - text_en: "Yes, both variables are measured at ratio level"
        text_nl: "Ja, beide variabelen zijn op rationiveau gemeten"
        correct: false
        feedback_en: "Incorrect. The measurement level is fine, but that is not enough: the assumption of linearity must also hold."
        feedback_nl: "Onjuist. Het meetniveau klopt wel, maar dat is niet genoeg: ook de aanname van lineariteit moet kloppen."
      - text_en: "No, both variables are nominal"
        text_nl: "Nee, beide variabelen zijn nominaal"
        correct: false
        feedback_en: "Incorrect. Hours per week and a performance score are numerical variables, not nominal."
        feedback_nl: "Onjuist. Uren per week en een prestatiescore zijn numerieke variabelen, niet nominaal."
      - text_en: "No, the relationship is not linear"
        text_nl: "Nee, het verband is niet lineair"
        correct: true
        feedback_en: "Correct! Pearson's r only measures linear relationships. Here the relationship is an inverted U: performance rises up to about 40 hours, then falls. Pearson's r would be close to 0 and wrongly suggest 'no relationship'."
        feedback_nl: "Correct! Pearsons r meet alleen lineaire verbanden. Hier is het verband een omgekeerde U: tot ongeveer 40 uur stijgt de prestatie, daarna daalt ze. Pearsons r zou dicht bij 0 uitkomen en ten onrechte 'geen verband' suggereren."

  # ── T-TOETS ───────────────────────────────────────────────────────────────

  # bron: Research Skills oefenvragen, slide 39
  - id: 71
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    image: "images/q_ttest_time_on_site.png"
    question_en: "A website compared the time visitors spent on the site (minutes) for a new design (n = 40, M = 12.4) and the old design (n = 40, M = 10.8). Based on the output above, which conclusion is correct (α = 0.05)?"
    question_nl: "Een website vergeleek de tijd die bezoekers op de site doorbrachten (minuten) bij een nieuw ontwerp (n = 40, M = 12,4) en het oude ontwerp (n = 40, M = 10,8). Welke conclusie is juist op basis van de output hierboven (α = 0,05)?"
    answers:
      - text_en: "The variances differ, so the t-test cannot be used"
        text_nl: "De varianties verschillen, dus de t-toets mag niet worden gebruikt"
        correct: false
        feedback_en: "Incorrect. Levene's test gives p = 0.519 > 0.05, so the variances may be considered equal. Even if they differed, you would use Welch's t, not drop the t-test."
        feedback_nl: "Onjuist. De toets van Levene geeft p = 0,519 > 0,05, dus de varianties mogen als gelijk worden beschouwd. En ook als ze verschilden, gebruik je de Welch-toets in plaats van de t-toets te laten vallen."
      - text_en: "Levene's test is not significant, and the mean time differs significantly"
        text_nl: "De toets van Levene is niet significant, en de gemiddelde tijd verschilt significant"
        correct: true
        feedback_en: "Correct! Levene: p = 0.519 > 0.05, so equal variances are assumed and you read Student's t. t(78) = 2.20, p = 0.031 < 0.05: the difference in mean time is significant."
        feedback_nl: "Correct! Levene: p = 0,519 > 0,05, dus de varianties mogen als gelijk worden beschouwd en je leest de Student's t af. t(78) = 2,20, p = 0,031 < 0,05: het verschil in gemiddelde tijd is significant."
      - text_en: "There is no significant difference, because p < 0.05"
        text_nl: "Er is geen significant verschil, omdat p < 0,05"
        correct: false
        feedback_en: "Incorrect. p < 0.05 means the difference is significant, not that it is absent."
        feedback_nl: "Onjuist. p < 0,05 betekent juist dat het verschil significant is, niet dat het er niet is."
      - text_en: "Every visitor stays exactly 1.6 minutes longer with the new design"
        text_nl: "Elke bezoeker blijft met het nieuwe ontwerp precies 1,6 minuut langer"
        correct: false
        feedback_en: "Incorrect. 1.6 minutes is the difference between the group means, not the difference for every individual visitor."
        feedback_nl: "Onjuist. 1,6 minuut is het verschil tussen de groepsgemiddelden, niet het verschil voor elke individuele bezoeker."

  # bron: Research Skills oefenvragen, slide 40
  - id: 72
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "What does Levene's test check in an independent-samples t-test?"
    question_nl: "Wat controleert de toets van Levene bij een onafhankelijke t-toets?"
    answers:
      - text_en: "Whether the groups are normally distributed"
        text_nl: "Of de groepen normaal verdeeld zijn"
        correct: false
        feedback_en: "Incorrect. Normality is checked with, for example, the Shapiro-Wilk test, not with Levene's test."
        feedback_nl: "Onjuist. Normaliteit controleer je bijvoorbeeld met de Shapiro-Wilk-toets, niet met de toets van Levene."
      - text_en: "Whether the group means are equal"
        text_nl: "Of de groepsgemiddelden gelijk zijn"
        correct: false
        feedback_en: "Incorrect. Whether the means differ is tested by the t-test itself."
        feedback_nl: "Onjuist. Of de gemiddelden verschillen, toetst de t-toets zelf."
      - text_en: "Whether the samples are large enough"
        text_nl: "Of de steekproeven groot genoeg zijn"
        correct: false
        feedback_en: "Incorrect. Levene's test says nothing about sample size."
        feedback_nl: "Onjuist. De toets van Levene zegt niets over de steekproefgrootte."
      - text_en: "Whether the variances of the groups are equal"
        text_nl: "Of de varianties van de groepen gelijk zijn"
        correct: true
        feedback_en: "Correct! Levene's test checks the assumption of equal variances (homogeneity of variances). It determines whether you read Student's t or Welch's t."
        feedback_nl: "Correct! De toets van Levene toetst de aanname van gelijke varianties (homogeniteit van varianties). Die bepaalt of je de Student's t of de Welch-toets afleest."

  # bron: Research Skills oefenvragen, slide 41
  - id: 73
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "The reaction time of 30 cabin crew members is measured before and after a night flight. Which test should you use to compare the two measurements?"
    question_nl: "De reactietijd van 30 cabinemedewerkers wordt gemeten voor en na een nachtvlucht. Welke toets gebruik je om de twee metingen te vergelijken?"
    answers:
      - text_en: "An independent-samples t-test"
        text_nl: "Een onafhankelijke t-toets"
        correct: false
        feedback_en: "Incorrect. An independent t-test compares two different groups of people. Here the same people are measured twice."
        feedback_nl: "Onjuist. Een onafhankelijke t-toets vergelijkt twee verschillende groepen mensen. Hier worden dezelfde mensen twee keer gemeten."
      - text_en: "A paired-samples t-test"
        text_nl: "Een gepaarde t-toets"
        correct: true
        feedback_en: "Correct! The same people are measured twice, so the measurements are linked. You compare the before–after difference per person."
        feedback_nl: "Correct! Dezelfde personen worden twee keer gemeten; de metingen zijn dus aan elkaar gekoppeld. Je vergelijkt per persoon het verschil tussen voor en na."
      - text_en: "A chi-square test"
        text_nl: "Een chi-kwadraattoets"
        correct: false
        feedback_en: "Incorrect. A chi-square test is for two categorical variables. Reaction time is a ratio variable."
        feedback_nl: "Onjuist. Een chi-kwadraattoets is voor twee categorische variabelen. Reactietijd is een ratiovariabele."
      - text_en: "A one-way ANOVA"
        text_nl: "Een eenweg-ANOVA"
        correct: false
        feedback_en: "Incorrect. A one-way ANOVA compares three or more independent groups. Here there are two linked measurements."
        feedback_nl: "Onjuist. Een eenweg-ANOVA vergelijkt drie of meer onafhankelijke groepen. Hier zijn er twee gekoppelde metingen."

  # bron: Research Skills oefenvragen, slide 42
  - id: 74
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "You compare the average tip of waiters who introduce themselves by name with the average tip of other waiters. Which test fits?"
    question_nl: "Je vergelijkt de gemiddelde fooi van obers die zich met hun naam voorstellen met de gemiddelde fooi van andere obers. Welke toets past hierbij?"
    answers:
      - text_en: "An independent-samples t-test"
        text_nl: "Een onafhankelijke t-toets"
        correct: true
        feedback_en: "Correct! You compare the mean of a ratio variable (tip in euros) between two different groups of people. The groups are independent: each waiter is in only one group."
        feedback_nl: "Correct! Je vergelijkt het gemiddelde van een ratiovariabele (fooi in euro's) tussen twee verschillende groepen mensen. De groepen zijn onafhankelijk: elke ober zit in maar één groep."
      - text_en: "A paired-samples t-test"
        text_nl: "Een gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. A paired t-test is for linked measurements (e.g. the same people twice). These are two separate groups of waiters."
        feedback_nl: "Onjuist. Een gepaarde t-toets is voor gekoppelde metingen (bijv. dezelfde mensen twee keer). Dit zijn twee aparte groepen obers."
      - text_en: "A chi-square test"
        text_nl: "Een chi-kwadraattoets"
        correct: false
        feedback_en: "Incorrect. A chi-square test is for two categorical variables. The tip is an amount in euros, so you compare means."
        feedback_nl: "Onjuist. Een chi-kwadraattoets is voor twee categorische variabelen. De fooi is een bedrag in euro's, dus je vergelijkt gemiddelden."
      - text_en: "A Pearson correlation"
        text_nl: "Een Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Pearson's r requires two interval/ratio variables. 'Introduces himself by name (yes/no)' is a grouping variable."
        feedback_nl: "Onjuist. Pearsons r vraagt twee interval-/ratiovariabelen. 'Stelt zich voor met naam (ja/nee)' is een groepsvariabele."

  # bron: Research Skills oefenvragen, slide 43
  - id: 75
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    image: "images/q_paired_ttest_training.png"
    question_en: "25 employees rated their job satisfaction (1–10) before and after a training course. Based on the output above, which statement is correct (α = 0.05)?"
    question_nl: "25 medewerkers beoordeelden hun werktevredenheid (1–10) voor en na een training. Welke uitspraak is juist op basis van de output hierboven (α = 0,05)?"
    answers:
      - text_en: "Satisfaction is significantly higher after the training"
        text_nl: "De tevredenheid is na de training significant hoger"
        correct: true
        feedback_en: "Correct! t(24) = −2.80, p = 0.010 < 0.05: significant. The difference is computed as 'before − after' = 6.20 − 6.90 = −0.70, so a negative difference means the score after the training is higher."
        feedback_nl: "Correct! t(24) = −2,80, p = 0,010 < 0,05: significant. Het verschil is berekend als 'voor − na' = 6,20 − 6,90 = −0,70. Een negatief verschil betekent dus dat de score ná de training hoger is."
      - text_en: "Satisfaction is significantly lower after the training"
        text_nl: "De tevredenheid is na de training significant lager"
        correct: false
        feedback_en: "Incorrect. The negative t comes from 'before − after'. The means show 6.90 after versus 6.20 before: satisfaction went up."
        feedback_nl: "Onjuist. De negatieve t komt van 'voor − na'. De gemiddelden tonen 6,90 na tegenover 6,20 voor: de tevredenheid is gestegen."
      - text_en: "There is no significant difference, because t is negative"
        text_nl: "Er is geen significant verschil, omdat t negatief is"
        correct: false
        feedback_en: "Incorrect. The sign of t tells you the direction, not the significance. p = 0.010 < 0.05, so the difference is significant."
        feedback_nl: "Onjuist. Het teken van t zegt iets over de richting, niet over de significantie. p = 0,010 < 0,05, dus het verschil is significant."
      - text_en: "An independent-samples t-test should have been used"
        text_nl: "Er had een onafhankelijke t-toets gebruikt moeten worden"
        correct: false
        feedback_en: "Incorrect. The same people were measured twice, so a paired-samples t-test is correct."
        feedback_nl: "Onjuist. Dezelfde personen zijn twee keer gemeten, dus een gepaarde t-toets is juist."

  # bron: Research Skills oefenvragen, slide 44
  - id: 76
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "In an independent-samples t-test, Levene's test gives p = 0.002. What should you do?"
    question_nl: "Bij een onafhankelijke t-toets geeft de toets van Levene p = 0,002. Wat doe je?"
    answers:
      - text_en: "Stop: no t-test can be performed"
        text_nl: "Stoppen: er kan geen t-toets worden uitgevoerd"
        correct: false
        feedback_en: "Incorrect. Unequal variances do not make the t-test unusable; there is a version that does not assume equal variances."
        feedback_nl: "Onjuist. Ongelijke varianties maken de t-toets niet onbruikbaar; er is een versie die geen gelijke varianties aanneemt."
      - text_en: "Use a paired-samples t-test instead"
        text_nl: "In plaats daarvan een gepaarde t-toets gebruiken"
        correct: false
        feedback_en: "Incorrect. Whether a test is paired depends on the design (same people measured twice), not on Levene's test."
        feedback_nl: "Onjuist. Of een toets gepaard is, hangt af van het design (dezelfde mensen twee keer gemeten), niet van de toets van Levene."
      - text_en: "Report Welch's t-test (equal variances not assumed)"
        text_nl: "De Welch-toets rapporteren (gelijke varianties niet aangenomen)"
        correct: true
        feedback_en: "Correct! p = 0.002 < 0.05: the variances differ significantly. You then report the version that does not assume equal variances: Welch's t-test (in SPSS the row 'Equal variances not assumed')."
        feedback_nl: "Correct! p = 0,002 < 0,05: de varianties verschillen significant. Je rapporteert dan de versie die geen gelijke varianties aanneemt: de Welch-toets (in SPSS de regel 'Equal variances not assumed')."
      - text_en: "Use a chi-square test instead"
        text_nl: "In plaats daarvan een chi-kwadraattoets gebruiken"
        correct: false
        feedback_en: "Incorrect. A chi-square test is for two categorical variables; the dependent variable here is still an interval/ratio variable."
        feedback_nl: "Onjuist. Een chi-kwadraattoets is voor twee categorische variabelen; de afhankelijke variabele is hier nog steeds een interval-/ratiovariabele."

  # ── ANOVA ─────────────────────────────────────────────────────────────────

  - id: 77
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Which of the following statements on an ANOVA test is false?"
    question_nl: "Welke van de volgende uitspraken over een ANOVA-toets is onjuist?"
    answers:
      - text_en: "We use an ANOVA when we want to test for the differences in the average scores for at least three distinct groups"
        text_nl: "We gebruiken een ANOVA als we de verschillen in gemiddelde scores voor minimaal drie afzonderlijke groepen willen toetsen"
        correct: false
        feedback_en: "This statement is TRUE. ANOVA is used when comparing means of 3 or more groups."
        feedback_nl: "Deze uitspraak is WAAR. ANOVA wordt gebruikt bij het vergelijken van gemiddelden van 3 of meer groepen."
      - text_en: "Using an ANOVA to compare the means of two groups is equal to executing an independent samples T-test"
        text_nl: "Een ANOVA gebruiken om de gemiddelden van twee groepen te vergelijken is gelijk aan het uitvoeren van een onafhankelijke steekproef t-toets"
        correct: false
        feedback_en: "This statement is TRUE. With two groups, ANOVA and an independent samples t-test give the same result (F = t²)."
        feedback_nl: "Deze uitspraak is WAAR. Met twee groepen geven ANOVA en een onafhankelijke t-toets hetzelfde resultaat (F = t²)."
      - text_en: "Executing an ANOVA without a post-hoc test such as the Bonferroni or the Games-Howell is useless"
        text_nl: "Een ANOVA uitvoeren zonder een post-hoctoets zoals de Bonferroni of de Games-Howell is zinloos"
        correct: true
        feedback_en: "Correct — this IS false. ANOVA tells you that at least one group differs, which IS useful information. Post-hoc tests tell you WHICH groups differ, but ANOVA alone is not useless."
        feedback_nl: "Correct — dit IS onjuist. ANOVA vertelt je dat minstens één groep verschilt, wat WEL nuttige informatie is. Post-hoctoetsen vertellen je WELKE groepen verschillen, maar ANOVA alleen is niet zinloos."
      - text_en: "The Welch-test is used to substitute the ANOVA F-test when the assumption of homogeneity of variance is violated"
        text_nl: "De Welch-toets wordt gebruikt als vervanging van de ANOVA F-toets wanneer de aanname van homogeniteit van variantie is geschonden"
        correct: false
        feedback_en: "This statement is TRUE. When Levene's test shows unequal variances, the Welch ANOVA is the robust alternative."
        feedback_nl: "Deze uitspraak is WAAR. Als Levene's toets ongelijke varianties aantoont, is de Welch ANOVA het robuuste alternatief."

  # bron: Research Skills oefenvragen, slide 46
  - id: 78
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    image: "images/q_anova_locations.png"
    question_en: "Guest satisfaction (1–10) was compared between three hotel locations. Based on the output above, which conclusion is correct (α = 0.05)?"
    question_nl: "De gasttevredenheid (1–10) is vergeleken tussen drie hotellocaties. Welke conclusie is juist op basis van de output hierboven (α = 0,05)?"
    answers:
      - text_en: "All three locations differ significantly from each other"
        text_nl: "Alle drie de locaties verschillen significant van elkaar"
        correct: false
        feedback_en: "Incorrect. An ANOVA only tells you that at least one group mean differs, not which groups differ from each other. For that you need a post-hoc test."
        feedback_nl: "Onjuist. Een ANOVA zegt alleen dat minstens één groepsgemiddelde afwijkt, niet welke groepen precies van elkaar verschillen. Daarvoor heb je een post-hoctoets nodig."
      - text_en: "The mean satisfaction differs significantly for at least one location"
        text_nl: "De gemiddelde tevredenheid verschilt significant voor minstens één locatie"
        correct: true
        feedback_en: "Correct! F(2, 87) = 10.72, p < 0.001: H0 (all means equal) is rejected. So at least one location's mean differs from the others."
        feedback_nl: "Correct! F(2, 87) = 10,72, p < 0,001: H0 (alle gemiddelden gelijk) wordt verworpen. Minstens één locatie heeft dus een afwijkend gemiddelde."
      - text_en: "There is no significant difference between the locations"
        text_nl: "Er is geen significant verschil tussen de locaties"
        correct: false
        feedback_en: "Incorrect. p < 0.001 is smaller than 0.05, so there is a significant difference."
        feedback_nl: "Onjuist. p < 0,001 is kleiner dan 0,05, dus er is wel een significant verschil."
      - text_en: "The airport hotel has the highest satisfaction"
        text_nl: "Het luchthavenhotel heeft de hoogste tevredenheid"
        correct: false
        feedback_en: "Incorrect. The airport hotel has the lowest mean (6.50); the beach hotel has the highest (8.10)."
        feedback_nl: "Onjuist. Het luchthavenhotel heeft juist het laagste gemiddelde (6,50); het strandhotel het hoogste (8,10)."

  # bron: Research Skills oefenvragen, slide 47
  - id: 79
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    image: "images/q_anova_posthoc.png"
    question_en: "After the ANOVA of the previous question, a Tukey post-hoc test was run (see the output above). Which pairs of locations differ significantly (α = 0.05)?"
    question_nl: "Na de ANOVA van de vorige vraag is een post-hoctoets van Tukey uitgevoerd (zie de output hierboven). Welke paren locaties verschillen significant (α = 0,05)?"
    answers:
      - text_en: "Only Beach – Airport"
        text_nl: "Alleen Beach – Airport"
        correct: false
        feedback_en: "Incorrect. City – Beach is also significant: p tukey = 0.029 < 0.05."
        feedback_nl: "Onjuist. City – Beach is ook significant: p tukey = 0,029 < 0,05."
      - text_en: "All three pairs"
        text_nl: "Alle drie de paren"
        correct: false
        feedback_en: "Incorrect. City – Airport has p tukey = 0.112 > 0.05, so that pair does not differ significantly."
        feedback_nl: "Onjuist. City – Airport heeft p tukey = 0,112 > 0,05, dus dat paar verschilt niet significant."
      - text_en: "City – Beach and Beach – Airport"
        text_nl: "City – Beach en Beach – Airport"
        correct: true
        feedback_en: "Correct! Look at the 'p tukey' column: City – Beach (p = 0.029) and Beach – Airport (p < 0.001) are below 0.05; City – Airport (p = 0.112) is not. The sign of the mean difference only gives the direction."
        feedback_nl: "Correct! Kijk naar de kolom 'p tukey': City – Beach (p = 0,029) en Beach – Airport (p < 0,001) zijn kleiner dan 0,05; City – Airport (p = 0,112) niet. Het teken van het gemiddelde verschil geeft alleen de richting."
      - text_en: "Only City – Airport"
        text_nl: "Alleen City – Airport"
        correct: false
        feedback_en: "Incorrect. City – Airport is precisely the only pair that is not significant (p = 0.112)."
        feedback_nl: "Onjuist. City – Airport is juist het enige paar dat níét significant is (p = 0,112)."

  # bron: Research Skills oefenvragen, slide 48
  - id: 80
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Why do you perform a post-hoc test after a significant ANOVA?"
    question_nl: "Waarom voer je na een significante ANOVA een post-hoctoets uit?"
    answers:
      - text_en: "To check whether the variances are equal"
        text_nl: "Om te controleren of de varianties gelijk zijn"
        correct: false
        feedback_en: "Incorrect. Equal variances are checked with Levene's test, before interpreting the ANOVA."
        feedback_nl: "Onjuist. Gelijke varianties controleer je met de toets van Levene, vóór je de ANOVA interpreteert."
      - text_en: "To increase the sample size"
        text_nl: "Om de steekproef te vergroten"
        correct: false
        feedback_en: "Incorrect. A post-hoc test uses the same data; it does not add observations."
        feedback_nl: "Onjuist. Een post-hoctoets gebruikt dezelfde data; er komen geen waarnemingen bij."
      - text_en: "To check whether the data are normally distributed"
        text_nl: "Om te controleren of de data normaal verdeeld zijn"
        correct: false
        feedback_en: "Incorrect. Normality is checked with, for example, the Shapiro-Wilk test."
        feedback_nl: "Onjuist. Normaliteit controleer je bijvoorbeeld met de Shapiro-Wilk-toets."
      - text_en: "To find out which groups differ from each other"
        text_nl: "Om te achterhalen welke groepen van elkaar verschillen"
        correct: true
        feedback_en: "Correct! A significant ANOVA only says that at least one group differs. A post-hoc test (e.g. Tukey, Bonferroni or Games-Howell) compares the groups pairwise and corrects for the number of comparisons."
        feedback_nl: "Correct! Een significante ANOVA vertelt alleen dat minstens één groep afwijkt. Een post-hoctoets (bijvoorbeeld Tukey, Bonferroni of Games-Howell) vergelijkt de groepen paarsgewijs en corrigeert daarbij voor het aantal vergelijkingen."

  # bron: Research Skills oefenvragen, slide 49
  - id: 81
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Why do you use an ANOVA instead of three separate t-tests to compare three groups?"
    question_nl: "Waarom gebruik je een ANOVA in plaats van drie losse t-toetsen om drie groepen te vergelijken?"
    answers:
      - text_en: "Multiple tests increase the risk of a type I error"
        text_nl: "Meerdere toetsen vergroten de kans op een type I-fout"
        correct: true
        feedback_en: "Correct! Each test has an α (5%) chance of a type I error. With three separate tests the chance of at least one false positive is about 1 − 0.95³ ≈ 14%. The ANOVA tests all groups at once with α = 0.05."
        feedback_nl: "Correct! Elke toets heeft een kans van α (5%) op een type I-fout. Bij drie losse toetsen is de kans dat er minstens één keer onterecht een verschil gevonden wordt ongeveer 1 − 0,95³ ≈ 14%. De ANOVA toetst alle groepen in één keer met α = 0,05."
      - text_en: "A t-test cannot handle more than 20 respondents"
        text_nl: "Een t-toets kan niet meer dan 20 respondenten aan"
        correct: false
        feedback_en: "Incorrect. A t-test has no maximum number of respondents."
        feedback_nl: "Onjuist. Een t-toets heeft geen maximum aantal respondenten."
      - text_en: "A t-test requires nominal data"
        text_nl: "Een t-toets vereist nominale data"
        correct: false
        feedback_en: "Incorrect. A t-test compares means of an interval/ratio variable; only the grouping variable is nominal."
        feedback_nl: "Onjuist. Een t-toets vergelijkt gemiddelden van een interval-/ratiovariabele; alleen de groepsvariabele is nominaal."
      - text_en: "An ANOVA always gives a smaller p-value"
        text_nl: "Een ANOVA geeft altijd een kleinere p-waarde"
        correct: false
        feedback_en: "Incorrect. There is no such rule. The reason is controlling the overall type I error, not getting a smaller p-value."
        feedback_nl: "Onjuist. Zo'n regel bestaat niet. De reden is het beheersen van de totale type I-fout, niet een kleinere p-waarde."

  # ── TORI — practice test Dr. Tori Langill (100 questions, tag: Tori) ─────
  # Source: Statistics_100_Question_Test_Mixed_Scenarios.docx + Answer Key.
  # id = 100 + original question number. Remove all entries with tags: ["Tori"] to roll back.

  - id: 101
    tags: ["Tori"]
    source: "Tori Langill practice test, q1"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "Guests complete a stable preference scale twice under similar conditions. Which property is assessed by comparing their scores?"
    question_nl: "Gasten vullen een stabiele voorkeursschaal twee keer in onder vergelijkbare omstandigheden. Welke eigenschap wordt beoordeeld door hun scores te vergelijken?"
    answers:
      - text_en: "Content validity"
        text_nl: "Inhoudsvaliditeit"
        correct: false
        feedback_en: "Incorrect. Content validity concerns whether the questions cover all relevant aspects of the concept, not whether scores are stable over time."
        feedback_nl: "Onjuist. Inhoudsvaliditeit gaat over de vraag of de items alle relevante aspecten van het begrip dekken, niet over de stabiliteit van scores in de tijd."
      - text_en: "A Type I error"
        text_nl: "Een Type I-fout"
        correct: false
        feedback_en: "Incorrect. A Type I error is a decision error in hypothesis testing (rejecting a true H₀). It is not a property of a measurement instrument."
        feedback_nl: "Onjuist. Een Type I-fout is een beslissingsfout bij het toetsen van hypothesen (een ware H₀ verwerpen). Het is geen eigenschap van een meetinstrument."
      - text_en: "Probability sampling"
        text_nl: "Kanssteekproef"
        correct: false
        feedback_en: "Incorrect. Probability sampling is about how respondents are selected, not about how consistently an instrument measures."
        feedback_nl: "Onjuist. Een kanssteekproef gaat over hoe respondenten geselecteerd worden, niet over hoe consistent een instrument meet."
      - text_en: "Test-retest reliability"
        text_nl: "Test-hertestbetrouwbaarheid"
        correct: true
        feedback_en: "Correct! Administering the same instrument twice to people whose preferences are stable and comparing the scores assesses stability over time: test-retest reliability."
        feedback_nl: "Correct! Hetzelfde instrument twee keer afnemen bij mensen met stabiele voorkeuren en de scores vergelijken, toetst de stabiliteit in de tijd: test-hertestbetrouwbaarheid."

  - id: 102
    tags: ["Tori"]
    source: "Tori Langill practice test, q2"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "Study hours and exam scores have r = .75 and p = .03. Which conclusion is justified at α = .05?"
    question_nl: "Studie-uren en tentamenscores hebben r = .75 en p = .03. Welke conclusie is gerechtvaardigd bij α = .05?"
    answers:
      - text_en: "There is evidence of a positive linear association"
        text_nl: "Er is bewijs voor een positief lineair verband"
        correct: true
        feedback_en: "Correct! r is positive and p = .03 < .05, so there is statistically significant evidence of a positive linear association. Correlation alone does not show causation."
        feedback_nl: "Correct! r is positief en p = .03 < .05, dus er is statistisch significant bewijs voor een positief lineair verband. Correlatie alleen toont geen oorzakelijkheid aan."
      - text_en: "Every student who studies longer scores higher"
        text_nl: "Elke student die langer studeert, scoort hoger"
        correct: false
        feedback_en: "Incorrect. A correlation describes a general tendency, not a rule that holds for every individual. With r = .75 there are still exceptions."
        feedback_nl: "Onjuist. Een correlatie beschrijft een algemene tendens, geen regel die voor elk individu geldt. Bij r = .75 zijn er nog steeds uitzonderingen."
      - text_en: "Studying more is proved to cause higher scores"
        text_nl: "Het is bewezen dat meer studeren hogere scores veroorzaakt"
        correct: false
        feedback_en: "Incorrect. Correlation does not prove causation. Other variables (e.g. motivation or prior knowledge) could explain the association."
        feedback_nl: "Onjuist. Correlatie bewijst geen oorzakelijkheid. Andere variabelen (bijv. motivatie of voorkennis) kunnen het verband verklaren."
      - text_en: "There is no evidence of association"
        text_nl: "Er is geen bewijs voor een verband"
        correct: false
        feedback_en: "Incorrect. p = .03 is below α = .05, so H₀ (no correlation in the population) is rejected. There is evidence of an association."
        feedback_nl: "Onjuist. p = .03 ligt onder α = .05, dus H₀ (geen correlatie in de populatie) wordt verworpen. Er is wél bewijs voor een verband."

  - id: 103
    tags: ["Tori"]
    source: "Tori Langill practice test, q3"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "After a significant standard ANOVA, which procedure is suitable for all pairwise comparisons when equal-variance conditions are met?"
    question_nl: "Welke procedure is na een significante standaard-ANOVA geschikt voor alle paarsgewijze vergelijkingen, als aan de voorwaarde van gelijke varianties is voldaan?"
    answers:
      - text_en: "An unadjusted t-test for every pair"
        text_nl: "Een ongecorrigeerde t-toets voor elk paar"
        correct: false
        feedback_en: "Incorrect. Running many unadjusted t-tests inflates the familywise risk of a Type I error. A post-hoc test with correction is needed."
        feedback_nl: "Onjuist. Veel ongecorrigeerde t-toetsen verhogen de kans op minstens één Type I-fout. Er is een post-hoctoets met correctie nodig."
      - text_en: "Pearson correlation"
        text_nl: "Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Pearson correlation measures the linear association between two numeric variables; it does not compare group means."
        feedback_nl: "Onjuist. Pearson-correlatie meet het lineaire verband tussen twee numerieke variabelen; ze vergelijkt geen groepsgemiddelden."
      - text_en: "Levene's test"
        text_nl: "De toets van Levene"
        correct: false
        feedback_en: "Incorrect. Levene's test checks whether group variances are equal (an assumption). It does not tell you which group means differ."
        feedback_nl: "Onjuist. De toets van Levene controleert of de groepsvarianties gelijk zijn (een voorwaarde). Hij zegt niet welke groepsgemiddelden verschillen."
      - text_en: "Tukey HSD"
        text_nl: "Tukey HSD"
        correct: true
        feedback_en: "Correct! Tukey HSD compares all pairs of means while controlling the familywise error rate, and it assumes equal variances, which are met here."
        feedback_nl: "Correct! Tukey HSD vergelijkt alle paren gemiddelden en houdt daarbij de familiewise foutkans onder controle. De toets veronderstelt gelijke varianties, en daaraan is hier voldaan."

  - id: 104
    tags: ["Tori"]
    source: "Tori Langill practice test, q4"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A mean estimate is 100 ± 6. What is the lower confidence bound?"
    question_nl: "Een geschat gemiddelde is 100 ± 6. Wat is de ondergrens van het betrouwbaarheidsinterval?"
    answers:
      - text_en: "6"
        text_nl: "6"
        correct: false
        feedback_en: "Incorrect. 6 is the margin of error, not a bound of the interval."
        feedback_nl: "Onjuist. 6 is de foutmarge, geen grens van het interval."
      - text_en: "100"
        text_nl: "100"
        correct: false
        feedback_en: "Incorrect. 100 is the point estimate (the midpoint of the interval), not the lower bound."
        feedback_nl: "Onjuist. 100 is de puntschatting (het midden van het interval), niet de ondergrens."
      - text_en: "94"
        text_nl: "94"
        correct: true
        feedback_en: "Correct! Lower bound = point estimate − margin of error = 100 − 6 = 94."
        feedback_nl: "Correct! Ondergrens = puntschatting − foutmarge = 100 − 6 = 94."
      - text_en: "106"
        text_nl: "106"
        correct: false
        feedback_en: "Incorrect. 106 = 100 + 6 is the upper bound, not the lower bound."
        feedback_nl: "Onjuist. 106 = 100 + 6 is de bovengrens, niet de ondergrens."

  - id: 105
    tags: ["Tori"]
    source: "Tori Langill practice test, q5"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "A hotel tests a staff-training programme intended to improve guest satisfaction. Training takes place over two afternoons and includes role-play activities, and employees receive a certificate at the end. H₀ states that the programme does not improve satisfaction. After analysing the study, the researcher rejects H₀ and reports that the programme improves satisfaction. For the purpose of this question, suppose that the true situation is known: the programme actually produces no improvement in guest satisfaction. Management nevertheless decides to continue the training because of the reported finding. Comparing the research decision with the true situation, what type of outcome has occurred?"
    question_nl: "Een hotel test een trainingsprogramma voor medewerkers dat de gastentevredenheid moet verbeteren. De training duurt twee middagen, bevat rollenspellen, en medewerkers krijgen aan het eind een certificaat. H₀ stelt dat het programma de tevredenheid niet verbetert. Na analyse van het onderzoek verwerpt de onderzoeker H₀ en rapporteert dat het programma de tevredenheid verbetert. Veronderstel voor deze vraag dat de werkelijke situatie bekend is: het programma levert in werkelijkheid geen verbetering van de gastentevredenheid op. Het management besluit toch de training voort te zetten vanwege de gerapporteerde bevinding. Welk type uitkomst is er opgetreden als je de onderzoeksbeslissing vergelijkt met de werkelijke situatie?"
    answers:
      - text_en: "Correct nonrejection"
        text_nl: "Terecht niet verwerpen"
        correct: false
        feedback_en: "Incorrect. H₀ was rejected, not retained, so this cannot be a correct nonrejection."
        feedback_nl: "Onjuist. H₀ werd verworpen, niet behouden, dus dit kan geen terecht niet-verwerpen zijn."
      - text_en: "Type I error"
        text_nl: "Type I-fout"
        correct: true
        feedback_en: "Correct! H₀ (no improvement) is actually true, yet it was rejected. Rejecting a true H₀ is a Type I error. The training details (two afternoons, role-play, certificate) are irrelevant."
        feedback_nl: "Correct! H₀ (geen verbetering) is in werkelijkheid waar, maar werd toch verworpen. Een ware H₀ verwerpen is een Type I-fout. De details van de training (twee middagen, rollenspel, certificaat) zijn niet relevant."
      - text_en: "Correct rejection"
        text_nl: "Terecht verwerpen"
        correct: false
        feedback_en: "Incorrect. A rejection is only correct when H₀ is false. Here H₀ is true (there is no improvement), so the rejection is wrong."
        feedback_nl: "Onjuist. Verwerpen is alleen terecht als H₀ onwaar is. Hier is H₀ waar (er is geen verbetering), dus het verwerpen is onterecht."
      - text_en: "Type II error"
        text_nl: "Type II-fout"
        correct: false
        feedback_en: "Incorrect. A Type II error means failing to reject a false H₀. Here H₀ was rejected, and it was true."
        feedback_nl: "Onjuist. Een Type II-fout betekent een onware H₀ niet verwerpen. Hier werd H₀ juist verworpen, terwijl die waar was."

  - id: 106
    tags: ["Tori"]
    source: "Tori Langill practice test, q6"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "Why is a post-hoc procedure generally unnecessary for a t-test comparing two groups?"
    question_nl: "Waarom is een post-hoctoets meestal niet nodig bij een t-toets die twee groepen vergelijkt?"
    answers:
      - text_en: "A t-test proves every assumption"
        text_nl: "Een t-toets bewijst alle voorwaarden"
        correct: false
        feedback_en: "Incorrect. No test proves its own assumptions; they have to be checked separately. This is not why post-hoc tests are unnecessary."
        feedback_nl: "Onjuist. Geen enkele toets bewijst zijn eigen voorwaarden; die moet je apart controleren. Dit is niet de reden dat een post-hoctoets overbodig is."
      - text_en: "There is only one pair of group means to compare"
        text_nl: "Er is maar één paar groepsgemiddelden om te vergelijken"
        correct: true
        feedback_en: "Correct! With two groups there is just one comparison. If the t-test is significant, you already know which two means differ, so there is nothing left to locate."
        feedback_nl: "Correct! Bij twee groepen is er maar één vergelijking. Als de t-toets significant is, weet je al welke twee gemiddelden verschillen; er valt niets meer te lokaliseren."
      - text_en: "Post-hoc procedures cannot use numeric outcomes"
        text_nl: "Post-hoctoetsen kunnen geen numerieke uitkomsten gebruiken"
        correct: false
        feedback_en: "Incorrect. Post-hoc procedures (e.g. Tukey) are in fact used with numeric outcomes after ANOVA."
        feedback_nl: "Onjuist. Post-hoctoetsen (bijv. Tukey) worden juist gebruikt met numerieke uitkomsten na een ANOVA."
      - text_en: "A t-test automatically corrects all future comparisons"
        text_nl: "Een t-toets corrigeert automatisch alle toekomstige vergelijkingen"
        correct: false
        feedback_en: "Incorrect. A t-test makes no correction for other comparisons. It is simply a single comparison of two means."
        feedback_nl: "Onjuist. Een t-toets corrigeert niet voor andere vergelijkingen. Het is gewoon één enkele vergelijking van twee gemiddelden."

  - id: 107
    tags: ["Tori"]
    source: "Tori Langill practice test, q7"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "The front-office team at a city hotel wants to understand how guests experienced their recent stays. The hotel had a busy summer, opened a new terrace, and changed the colour of its lobby furniture. Management would like the results to describe all guests who stayed during September, including guests who checked out early or did not use the restaurant. The researcher obtains a complete list of guest IDs for that month. A computer randomly draws 80 IDs from the full list, without first dividing guests into subgroups or selecting particular floors. The selected guests are then invited to complete a questionnaire. Which sampling method is used?"
    question_nl: "Het front-officeteam van een stadshotel wil weten hoe gasten hun recente verblijf hebben ervaren. Het hotel had een drukke zomer, opende een nieuw terras en veranderde de kleur van de lobbymeubels. Het management wil dat de resultaten iets zeggen over alle gasten die in september verbleven, ook gasten die vroegtijdig uitcheckten of geen gebruik maakten van het restaurant. De onderzoeker krijgt een volledige lijst van de gast-ID's van die maand. Een computer trekt willekeurig 80 ID's uit de volledige lijst, zonder de gasten eerst in subgroepen te verdelen of bepaalde verdiepingen te selecteren. De geselecteerde gasten worden vervolgens uitgenodigd om een vragenlijst in te vullen. Welke steekproefmethode wordt gebruikt?"
    answers:
      - text_en: "Quota sampling"
        text_nl: "Quotasteekproef"
        correct: false
        feedback_en: "Incorrect. Quota sampling fills fixed numbers per subgroup without random selection. Here there are no subgroups and the selection is random."
        feedback_nl: "Onjuist. Bij een quotasteekproef vul je vaste aantallen per subgroep zonder aselecte trekking. Hier zijn er geen subgroepen en is de selectie aselect."
      - text_en: "Simple random sampling"
        text_nl: "Enkelvoudige aselecte steekproef"
        correct: true
        feedback_en: "Correct! A complete list (sampling frame) is used and 80 individual IDs are drawn at random, without strata or clusters: simple random sampling. The terrace and the furniture are irrelevant."
        feedback_nl: "Correct! Er wordt een volledige lijst (steekproefkader) gebruikt en 80 individuele ID's worden aselect getrokken, zonder strata of clusters: een enkelvoudige aselecte steekproef. Het terras en de meubels zijn niet relevant."
      - text_en: "Convenience sampling"
        text_nl: "Gemakssteekproef"
        correct: false
        feedback_en: "Incorrect. In a convenience sample you use whoever is easy to reach. Here a computer draws at random from the full list."
        feedback_nl: "Onjuist. Bij een gemakssteekproef neem je wie makkelijk bereikbaar is. Hier trekt een computer aselect uit de volledige lijst."
      - text_en: "Cluster sampling"
        text_nl: "Clustersteekproef"
        correct: false
        feedback_en: "Incorrect. Cluster sampling selects whole groups (e.g. floors or hotels). The text explicitly says no floors or groups were selected."
        feedback_nl: "Onjuist. Bij een clustersteekproef selecteer je hele groepen (bijv. verdiepingen of hotels). De tekst zegt uitdrukkelijk dat er geen verdiepingen of groepen geselecteerd zijn."

  - id: 108
    tags: ["Tori"]
    source: "Tori Langill practice test, q8"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Two independent groups of guests used different check-in procedures at a hotel. Management wants to compare their mean spending during the stay and has also recorded nationality, arrival time, and room category. A staff member suggests running the mean comparison immediately because the software will provide a p-value. The researcher notices that a few guests have very large spending totals and that spending may be unevenly distributed. Before choosing and interpreting the mean comparison, she wants to inspect the shape and extreme values of spending in each group. The question is about the numeric outcome within the two groups, not about how many guests belong to each group. Which first step would be useful?"
    question_nl: "Twee onafhankelijke groepen gasten gebruikten verschillende incheckprocedures in een hotel. Het management wil hun gemiddelde bestedingen tijdens het verblijf vergelijken en heeft ook nationaliteit, aankomsttijd en kamercategorie geregistreerd. Een medewerker stelt voor de gemiddelden meteen te vergelijken, omdat de software toch een p-waarde geeft. De onderzoeker merkt dat enkele gasten zeer hoge bestedingen hebben en dat de bestedingen mogelijk scheef verdeeld zijn. Voordat ze de vergelijking van gemiddelden kiest en interpreteert, wil ze de vorm en de extreme waarden van de bestedingen in elke groep bekijken. De vraag gaat over de numerieke uitkomst binnen de twee groepen, niet over hoeveel gasten er in elke groep zitten. Welke eerste stap is zinvol?"
    answers:
      - text_en: "Check only the p-value of the final test"
        text_nl: "Alleen de p-waarde van de uiteindelijke toets bekijken"
        correct: false
        feedback_en: "Incorrect. The p-value says nothing about skewness or outliers, which can make a mean comparison misleading. Look at the data first."
        feedback_nl: "Onjuist. De p-waarde zegt niets over scheefheid of uitschieters, die een vergelijking van gemiddelden misleidend kunnen maken. Bekijk eerst de data."
      - text_en: "Replace all spending values with group names"
        text_nl: "Alle bestedingen vervangen door groepsnamen"
        correct: false
        feedback_en: "Incorrect. That would throw away the numeric outcome you want to analyse."
        feedback_nl: "Onjuist. Daarmee gooi je juist de numerieke uitkomst weg die je wilt analyseren."
      - text_en: "Make a pie chart of all spending values"
        text_nl: "Een cirkeldiagram maken van alle bestedingen"
        correct: false
        feedback_en: "Incorrect. A pie chart shows shares of a whole for categories. It cannot show the distribution, skewness or outliers of a numeric variable."
        feedback_nl: "Onjuist. Een cirkeldiagram toont aandelen van een geheel voor categorieën. Het kan de verdeling, scheefheid of uitschieters van een numerieke variabele niet tonen."
      - text_en: "Inspect spending distributions separately for each group"
        text_nl: "De verdeling van de bestedingen per groep apart bekijken"
        correct: true
        feedback_en: "Correct! Spending is numeric and may be skewed with extreme values. Inspecting each group's distribution (e.g. histogram or boxplot per group) before the mean comparison is the right first step."
        feedback_nl: "Correct! Bestedingen zijn numeriek en mogelijk scheef met extreme waarden. De verdeling per groep bekijken (bijv. histogram of boxplot per groep) vóór de vergelijking van gemiddelden is de juiste eerste stap."

  - id: 109
    tags: ["Tori"]
    source: "Tori Langill practice test, q9"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "Which statement correctly contrasts Pearson correlation and the chi-square test of independence?"
    question_nl: "Welke uitspraak geeft het verschil tussen Pearson-correlatie en de chi-kwadraattoets op onafhankelijkheid correct weer?"
    answers:
      - text_en: "Pearson assesses category counts; chi-square compares numeric means"
        text_nl: "Pearson beoordeelt aantallen per categorie; chi-kwadraat vergelijkt numerieke gemiddelden"
        correct: false
        feedback_en: "Incorrect. This is the wrong way round, and chi-square does not compare means at all; it works with counts of categories."
        feedback_nl: "Onjuist. Dit is precies omgekeerd, en chi-kwadraat vergelijkt helemaal geen gemiddelden; de toets werkt met aantallen per categorie."
      - text_en: "Chi-square gives the direction and magnitude of Pearson r"
        text_nl: "Chi-kwadraat geeft de richting en grootte van Pearsons r"
        correct: false
        feedback_en: "Incorrect. Chi-square has no direction (it is never negative) and does not produce Pearson's r."
        feedback_nl: "Onjuist. Chi-kwadraat heeft geen richting (de waarde is nooit negatief) en levert geen Pearsons r op."
      - text_en: "Both establish causation when p < .05"
        text_nl: "Beide tonen oorzakelijkheid aan als p < .05"
        correct: false
        feedback_en: "Incorrect. Neither test establishes causation. A significant result only shows an association."
        feedback_nl: "Onjuist. Geen van beide toetsen toont oorzakelijkheid aan. Een significant resultaat laat alleen een verband zien."
      - text_en: "Pearson assesses numeric linear association; chi-square assesses categorical association"
        text_nl: "Pearson beoordeelt een lineair verband tussen numerieke variabelen; chi-kwadraat een verband tussen categorische variabelen"
        correct: true
        feedback_en: "Correct! Pearson r is for two numeric (interval/ratio) variables; the chi-square test of independence is for two categorical variables in a crosstab."
        feedback_nl: "Correct! Pearsons r is voor twee numerieke variabelen (interval/ratio); de chi-kwadraattoets op onafhankelijkheid is voor twee categorische variabelen in een kruistabel."

  - id: 110
    tags: ["Tori"]
    source: "Tori Langill practice test, q10"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A researcher expects training to improve scores but chooses a two-sided question before seeing the data. Which analysis plan is coherent?"
    question_nl: "Een onderzoeker verwacht dat een training de scores verbetert, maar kiest vóór het bekijken van de data voor een tweezijdige vraag. Welk analyseplan is consistent?"
    answers:
      - text_en: "Test H₀: μafter = μbefore against H₁: μafter ≠ μbefore using paired data"
        text_nl: "Toets H₀: μafter = μbefore tegen H₁: μafter ≠ μbefore met gepaarde data"
        correct: true
        feedback_en: "Correct! A two-sided hypothesis uses ≠ in H₁, the outcome is a mean (μ), and the same people are measured twice, so the data are paired. Everything is specified in advance."
        feedback_nl: "Correct! Een tweezijdige hypothese gebruikt ≠ in H₁, de uitkomst is een gemiddelde (μ) en dezelfde mensen worden twee keer gemeten, dus de data zijn gepaard. Alles is vooraf vastgelegd."
      - text_en: "Choose the direction after seeing which p-value is smaller"
        text_nl: "De richting kiezen nadat je ziet welke p-waarde kleiner is"
        correct: false
        feedback_en: "Incorrect. Choosing hypotheses after seeing the data inflates the Type I error risk. Hypotheses must be fixed in advance."
        feedback_nl: "Onjuist. Hypothesen kiezen na het zien van de data verhoogt de kans op een Type I-fout. Hypothesen moeten vooraf vastliggen."
      - text_en: "Use an independent t-test because the same staff appear twice"
        text_nl: "Een onafhankelijke t-toets gebruiken omdat dezelfde medewerkers twee keer voorkomen"
        correct: false
        feedback_en: "Incorrect. When the same people appear twice, the measurements are dependent, so a paired test is needed, not an independent one."
        feedback_nl: "Onjuist. Als dezelfde mensen twee keer voorkomen, zijn de metingen afhankelijk; dan is een gepaarde toets nodig, geen onafhankelijke."
      - text_en: "Use π because training is a category"
        text_nl: "π gebruiken omdat training een categorie is"
        correct: false
        feedback_en: "Incorrect. The parameter follows the outcome variable. The outcome is a numeric score, so you use μ (mean), not π (proportion)."
        feedback_nl: "Onjuist. De parameter volgt de uitkomstvariabele. De uitkomst is een numerieke score, dus gebruik je μ (gemiddelde), niet π (proportie)."

  - id: 111
    tags: ["Tori"]
    source: "Tori Langill practice test, q11"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "A restaurant checks a batch of food before serving it to guests at a large conference. The conference organiser has changed the dinner time, and the kitchen is preparing several different menus. The inspection uses H₀: the food is safe. The inspection judges the batch safe and allows it to be served, but assume that the batch is actually unsafe. Missing an unsafe batch could harm guests, while rejecting a safe batch would mainly cause waste and delay. The chef argues that passing an inspection means no error can have occurred. Considering the stated null, the true condition, and the potential consequences, which assessment is best?"
    question_nl: "Een restaurant controleert een partij eten voordat het wordt geserveerd aan gasten op een groot congres. De organisator heeft het tijdstip van het diner veranderd en de keuken bereidt verschillende menu's. De inspectie gebruikt H₀: het eten is veilig. De inspectie beoordeelt de partij als veilig en laat ze serveren, maar veronderstel dat de partij in werkelijkheid onveilig is. Een onveilige partij missen kan gasten schaden, terwijl een veilige partij afkeuren vooral verspilling en vertraging veroorzaakt. De chef-kok stelt dat er geen fout kan zijn gemaakt als de partij door de inspectie is gekomen. Welke beoordeling is het best, gezien de nulhypothese, de werkelijke toestand en de mogelijke gevolgen?"
    answers:
      - text_en: "This is no error because the batch passed"
        text_nl: "Dit is geen fout, want de partij is goedgekeurd"
        correct: false
        feedback_en: "Incorrect. Passing the inspection is a decision, not the truth. The batch is actually unsafe, so retaining H₀ was wrong."
        feedback_nl: "Onjuist. Goedkeuring is een beslissing, niet de werkelijkheid. De partij is in werkelijkheid onveilig, dus H₀ behouden was fout."
      - text_en: "This is a Type I error because food is categorical"
        text_nl: "Dit is een Type I-fout, want eten is categorisch"
        correct: false
        feedback_en: "Incorrect. The type of error does not depend on the measurement level. A Type I error would be rejecting a true H₀ (rejecting safe food)."
        feedback_nl: "Onjuist. Het type fout hangt niet af van het meetniveau. Een Type I-fout zou het verwerpen van een ware H₀ zijn (veilig eten afkeuren)."
      - text_en: "Type I errors are always the more serious ones"
        text_nl: "Type I-fouten zijn altijd de ernstigste"
        correct: false
        feedback_en: "Incorrect. Which error is more serious depends on the consequences in the situation. Here missing unsafe food (Type II) is the more harmful one."
        feedback_nl: "Onjuist. Welke fout ernstiger is, hangt af van de gevolgen in de situatie. Hier is onveilig eten missen (Type II) juist het schadelijkst."
      - text_en: "This is a Type II error with potentially serious consequences"
        text_nl: "Dit is een Type II-fout met mogelijk ernstige gevolgen"
        correct: true
        feedback_en: "Correct! H₀ (food is safe) is false, but it was not rejected: a Type II error. Because guests could be harmed, this error is serious here. The dinner time and menus are irrelevant."
        feedback_nl: "Correct! H₀ (het eten is veilig) is onwaar, maar werd niet verworpen: een Type II-fout. Omdat gasten schade kunnen oplopen, is deze fout hier ernstig. Het tijdstip van het diner en de menu's zijn niet relevant."

  - id: 112
    tags: ["Tori"]
    source: "Tori Langill practice test, q12"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A lecturer helps a hotel develop a short questionnaire about guests' preferences for quiet rooms. The questionnaire has attractive photographs, takes five minutes to complete, and is offered in three languages. Before using it widely, the researcher wants to know whether the measurement produces consistent results under comparable conditions. Guests whose preferences are expected to remain stable complete the instrument twice, with no relevant change in their circumstances between the two occasions. The researcher compares their scores, focusing on stability rather than on whether the questions cover every aspect of the guest experience. Which measurement property is the researcher primarily investigating?"
    question_nl: "Een docent helpt een hotel een korte vragenlijst te ontwikkelen over de voorkeur van gasten voor rustige kamers. De vragenlijst heeft aantrekkelijke foto's, duurt vijf minuten en is beschikbaar in drie talen. Voordat de lijst breed wordt ingezet, wil de onderzoeker weten of de meting consistente resultaten geeft onder vergelijkbare omstandigheden. Gasten van wie de voorkeur naar verwachting stabiel blijft, vullen het instrument twee keer in, zonder relevante verandering in hun omstandigheden tussen de twee momenten. De onderzoeker vergelijkt hun scores en richt zich op stabiliteit, niet op de vraag of de items elk aspect van de gastervaring dekken. Welke meeteigenschap onderzoekt de onderzoeker in de eerste plaats?"
    answers:
      - text_en: "Coverage of every aspect of a concept"
        text_nl: "Dekking van alle aspecten van een begrip"
        correct: false
        feedback_en: "Incorrect. That is content validity, which the researcher explicitly is not focusing on."
        feedback_nl: "Onjuist. Dat is inhoudsvaliditeit, waar de onderzoeker zich uitdrukkelijk niet op richt."
      - text_en: "Selection of a representative sample"
        text_nl: "Selectie van een representatieve steekproef"
        correct: false
        feedback_en: "Incorrect. Representativeness concerns sampling, not the measurement properties of the questionnaire."
        feedback_nl: "Onjuist. Representativiteit gaat over de steekproef, niet over de meeteigenschappen van de vragenlijst."
      - text_en: "Proof that a treatment causes an effect"
        text_nl: "Bewijs dat een interventie een effect veroorzaakt"
        correct: false
        feedback_en: "Incorrect. Causality requires an experimental design; there is no treatment being tested here."
        feedback_nl: "Onjuist. Oorzakelijkheid vraagt een experimenteel design; hier wordt geen interventie getest."
      - text_en: "Consistency of measurements under comparable conditions"
        text_nl: "Consistentie van metingen onder vergelijkbare omstandigheden"
        correct: true
        feedback_en: "Correct! Consistent scores under comparable conditions = reliability (here test-retest). Photographs, length and languages do not establish reliability."
        feedback_nl: "Correct! Consistente scores onder vergelijkbare omstandigheden = betrouwbaarheid (hier test-hertest). Foto's, lengte en talen zeggen niets over de betrouwbaarheid."

  - id: 113
    tags: ["Tori"]
    source: "Tori Langill practice test, q13"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "What does a 95 percent confidence procedure mean?"
    question_nl: "Wat betekent een 95%-betrouwbaarheidsprocedure?"
    answers:
      - text_en: "95 percent of individual guests lie inside every interval"
        text_nl: "95% van de individuele gasten ligt binnen elk interval"
        correct: false
        feedback_en: "Incorrect. A confidence interval is about a population parameter (e.g. the mean), not about individual observations."
        feedback_nl: "Onjuist. Een betrouwbaarheidsinterval gaat over een populatieparameter (bijv. het gemiddelde), niet over individuele waarnemingen."
      - text_en: "The sample mean is correct 95 percent of the time"
        text_nl: "Het steekproefgemiddelde is in 95% van de gevallen juist"
        correct: false
        feedback_en: "Incorrect. The sample mean almost never equals the population mean exactly. The 95% refers to the interval procedure."
        feedback_nl: "Onjuist. Het steekproefgemiddelde is bijna nooit precies gelijk aan het populatiegemiddelde. De 95% slaat op de intervalprocedure."
      - text_en: "The parameter changes with probability 0.95"
        text_nl: "De parameter verandert met kans 0,95"
        correct: false
        feedback_en: "Incorrect. The population parameter is fixed; it is the intervals that vary from sample to sample."
        feedback_nl: "Onjuist. De populatieparameter ligt vast; het zijn de intervallen die van steekproef tot steekproef variëren."
      - text_en: "In repeated sampling, about 95 percent of intervals constructed this way contain the true parameter"
        text_nl: "Bij herhaalde steekproeven bevat ongeveer 95% van de op deze manier berekende intervallen de ware parameter"
        correct: true
        feedback_en: "Correct! The confidence level describes the long-run success rate of the procedure: about 95 of every 100 intervals capture the true parameter."
        feedback_nl: "Correct! Het betrouwbaarheidsniveau beschrijft het succespercentage van de procedure op lange termijn: ongeveer 95 van elke 100 intervallen bevatten de ware parameter."

  - id: 114
    tags: ["Tori"]
    source: "Tori Langill practice test, q14"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "A restaurant manager has collected the amount each guest spent at dinner, measured in euros. The spreadsheet also contains table numbers, booking channels, and the names of the servers. Before choosing any statistical test, the manager wants to see the distribution of spending: whether most bills are concentrated in a particular range, whether the distribution has a long upper tail, and whether unusually large bills occur. She is not yet asking whether spending is related to waiting time or whether mean spending differs between booking channels. Which graph best serves this purpose?"
    question_nl: "Een restaurantmanager heeft per gast het bedrag verzameld dat aan het diner is besteed, in euro's. Het spreadsheet bevat ook tafelnummers, boekingskanalen en de namen van de bediening. Voordat ze een toets kiest, wil de manager de verdeling van de bestedingen zien: of de meeste rekeningen in een bepaald bereik liggen, of de verdeling een lange staart naar boven heeft en of er uitzonderlijk hoge rekeningen voorkomen. Ze vraagt nog niet of de bestedingen samenhangen met de wachttijd of of de gemiddelde besteding verschilt tussen boekingskanalen. Welke grafiek past het best bij dit doel?"
    answers:
      - text_en: "Histogram"
        text_nl: "Histogram"
        correct: true
        feedback_en: "Correct! Spending is a numeric variable and the goal is to see its distribution (concentration, skewness, outliers). A histogram shows exactly that."
        feedback_nl: "Correct! Bestedingen zijn een numerieke variabele en het doel is de verdeling te zien (concentratie, scheefheid, uitschieters). Een histogram laat precies dat zien."
      - text_en: "Pie chart"
        text_nl: "Cirkeldiagram"
        correct: false
        feedback_en: "Incorrect. A pie chart shows shares of a whole for a few categories; it cannot show the shape of a numeric distribution."
        feedback_nl: "Onjuist. Een cirkeldiagram toont aandelen van een geheel voor enkele categorieën; het kan de vorm van een numerieke verdeling niet tonen."
      - text_en: "Scatterplot"
        text_nl: "Spreidingsdiagram"
        correct: false
        feedback_en: "Incorrect. A scatterplot shows the relationship between two numeric variables. The manager is not (yet) looking at a relationship."
        feedback_nl: "Onjuist. Een spreidingsdiagram toont het verband tussen twee numerieke variabelen. De manager kijkt (nog) niet naar een verband."
      - text_en: "Clustered bar chart"
        text_nl: "Geclusterd staafdiagram"
        correct: false
        feedback_en: "Incorrect. A clustered bar chart compares counts of categories across groups, not the distribution of one numeric variable."
        feedback_nl: "Onjuist. Een geclusterd staafdiagram vergelijkt aantallen per categorie tussen groepen, niet de verdeling van één numerieke variabele."

  - id: 115
    tags: ["Tori"]
    source: "Tori Langill practice test, q15"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "A researcher compares five group means using ten unadjusted t-tests. What is the main reasoning problem?"
    question_nl: "Een onderzoeker vergelijkt vijf groepsgemiddelden met tien ongecorrigeerde t-toetsen. Wat is het belangrijkste denkprobleem?"
    answers:
      - text_en: "Every individual test must have a false result"
        text_nl: "Elke afzonderlijke toets geeft een fout resultaat"
        correct: false
        feedback_en: "Incorrect. Each individual test is not necessarily wrong; the problem is the accumulated risk across all tests."
        feedback_nl: "Onjuist. Elke afzonderlijke toets is niet per se fout; het probleem is het opgestapelde risico over alle toetsen samen."
      - text_en: "The chance of at least one Type I error increases across the family"
        text_nl: "De kans op minstens één Type I-fout over alle toetsen samen neemt toe"
        correct: true
        feedback_en: "Correct! With ten tests at α = .05 each, the chance of at least one false positive is far above 5%. Use ANOVA followed by an adjusted post-hoc test."
        feedback_nl: "Correct! Met tien toetsen van elk α = .05 is de kans op minstens één vals-positief resultaat veel groter dan 5%. Gebruik een ANOVA met een gecorrigeerde post-hoctoets."
      - text_en: "The means become categorical variables"
        text_nl: "De gemiddelden worden categorische variabelen"
        correct: false
        feedback_en: "Incorrect. The measurement level of the outcome does not change because of the number of tests."
        feedback_nl: "Onjuist. Het meetniveau van de uitkomst verandert niet door het aantal toetsen."
      - text_en: "The sample size becomes five automatically"
        text_nl: "De steekproefgrootte wordt automatisch vijf"
        correct: false
        feedback_en: "Incorrect. Five is the number of groups, not the sample size."
        feedback_nl: "Onjuist. Vijf is het aantal groepen, niet de steekproefgrootte."

  - id: 116
    tags: ["Tori"]
    source: "Tori Langill practice test, q16"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A resort has recently redesigned its check-in area and wants feedback from the guests who stayed last season. The manager remembers several enthusiastic comments from families but worries that those comments say little about business travellers. The complete guest list records whether each visit was for business or leisure. Business guests account for 30 percent of the population and leisure guests for 70 percent. The researcher has enough resources to invite 200 guests and wants both groups included in those same proportions through random selection. The marketing team offers a convenient list of social media followers, but it does not record visit purpose. Which sampling plan best meets the researcher's goal?"
    question_nl: "Een resort heeft onlangs de incheckruimte vernieuwd en wil feedback van de gasten die vorig seizoen verbleven. De manager herinnert zich enkele enthousiaste reacties van gezinnen, maar vreest dat die weinig zeggen over zakenreizigers. De volledige gastenlijst vermeldt of elk verblijf zakelijk of recreatief was. Zakelijke gasten vormen 30% van de populatie en recreatieve gasten 70%. De onderzoeker kan 200 gasten uitnodigen en wil beide groepen in dezelfde verhouding opnemen, via aselecte selectie. Het marketingteam biedt een handige lijst van volgers op sociale media aan, maar die vermeldt het reisdoel niet. Welk steekproefplan past het best bij het doel van de onderzoeker?"
    answers:
      - text_en: "Sample one convenient hotel and assume it represents the chain"
        text_nl: "Eén handig gelegen hotel nemen en aannemen dat het de keten vertegenwoordigt"
        correct: false
        feedback_en: "Incorrect. That is a convenience choice without random selection, and it ignores the business/leisure split."
        feedback_nl: "Onjuist. Dat is een gemakskeuze zonder aselecte selectie, en het negeert de verdeling zakelijk/recreatief."
      - text_en: "Survey whoever is in the lobby until the target size is reached"
        text_nl: "Wie er in de lobby zit enquêteren tot het gewenste aantal bereikt is"
        correct: false
        feedback_en: "Incorrect. That is a convenience sample: not random, and the 30/70 split is not guaranteed."
        feedback_nl: "Onjuist. Dat is een gemakssteekproef: niet aselect, en de verhouding 30/70 is niet gegarandeerd."
      - text_en: "Use proportionate stratified random sampling"
        text_nl: "Een proportioneel gestratificeerde aselecte steekproef gebruiken"
        correct: true
        feedback_en: "Correct! The full list identifies two strata. Randomly select 60 business guests (30%) and 140 leisure guests (70%) within the strata: proportionate stratified random sampling."
        feedback_nl: "Correct! De volledige lijst onderscheidt twee strata. Trek aselect 60 zakelijke gasten (30%) en 140 recreatieve gasten (70%) binnen de strata: een proportioneel gestratificeerde aselecte steekproef."
      - text_en: "Select only the most frequent guests"
        text_nl: "Alleen de meest frequente gasten selecteren"
        correct: false
        feedback_en: "Incorrect. Selecting only frequent guests is not random and creates a biased sample."
        feedback_nl: "Onjuist. Alleen frequente gasten selecteren is niet aselect en geeft een vertekende steekproef."

  - id: 117
    tags: ["Tori"]
    source: "Tori Langill practice test, q17"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "A hotel researcher examines the linear relationship between employees' numeric pay-satisfaction scores and their recorded days of absence. The report also lists job roles, shift patterns, and the hotel's annual occupancy, but those details are not part of this correlation result. A suitable Pearson analysis gives r = .065 and p = .510. The significance level is α = .05. A manager notices that the coefficient is positive and argues that this automatically makes the relationship significant. Another manager thinks a large p-value indicates a strong relationship. Using the reported coefficient and p-value, which interpretation is correct?"
    question_nl: "Een hotelonderzoeker onderzoekt het lineaire verband tussen de numerieke scores voor tevredenheid over het salaris en het aantal geregistreerde verzuimdagen van medewerkers. Het rapport vermeldt ook functies, dienstroosters en de jaarlijkse bezettingsgraad van het hotel, maar die gegevens maken geen deel uit van dit correlatieresultaat. Een geschikte Pearson-analyse geeft r = .065 en p = .510. Het significantieniveau is α = .05. Een manager merkt op dat de coëfficiënt positief is en stelt dat het verband daardoor automatisch significant is. Een andere manager denkt dat een grote p-waarde op een sterk verband wijst. Welke interpretatie is juist op basis van de gerapporteerde coëfficiënt en p-waarde?"
    answers:
      - text_en: "The relationship is significant because r is positive"
        text_nl: "Het verband is significant omdat r positief is"
        correct: false
        feedback_en: "Incorrect. The sign of r only indicates direction. Significance is judged with the p-value, and p = .510 > .05."
        feedback_nl: "Onjuist. Het teken van r geeft alleen de richting aan. Significantie beoordeel je met de p-waarde, en p = .510 > .05."
      - text_en: "The observed linear association is weak and not statistically significant"
        text_nl: "Het waargenomen lineaire verband is zwak en niet statistisch significant"
        correct: true
        feedback_en: "Correct! r = .065 is close to zero (very weak) and p = .510 > .05, so the result is not significant."
        feedback_nl: "Correct! r = .065 ligt dicht bij nul (zeer zwak) en p = .510 > .05, dus het resultaat is niet significant."
      - text_en: "There is proof that no relationship can exist"
        text_nl: "Er is bewezen dat er geen verband kan bestaan"
        correct: false
        feedback_en: "Incorrect. A non-significant result does not prove that there is no relationship; there is simply insufficient evidence for one."
        feedback_nl: "Onjuist. Een niet-significant resultaat bewijst niet dat er geen verband is; er is alleen onvoldoende bewijs vóór een verband."
      - text_en: "The association is strong because p is large"
        text_nl: "Het verband is sterk omdat p groot is"
        correct: false
        feedback_en: "Incorrect. A large p-value means weak evidence against H₀, not a strong relationship. Strength is read from |r|."
        feedback_nl: "Onjuist. Een grote p-waarde betekent zwak bewijs tegen H₀, geen sterk verband. De sterkte lees je af aan |r|."

  - id: 118
    tags: ["Tori"]
    source: "Tori Langill practice test, q18"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A restaurant is evaluating a new menu that includes larger photographs and a different order of dishes. During a pilot, staff record each guest's total spending in euros, whether the guest ordered dessert, the table number, and the booking channel. The manager mentions that more guests appear to be ordering desserts, but the research question for this analysis concerns average total spending per guest in the population. The researcher will use the sample to estimate that average, rather than the proportion who ordered dessert. Which population parameter is relevant to this analysis?"
    question_nl: "Een restaurant evalueert een nieuwe menukaart met grotere foto's en een andere volgorde van gerechten. Tijdens een pilot noteert het personeel per gast de totale besteding in euro's, of de gast een dessert bestelde, het tafelnummer en het boekingskanaal. De manager merkt op dat meer gasten een dessert lijken te bestellen, maar de onderzoeksvraag van deze analyse gaat over de gemiddelde totale besteding per gast in de populatie. De onderzoeker gebruikt de steekproef om dat gemiddelde te schatten, niet de proportie gasten die een dessert bestelde. Welke populatieparameter is relevant voor deze analyse?"
    answers:
      - text_en: "μ, the population mean"
        text_nl: "μ, het populatiegemiddelde"
        correct: true
        feedback_en: "Correct! The outcome is average total spending in euros (numeric), so the parameter is the population mean μ."
        feedback_nl: "Correct! De uitkomst is de gemiddelde totale besteding in euro's (numeriek), dus de parameter is het populatiegemiddelde μ."
      - text_en: "π, the population proportion"
        text_nl: "π, de populatieproportie"
        correct: false
        feedback_en: "Incorrect. π would fit 'ordered dessert yes/no', but that is explicitly not the outcome of this analysis."
        feedback_nl: "Onjuist. π zou passen bij 'dessert besteld ja/nee', maar dat is uitdrukkelijk niet de uitkomst van deze analyse."
      - text_en: "p, the test p-value"
        text_nl: "p, de p-waarde van de toets"
        correct: false
        feedback_en: "Incorrect. The p-value is a result of a test, not a population parameter."
        feedback_nl: "Onjuist. De p-waarde is een uitkomst van een toets, geen populatieparameter."
      - text_en: "n, the sample size"
        text_nl: "n, de steekproefgrootte"
        correct: false
        feedback_en: "Incorrect. n describes the sample, not a characteristic of the population that you estimate."
        feedback_nl: "Onjuist. n beschrijft de steekproef, geen kenmerk van de populatie dat je schat."

  - id: 119
    tags: ["Tori"]
    source: "Tori Langill practice test, q19"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "A hotel wants to assess a training programme using numeric competence scores. The same 25 employees are measured before and after the programme, and their IDs allow the researcher to link each before score to the corresponding after score. The researcher also records department and years of experience, although these are not part of the current comparison. Inspection shows that the within-person score differences are roughly normally distributed and contain no extreme outliers. Management asks whether mean competence changed after training. One colleague proposes treating the 50 recorded scores as independent observations simply because they occupy separate spreadsheet rows. Which analysis best fits the actual study design?"
    question_nl: "Een hotel wil een trainingsprogramma evalueren met numerieke competentiescores. Dezelfde 25 medewerkers worden vóór en na het programma gemeten, en met hun ID's kan de onderzoeker elke voormeting koppelen aan de bijbehorende nameting. De onderzoeker registreert ook afdeling en aantal jaren ervaring, maar die maken geen deel uit van de huidige vergelijking. De verschilscores per persoon blijken ongeveer normaal verdeeld en bevatten geen extreme uitschieters. Het management vraagt of de gemiddelde competentie na de training veranderd is. Een collega stelt voor de 50 geregistreerde scores als onafhankelijke waarnemingen te behandelen, alleen omdat ze in aparte rijen van het spreadsheet staan. Welke analyse past het best bij het werkelijke onderzoeksdesign?"
    answers:
      - text_en: "A one-sample test on post-training scores ignoring baseline"
        text_nl: "Een one-sample toets op de scores na de training, zonder rekening te houden met de voormeting"
        correct: false
        feedback_en: "Incorrect. Ignoring the before scores throws away the pairing and does not answer whether competence changed."
        feedback_nl: "Onjuist. Door de voormeting te negeren gooi je de koppeling weg en beantwoord je niet of de competentie veranderd is."
      - text_en: "An independent-samples t-test treating 50 scores as unrelated"
        text_nl: "Een t-toets voor onafhankelijke steekproeven die de 50 scores als losstaand behandelt"
        correct: false
        feedback_en: "Incorrect. There are 25 pairs, not 50 independent people. Treating dependent scores as independent is wrong."
        feedback_nl: "Onjuist. Er zijn 25 paren, geen 50 onafhankelijke personen. Afhankelijke scores als onafhankelijk behandelen is fout."
      - text_en: "A chi-square test after coding each score as an ID"
        text_nl: "Een chi-kwadraattoets nadat elke score als ID is gecodeerd"
        correct: false
        feedback_en: "Incorrect. Chi-square is for categorical variables; competence scores are numeric and should not be recoded as IDs."
        feedback_nl: "Onjuist. Chi-kwadraat is voor categorische variabelen; competentiescores zijn numeriek en mag je niet als ID hercoderen."
      - text_en: "A paired-samples t-test on within-person differences"
        text_nl: "Een gepaarde t-toets op de verschilscores per persoon"
        correct: true
        feedback_en: "Correct! The same 25 employees are measured twice (25 pairs) and the differences meet the conditions, so a paired-samples t-test is appropriate."
        feedback_nl: "Correct! Dezelfde 25 medewerkers worden twee keer gemeten (25 paren) en de verschilscores voldoen aan de voorwaarden, dus een gepaarde t-toets is passend."

  - id: 120
    tags: ["Tori"]
    source: "Tori Langill practice test, q20"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "A hotel wants to understand whether booking channel is associated with guest type. Each independent guest is classified by channel as website, travel agency, or telephone, and by type as business or leisure. The researcher creates a table of the numbers of guests in each combination. Although the file also contains numeric room prices and spending totals, the current research question does not concern those means or their linear relationship. Instead, it asks whether the distribution of booking channels differs between the two guest types. Assuming the expected counts and other relevant conditions are suitable, which statistical test should be used?"
    question_nl: "Een hotel wil weten of het boekingskanaal samenhangt met het type gast. Elke (onafhankelijke) gast wordt ingedeeld naar kanaal (website, reisbureau of telefoon) en naar type (zakelijk of recreatief). De onderzoeker maakt een tabel met het aantal gasten per combinatie. Het bestand bevat ook numerieke kamerprijzen en totale bestedingen, maar de huidige onderzoeksvraag gaat niet over die gemiddelden of hun lineaire verband. De vraag is of de verdeling over de boekingskanalen verschilt tussen de twee typen gasten. Welke toets moet gebruikt worden, ervan uitgaande dat de verwachte aantallen en andere relevante voorwaarden in orde zijn?"
    answers:
      - text_en: "Paired-samples t-test"
        text_nl: "Gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. A paired t-test compares two related numeric measurements; here both variables are categorical."
        feedback_nl: "Onjuist. Een gepaarde t-toets vergelijkt twee samenhangende numerieke metingen; hier zijn beide variabelen categorisch."
      - text_en: "Chi-square test of independence"
        text_nl: "Chi-kwadraattoets op onafhankelijkheid"
        correct: true
        feedback_en: "Correct! Booking channel and guest type are both categorical, recorded as counts of independent guests in a crosstab: chi-square test of independence."
        feedback_nl: "Correct! Boekingskanaal en type gast zijn beide categorisch, geteld voor onafhankelijke gasten in een kruistabel: chi-kwadraattoets op onafhankelijkheid."
      - text_en: "One-sample t-test"
        text_nl: "One-sample t-toets"
        correct: false
        feedback_en: "Incorrect. A one-sample t-test compares one mean with a fixed value; there is no numeric mean here."
        feedback_nl: "Onjuist. Een one-sample t-toets vergelijkt één gemiddelde met een vaste waarde; hier is er geen numeriek gemiddelde."
      - text_en: "Pearson correlation"
        text_nl: "Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Pearson correlation requires two numeric variables; channel and guest type are categories."
        feedback_nl: "Onjuist. Pearson-correlatie vereist twee numerieke variabelen; kanaal en type gast zijn categorieën."

  - id: 121
    tags: ["Tori"]
    source: "Tori Langill practice test, q21"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "Why is H₀: μnew = μold with H₁: μnew > μold not collectively exhaustive?"
    question_nl: "Waarom is H₀: μnew = μold met H₁: μnew > μold niet collectief uitputtend?"
    answers:
      - text_en: "It includes the same possibility twice"
        text_nl: "Dezelfde mogelijkheid komt twee keer voor"
        correct: false
        feedback_en: "Incorrect. The two hypotheses do not overlap; the problem is that a possibility is missing, not duplicated."
        feedback_nl: "Onjuist. De twee hypothesen overlappen niet; het probleem is dat er een mogelijkheid ontbreekt, niet dat er een dubbel is."
      - text_en: "It uses the wrong parameter for spending"
        text_nl: "De parameter voor bestedingen is verkeerd"
        correct: false
        feedback_en: "Incorrect. μ is the right parameter for a numeric outcome such as spending; the parameter is not the issue."
        feedback_nl: "Onjuist. μ is de juiste parameter voor een numerieke uitkomst zoals bestedingen; de parameter is het probleem niet."
      - text_en: "It omits μnew < μold"
        text_nl: "μnew < μold ontbreekt"
        correct: true
        feedback_en: "Correct! Together, = and > do not cover the possibility 'less than'. A complete (MECE) directional pair is H₀: μnew ≤ μold vs H₁: μnew > μold."
        feedback_nl: "Correct! = en > samen dekken de mogelijkheid 'kleiner dan' niet. Een volledig (MECE) eenzijdig paar is H₀: μnew ≤ μold tegen H₁: μnew > μold."
      - text_en: "It gives H₀ too many possibilities"
        text_nl: "H₀ krijgt te veel mogelijkheden"
        correct: false
        feedback_en: "Incorrect. It is the opposite: H₀ covers too few possibilities, because 'less than' is missing."
        feedback_nl: "Onjuist. Het is juist andersom: H₀ dekt te weinig mogelijkheden, want 'kleiner dan' ontbreekt."

  - id: 122
    tags: ["Tori"]
    source: "Tori Langill practice test, q22"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "After a random start, a researcher selects every tenth guest on a list. Which method is used?"
    question_nl: "Na een willekeurig startpunt selecteert een onderzoeker elke tiende gast op een lijst. Welke methode wordt gebruikt?"
    answers:
      - text_en: "Convenience sampling"
        text_nl: "Gemakssteekproef"
        correct: false
        feedback_en: "Incorrect. Convenience sampling uses whoever is easy to reach, without a fixed selection rule."
        feedback_nl: "Onjuist. Een gemakssteekproef neemt wie makkelijk bereikbaar is, zonder vaste selectieregel."
      - text_en: "Snowball sampling"
        text_nl: "Sneeuwbalsteekproef"
        correct: false
        feedback_en: "Incorrect. In snowball sampling, respondents recruit other respondents. That does not happen here."
        feedback_nl: "Onjuist. Bij een sneeuwbalsteekproef werven respondenten andere respondenten. Dat gebeurt hier niet."
      - text_en: "Systematic sampling"
        text_nl: "Systematische steekproef"
        correct: true
        feedback_en: "Correct! A random start followed by a fixed interval (every 10th) is systematic sampling."
        feedback_nl: "Correct! Een willekeurig startpunt gevolgd door een vast interval (elke 10e) is een systematische steekproef."
      - text_en: "Simple random sampling"
        text_nl: "Enkelvoudige aselecte steekproef"
        correct: false
        feedback_en: "Incorrect. In simple random sampling each unit is drawn independently at random, not at a fixed interval."
        feedback_nl: "Onjuist. Bij een enkelvoudige aselecte steekproef wordt elke eenheid onafhankelijk aselect getrokken, niet met een vast interval."

  - id: 123
    tags: ["Tori"]
    source: "Tori Langill practice test, q23"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "Which information should be checked for the usual chi-square approximation?"
    question_nl: "Welke informatie moet je controleren voor de gebruikelijke chi-kwadraatbenadering?"
    answers:
      - text_en: "Whether the numeric means are equal"
        text_nl: "Of de numerieke gemiddelden gelijk zijn"
        correct: false
        feedback_en: "Incorrect. Chi-square works with counts of categories, not with means."
        feedback_nl: "Onjuist. Chi-kwadraat werkt met aantallen per categorie, niet met gemiddelden."
      - text_en: "Whether Pearson r exceeds .50"
        text_nl: "Of Pearsons r groter is dan .50"
        correct: false
        feedback_en: "Incorrect. Pearson r plays no role in the conditions of a chi-square test."
        feedback_nl: "Onjuist. Pearsons r speelt geen rol bij de voorwaarden van een chi-kwadraattoets."
      - text_en: "Only whether observed counts exceed 5"
        text_nl: "Alleen of de geobserveerde aantallen groter zijn dan 5"
        correct: false
        feedback_en: "Incorrect. The rule of thumb concerns the expected counts, not the observed ones, and independence must also be checked."
        feedback_nl: "Onjuist. De vuistregel gaat over de verwachte aantallen, niet over de geobserveerde, en ook de onafhankelijkheid moet gecontroleerd worden."
      - text_en: "Expected cell counts and independent observations"
        text_nl: "De verwachte celfrequenties en onafhankelijke waarnemingen"
        correct: true
        feedback_en: "Correct! Small expected counts (rule of thumb: < 5) and dependent observations can make the usual chi-square test unreliable."
        feedback_nl: "Correct! Kleine verwachte aantallen (vuistregel: < 5) en afhankelijke waarnemingen kunnen de gebruikelijke chi-kwadraattoets onbetrouwbaar maken."

  - id: 124
    tags: ["Tori"]
    source: "Tori Langill practice test, q24"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A researcher checks whether a scale reflects guest satisfaction rather than mainly room price. Which type of validity is the focus?"
    question_nl: "Een onderzoeker controleert of een schaal gastentevredenheid weerspiegelt en niet vooral de kamerprijs. Op welk type validiteit ligt de nadruk?"
    answers:
      - text_en: "Test-retest reliability"
        text_nl: "Test-hertestbetrouwbaarheid"
        correct: false
        feedback_en: "Incorrect. Test-retest reliability concerns stability over time, not whether the right concept is measured."
        feedback_nl: "Onjuist. Test-hertestbetrouwbaarheid gaat over stabiliteit in de tijd, niet over de vraag of het juiste begrip gemeten wordt."
      - text_en: "Sampling reliability"
        text_nl: "Steekproefbetrouwbaarheid"
        correct: false
        feedback_en: "Incorrect. This is not a standard type of validity; sampling is about selecting respondents."
        feedback_nl: "Onjuist. Dit is geen standaardvorm van validiteit; een steekproef gaat over het selecteren van respondenten."
      - text_en: "Construct validity"
        text_nl: "Constructvaliditeit"
        correct: true
        feedback_en: "Correct! Construct validity concerns whether scores represent the intended concept (satisfaction) and not something else (price)."
        feedback_nl: "Correct! Constructvaliditeit gaat over de vraag of de scores het bedoelde begrip (tevredenheid) weergeven en niet iets anders (prijs)."
      - text_en: "Cluster validity"
        text_nl: "Clustervaliditeit"
        correct: false
        feedback_en: "Incorrect. This is not a type of validity; 'cluster' refers to a sampling method."
        feedback_nl: "Onjuist. Dit is geen vorm van validiteit; 'cluster' verwijst naar een steekproefmethode."

  - id: 125
    tags: ["Tori"]
    source: "Tori Langill practice test, q25"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "A manager asks for a graph of monthly occupancy percentage over two years. Which is most appropriate?"
    question_nl: "Een manager vraagt om een grafiek van de maandelijkse bezettingsgraad (%) over twee jaar. Welke is het meest geschikt?"
    answers:
      - text_en: "A line graph ordered by month"
        text_nl: "Een lijndiagram, geordend per maand"
        correct: true
        feedback_en: "Correct! A line graph over time (months in order) makes trends and seasonal patterns visible."
        feedback_nl: "Correct! Een lijndiagram in de tijd (maanden op volgorde) maakt trends en seizoenspatronen zichtbaar."
      - text_en: "A pie chart with all months as unrelated slices"
        text_nl: "Een cirkeldiagram met alle maanden als losse taartpunten"
        correct: false
        feedback_en: "Incorrect. A pie chart shows parts of a whole and loses the time order. Occupancy percentages do not add up to a meaningful whole."
        feedback_nl: "Onjuist. Een cirkeldiagram toont delen van een geheel en verliest de tijdsvolgorde. Bezettingspercentages tellen niet op tot een zinvol geheel."
      - text_en: "A histogram of month names"
        text_nl: "Een histogram van maandnamen"
        correct: false
        feedback_en: "Incorrect. A histogram shows the distribution of one numeric variable; month names are not a numeric variable whose frequencies you want to see."
        feedback_nl: "Onjuist. Een histogram toont de verdeling van één numerieke variabele; maandnamen zijn geen numerieke variabele waarvan je de frequenties wilt zien."
      - text_en: "A scatterplot of arbitrary room ID codes"
        text_nl: "Een spreidingsdiagram van willekeurige kamer-ID's"
        correct: false
        feedback_en: "Incorrect. Room ID codes have no meaningful numeric value and have nothing to do with occupancy over time."
        feedback_nl: "Onjuist. Kamer-ID's hebben geen betekenisvolle numerieke waarde en hebben niets te maken met de bezetting in de tijd."

  - id: 126
    tags: ["Tori"]
    source: "Tori Langill practice test, q26"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "What is a Type I error?"
    question_nl: "Wat is een Type I-fout?"
    answers:
      - text_en: "Rejecting a true null hypothesis"
        text_nl: "Een ware nulhypothese verwerpen"
        correct: true
        feedback_en: "Correct! A Type I error is a false positive: you reject H₀ although it is true. Its probability is α."
        feedback_nl: "Correct! Een Type I-fout is een vals-positief resultaat: je verwerpt H₀ terwijl die waar is. De kans daarop is α."
      - text_en: "Failing to reject a false null hypothesis"
        text_nl: "Een onware nulhypothese niet verwerpen"
        correct: false
        feedback_en: "Incorrect. That is a Type II error (a false negative)."
        feedback_nl: "Onjuist. Dat is een Type II-fout (een vals-negatief resultaat)."
      - text_en: "Rejecting a false null hypothesis"
        text_nl: "Een onware nulhypothese verwerpen"
        correct: false
        feedback_en: "Incorrect. Rejecting a false H₀ is a correct decision, not an error."
        feedback_nl: "Onjuist. Een onware H₀ verwerpen is een juiste beslissing, geen fout."
      - text_en: "Failing to reject a true null hypothesis"
        text_nl: "Een ware nulhypothese niet verwerpen"
        correct: false
        feedback_en: "Incorrect. Retaining a true H₀ is a correct decision, not an error."
        feedback_nl: "Onjuist. Een ware H₀ niet verwerpen is een juiste beslissing, geen fout."

  - id: 127
    tags: ["Tori"]
    source: "Tori Langill practice test, q27"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "What does a negative correlation indicate?"
    question_nl: "Wat betekent een negatieve correlatie?"
    answers:
      - text_en: "Both variables always increase together"
        text_nl: "Beide variabelen stijgen altijd samen"
        correct: false
        feedback_en: "Incorrect. Increasing together describes a positive correlation, and 'always' is too strong for any correlation."
        feedback_nl: "Onjuist. Samen stijgen beschrijft een positieve correlatie, en 'altijd' is te sterk voor welke correlatie dan ook."
      - text_en: "There is no linear relationship"
        text_nl: "Er is geen lineair verband"
        correct: false
        feedback_en: "Incorrect. No linear relationship corresponds to r ≈ 0. A negative r does indicate a (negative) linear relationship."
        feedback_nl: "Onjuist. Geen lineair verband hoort bij r ≈ 0. Een negatieve r wijst juist op een (negatief) lineair verband."
      - text_en: "Both variables must be negative"
        text_nl: "Beide variabelen moeten negatief zijn"
        correct: false
        feedback_en: "Incorrect. The sign of r says nothing about the values of the variables themselves, only about the direction of the relationship."
        feedback_nl: "Onjuist. Het teken van r zegt niets over de waarden van de variabelen zelf, alleen over de richting van het verband."
      - text_en: "Higher values of one variable tend to accompany lower values of the other"
        text_nl: "Hogere waarden van de ene variabele gaan meestal samen met lagere waarden van de andere"
        correct: true
        feedback_en: "Correct! A negative sign means the variables tend to move in opposite directions: as one goes up, the other tends to go down."
        feedback_nl: "Correct! Een negatief teken betekent dat de variabelen meestal in tegengestelde richting bewegen: als de ene stijgt, daalt de andere meestal."

  - id: 128
    tags: ["Tori"]
    source: "Tori Langill practice test, q28"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "Two independent groups have unequal variances. With suitable numeric data and other conditions met, which test is appropriate?"
    question_nl: "Twee onafhankelijke groepen hebben ongelijke varianties. Welke toets is passend, uitgaande van geschikte numerieke data en dat aan de andere voorwaarden is voldaan?"
    answers:
      - text_en: "Welch's independent-samples t-test"
        text_nl: "De t-toets van Welch voor onafhankelijke steekproeven"
        correct: true
        feedback_en: "Correct! Welch's t-test compares two independent means without assuming equal variances."
        feedback_nl: "Correct! De t-toets van Welch vergelijkt twee onafhankelijke gemiddelden zonder gelijke varianties te veronderstellen."
      - text_en: "Paired-samples t-test"
        text_nl: "Gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. A paired t-test is for related measurements (same people twice), not for two independent groups."
        feedback_nl: "Onjuist. Een gepaarde t-toets is voor samenhangende metingen (dezelfde mensen twee keer), niet voor twee onafhankelijke groepen."
      - text_en: "Chi-square test of independence"
        text_nl: "Chi-kwadraattoets op onafhankelijkheid"
        correct: false
        feedback_en: "Incorrect. Chi-square is for two categorical variables, not for comparing numeric means."
        feedback_nl: "Onjuist. Chi-kwadraat is voor twee categorische variabelen, niet voor het vergelijken van numerieke gemiddelden."
      - text_en: "Pearson correlation"
        text_nl: "Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Pearson correlation measures the association between two numeric variables; it does not compare group means."
        feedback_nl: "Onjuist. Pearson-correlatie meet het verband tussen twee numerieke variabelen; ze vergelijkt geen groepsgemiddelden."

  - id: 129
    tags: ["Tori"]
    source: "Tori Langill practice test, q29"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Adjusted pairwise p-values are A–B = .20, A–C = .01, and B–C = .08. At α = .05, which pair differs significantly?"
    question_nl: "De gecorrigeerde paarsgewijze p-waarden zijn A–B = .20, A–C = .01 en B–C = .08. Welk paar verschilt significant bij α = .05?"
    answers:
      - text_en: "A and C only"
        text_nl: "Alleen A en C"
        correct: true
        feedback_en: "Correct! Only A–C has an adjusted p-value below .05 (.01). A–B (.20) and B–C (.08) are not significant."
        feedback_nl: "Correct! Alleen A–C heeft een gecorrigeerde p-waarde onder .05 (.01). A–B (.20) en B–C (.08) zijn niet significant."
      - text_en: "All three pairs"
        text_nl: "Alle drie de paren"
        correct: false
        feedback_en: "Incorrect. A–B (.20) and B–C (.08) are both above .05, so not all pairs differ."
        feedback_nl: "Onjuist. A–B (.20) en B–C (.08) liggen allebei boven .05, dus niet alle paren verschillen."
      - text_en: "A and B only"
        text_nl: "Alleen A en B"
        correct: false
        feedback_en: "Incorrect. p = .20 for A–B is well above .05: not significant."
        feedback_nl: "Onjuist. p = .20 voor A–B ligt ruim boven .05: niet significant."
      - text_en: "B and C only"
        text_nl: "Alleen B en C"
        correct: false
        feedback_en: "Incorrect. p = .08 for B–C is above .05: not significant."
        feedback_nl: "Onjuist. p = .08 voor B–C ligt boven .05: niet significant."

  - id: 130
    tags: ["Tori"]
    source: "Tori Langill practice test, q30"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "Holding variability and confidence level constant, what usually happens when sample size increases?"
    question_nl: "Wat gebeurt er meestal als de steekproefgrootte toeneemt, terwijl de spreiding en het betrouwbaarheidsniveau gelijk blijven?"
    answers:
      - text_en: "The population mean must increase"
        text_nl: "Het populatiegemiddelde moet stijgen"
        correct: false
        feedback_en: "Incorrect. The population mean is fixed; it does not depend on how many people you sample."
        feedback_nl: "Onjuist. Het populatiegemiddelde ligt vast; het hangt niet af van hoeveel mensen je in de steekproef opneemt."
      - text_en: "The confidence interval becomes wider"
        text_nl: "Het betrouwbaarheidsinterval wordt breder"
        correct: false
        feedback_en: "Incorrect. The opposite: more observations make the estimate more precise, so the interval becomes narrower."
        feedback_nl: "Onjuist. Het omgekeerde: meer waarnemingen maken de schatting nauwkeuriger, dus het interval wordt smaller."
      - text_en: "The confidence level falls automatically"
        text_nl: "Het betrouwbaarheidsniveau daalt automatisch"
        correct: false
        feedback_en: "Incorrect. The confidence level is chosen by the researcher (e.g. 95%) and is held constant here."
        feedback_nl: "Onjuist. Het betrouwbaarheidsniveau kiest de onderzoeker zelf (bijv. 95%) en blijft hier gelijk."
      - text_en: "The confidence interval becomes narrower"
        text_nl: "Het betrouwbaarheidsinterval wordt smaller"
        correct: true
        feedback_en: "Correct! A larger n reduces the standard error (s/√n), so the margin of error shrinks and the interval becomes narrower."
        feedback_nl: "Correct! Een grotere n verkleint de standaardfout (s/√n), waardoor de foutmarge kleiner en het interval smaller wordt."

  - id: 131
    tags: ["Tori"]
    source: "Tori Langill practice test, q31"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A hotel installs self-service kiosks to speed up check-in. The lobby has also been redecorated, and guests can still ask a staff member for help. The researcher records check-in time in minutes and distinguishes between guests who use a kiosk and guests who use the staffed desk. Management's claim is specifically that the kiosks reduce the population mean check-in time, rather than merely change it in either direction. The researcher wants hypotheses that do not overlap and together cover all possible relationships between the two population means. Which pair of hypotheses matches the stated claim?"
    question_nl: "Een hotel plaatst selfservicezuilen om het inchecken te versnellen. De lobby is ook opnieuw ingericht, en gasten kunnen nog steeds een medewerker om hulp vragen. De onderzoeker registreert de incheckduur in minuten en maakt onderscheid tussen gasten die een zuil gebruiken en gasten die aan de bemande balie inchecken. De bewering van het management is specifiek dat de zuilen de gemiddelde incheckduur in de populatie verkorten, niet alleen dat die in een of andere richting verandert. De onderzoeker wil hypothesen die niet overlappen en samen alle mogelijke verhoudingen tussen de twee populatiegemiddelden dekken. Welk paar hypothesen past bij deze bewering?"
    answers:
      - text_en: "H₀: πkiosk = πstaff; H₁: πkiosk ≠ πstaff"
        text_nl: "H₀: πkiosk = πstaff; H₁: πkiosk ≠ πstaff"
        correct: false
        feedback_en: "Incorrect. Check-in time in minutes is numeric, so μ applies, not π. In addition, this pair is two-sided while the claim is directional."
        feedback_nl: "Onjuist. Incheckduur in minuten is numeriek, dus gebruik je μ, niet π. Bovendien is dit paar tweezijdig, terwijl de bewering eenzijdig is."
      - text_en: "H₀: μkiosk > μstaff; H₁: μkiosk > μstaff"
        text_nl: "H₀: μkiosk > μstaff; H₁: μkiosk > μstaff"
        correct: false
        feedback_en: "Incorrect. H₀ and H₁ are identical, so they overlap completely and are not MECE."
        feedback_nl: "Onjuist. H₀ en H₁ zijn identiek; ze overlappen dus volledig en zijn niet MECE."
      - text_en: "H₀: μkiosk ≥ μstaff; H₁: μkiosk < μstaff"
        text_nl: "H₀: μkiosk ≥ μstaff; H₁: μkiosk < μstaff"
        correct: true
        feedback_en: "Correct! The claim (a shorter mean time) goes in H₁: μkiosk < μstaff. Its MECE complement is H₀: μkiosk ≥ μstaff. The redecorated lobby is irrelevant."
        feedback_nl: "Correct! De bewering (gemiddeld kortere tijd) komt in H₁: μkiosk < μstaff. Het MECE-complement is H₀: μkiosk ≥ μstaff. De vernieuwde lobby is niet relevant."
      - text_en: "H₀: μkiosk < μstaff; H₁: μkiosk ≥ μstaff"
        text_nl: "H₀: μkiosk < μstaff; H₁: μkiosk ≥ μstaff"
        correct: false
        feedback_en: "Incorrect. This pair is MECE but reversed: the claim belongs in H₁, and H₀ always contains the equals sign."
        feedback_nl: "Onjuist. Dit paar is MECE maar omgedraaid: de bewering hoort in H₁, en H₀ bevat altijd het gelijkheidsteken."

  - id: 132
    tags: ["Tori"]
    source: "Tori Langill practice test, q32"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A restaurant studies the population mean amount guests spend on lunch. The manager also has information about the most frequently ordered dishes, average table size, and the number of weekday bookings, but these figures are not needed for the current calculation. The researcher reports a symmetric confidence interval for mean lunch spending with a lower bound of €42 and an upper bound of €50. The manager wants to rewrite the result in the form of a point estimate plus or minus a margin of error. Which pair correctly gives the midpoint and the margin of error?"
    question_nl: "Een restaurant onderzoekt het gemiddelde bedrag dat gasten in de populatie aan de lunch besteden. De manager heeft ook informatie over de meest bestelde gerechten, de gemiddelde tafelgrootte en het aantal boekingen op weekdagen, maar die cijfers zijn niet nodig voor deze berekening. De onderzoeker rapporteert een symmetrisch betrouwbaarheidsinterval voor de gemiddelde lunchbesteding met een ondergrens van €42 en een bovengrens van €50. De manager wil het resultaat herschrijven als puntschatting plus of min een foutmarge. Welk paar geeft het midden en de foutmarge correct weer?"
    answers:
      - text_en: "46 and 8"
        text_nl: "46 en 8"
        correct: false
        feedback_en: "Incorrect. 46 is the correct midpoint, but 8 is the full width of the interval. The margin of error is half of that: 4."
        feedback_nl: "Onjuist. 46 is het juiste midden, maar 8 is de volledige breedte van het interval. De foutmarge is de helft daarvan: 4."
      - text_en: "42 and 8"
        text_nl: "42 en 8"
        correct: false
        feedback_en: "Incorrect. 42 is the lower bound, not the midpoint, and 8 is the full width rather than the margin of error."
        feedback_nl: "Onjuist. 42 is de ondergrens, niet het midden, en 8 is de volledige breedte in plaats van de foutmarge."
      - text_en: "46 and 4"
        text_nl: "46 en 4"
        correct: true
        feedback_en: "Correct! Midpoint = (42 + 50)/2 = €46; margin of error = (50 − 42)/2 = €4. So €46 ± €4. The dish and booking figures are not needed."
        feedback_nl: "Correct! Midden = (42 + 50)/2 = €46; foutmarge = (50 − 42)/2 = €4. Dus €46 ± €4. De gegevens over gerechten en boekingen zijn niet nodig."
      - text_en: "50 and 4"
        text_nl: "50 en 4"
        correct: false
        feedback_en: "Incorrect. 4 is the correct margin of error, but 50 is the upper bound, not the midpoint."
        feedback_nl: "Onjuist. 4 is de juiste foutmarge, maar 50 is de bovengrens, niet het midden."

  - id: 133
    tags: ["Tori"]
    source: "Tori Langill practice test, q33"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A hotel chain wants to compare overall guest satisfaction across its properties. Its questionnaire has been used for several years, and guests with stable experiences tend to give very similar scores when they complete it twice. The survey is inexpensive, and managers like its colourful online design. On closer inspection, however, every question asks about pillow softness. It contains no questions about staff service, food, cleanliness, or check-in, even though the chain considers these important parts of overall satisfaction. The scores are consistent, but management intends to treat them as a complete measure of satisfaction. What is the strongest concern about that interpretation?"
    question_nl: "Een hotelketen wil de algemene gastentevredenheid tussen haar vestigingen vergelijken. De vragenlijst wordt al enkele jaren gebruikt, en gasten met een stabiele ervaring geven zeer vergelijkbare scores als ze hem twee keer invullen. De enquête is goedkoop en managers vinden het kleurrijke online ontwerp mooi. Bij nader inzien gaat echter elke vraag over de zachtheid van het kussen. Er staan geen vragen in over service van het personeel, eten, netheid of inchecken, hoewel de keten die als belangrijke onderdelen van de algemene tevredenheid beschouwt. De scores zijn consistent, maar het management wil ze gebruiken als volledige maat voor tevredenheid. Wat is het belangrijkste bezwaar tegen die interpretatie?"
    answers:
      - text_en: "It cannot be used in any histogram"
        text_nl: "De scores kunnen in geen enkel histogram gebruikt worden"
        correct: false
        feedback_en: "Incorrect. Numeric scores can perfectly well be shown in a histogram; that is not the problem."
        feedback_nl: "Onjuist. Numerieke scores kun je prima in een histogram weergeven; dat is het probleem niet."
      - text_en: "Its reliability guarantees complete satisfaction coverage"
        text_nl: "De betrouwbaarheid garandeert dat tevredenheid volledig gedekt wordt"
        correct: false
        feedback_en: "Incorrect. Reliability (consistency) says nothing about which aspects are covered. A reliable instrument can still miss important domains."
        feedback_nl: "Onjuist. Betrouwbaarheid (consistentie) zegt niets over welke aspecten gedekt worden. Een betrouwbaar instrument kan nog steeds belangrijke domeinen missen."
      - text_en: "It may have poor content validity despite consistent scores"
        text_nl: "De inhoudsvaliditeit kan zwak zijn, ondanks consistente scores"
        correct: true
        feedback_en: "Correct! The scale is reliable but only covers pillow softness; service, food, cleanliness and check-in are missing. Reliability does not solve this content-validity problem."
        feedback_nl: "Correct! De schaal is betrouwbaar maar dekt alleen de zachtheid van het kussen; service, eten, netheid en inchecken ontbreken. Betrouwbaarheid lost dit probleem van inhoudsvaliditeit niet op."
      - text_en: "It must produce a Type I error"
        text_nl: "Hij leidt per se tot een Type I-fout"
        correct: false
        feedback_en: "Incorrect. A Type I error is a decision error in hypothesis testing, not a property of a questionnaire."
        feedback_nl: "Onjuist. Een Type I-fout is een beslissingsfout bij het toetsen van hypothesen, geen eigenschap van een vragenlijst."

  - id: 134
    tags: ["Tori"]
    source: "Tori Langill practice test, q34"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "A hotel studies the association between booking channel and cancellation status using a contingency table of independent bookings. A software report gives p = .01 for the usual chi-square test. The report also includes monthly revenue and average length of stay, which are not part of this categorical comparison. When checking the table, the researcher finds several cells with very small expected counts. Management wants to declare an association immediately because the p-value is below .05, but the researcher is concerned that the usual approximation may be unreliable for this sparse table. What is the best next step before relying on the reported p-value?"
    question_nl: "Een hotel onderzoekt het verband tussen boekingskanaal en annuleringsstatus met een kruistabel van onafhankelijke boekingen. De software geeft p = .01 voor de gebruikelijke chi-kwadraattoets. Het rapport bevat ook de maandomzet en de gemiddelde verblijfsduur, maar die maken geen deel uit van deze categorische vergelijking. Bij controle van de tabel ziet de onderzoeker dat verschillende cellen zeer kleine verwachte aantallen hebben. Het management wil meteen een verband aankondigen omdat de p-waarde onder .05 ligt, maar de onderzoeker vreest dat de gebruikelijke benadering voor deze dunbezette tabel onbetrouwbaar is. Wat is de beste volgende stap voordat je op de gerapporteerde p-waarde vertrouwt?"
    answers:
      - text_en: "Declare the result valid because .01 is below .05"
        text_nl: "Het resultaat geldig verklaren omdat .01 onder .05 ligt"
        correct: false
        feedback_en: "Incorrect. A p-value is only trustworthy if the test's conditions are met. With very small expected counts, the usual approximation may be wrong."
        feedback_nl: "Onjuist. Een p-waarde is alleen betrouwbaar als aan de voorwaarden van de toets is voldaan. Bij zeer kleine verwachte aantallen kan de gebruikelijke benadering fout zijn."
      - text_en: "Assess an appropriate exact or simulation-based approach before relying on the usual p-value"
        text_nl: "Een geschikte exacte of op simulatie gebaseerde methode beoordelen voordat je op de gebruikelijke p-waarde vertrouwt"
        correct: true
        feedback_en: "Correct! Small expected counts undermine the chi-square approximation. An exact test (e.g. Fisher's) or a simulation-based p-value is the right check, even though p = .01."
        feedback_nl: "Correct! Kleine verwachte aantallen ondermijnen de chi-kwadraatbenadering. Een exacte toets (bijv. Fisher) of een via simulatie berekende p-waarde is de juiste controle, ook al is p = .01."
      - text_en: "Use a paired t-test on the category names"
        text_nl: "Een gepaarde t-toets uitvoeren op de categorienamen"
        correct: false
        feedback_en: "Incorrect. A t-test needs numeric outcomes; category names are not numbers and the data are not paired."
        feedback_nl: "Onjuist. Een t-toets vereist numerieke uitkomsten; categorienamen zijn geen getallen en de data zijn niet gepaard."
      - text_en: "Conclude that booking channel causes cancellation"
        text_nl: "Concluderen dat het boekingskanaal annuleringen veroorzaakt"
        correct: false
        feedback_en: "Incorrect. Even a valid chi-square test only shows association, never causation."
        feedback_nl: "Onjuist. Zelfs een geldige chi-kwadraattoets toont alleen een verband aan, nooit oorzakelijkheid."

  - id: 135
    tags: ["Tori"]
    source: "Tori Langill practice test, q35"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Which labels make a scatterplot of spending and waiting time interpretable?"
    question_nl: "Welke labels maken een spreidingsdiagram van bestedingen en wachttijd interpreteerbaar?"
    answers:
      - text_en: "Only the sample size"
        text_nl: "Alleen de steekproefgrootte"
        correct: false
        feedback_en: "Incorrect. The sample size alone does not tell the reader which variable is on which axis or in what units."
        feedback_nl: "Onjuist. De steekproefgrootte alleen vertelt de lezer niet welke variabele op welke as staat en in welke eenheid."
      - text_en: "Variable names and units on both axes"
        text_nl: "Variabelenamen en eenheden op beide assen"
        correct: true
        feedback_en: "Correct! Axis labels with variable names and units (e.g. 'Waiting time (min)', 'Spending (€)') identify the variables and their scales."
        feedback_nl: "Correct! Aslabels met variabelenaam en eenheid (bijv. 'Wachttijd (min)', 'Besteding (€)') maken duidelijk welke variabelen het zijn en op welke schaal."
      - text_en: "Only the p-value"
        text_nl: "Alleen de p-waarde"
        correct: false
        feedback_en: "Incorrect. A p-value is a test result; it does not explain what the graph shows."
        feedback_nl: "Onjuist. Een p-waarde is een toetsresultaat; ze legt niet uit wat de grafiek toont."
      - text_en: "Only a legend, with no axis labels"
        text_nl: "Alleen een legenda, zonder aslabels"
        correct: false
        feedback_en: "Incorrect. Without axis labels the reader does not know which variable is plotted where."
        feedback_nl: "Onjuist. Zonder aslabels weet de lezer niet welke variabele waar is uitgezet."

  - id: 136
    tags: ["Tori"]
    source: "Tori Langill practice test, q36"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "What does r = 0 indicate?"
    question_nl: "Wat betekent r = 0?"
    answers:
      - text_en: "Proof of independence"
        text_nl: "Bewijs van onafhankelijkheid"
        correct: false
        feedback_en: "Incorrect. r = 0 only rules out a linear relationship; a curved relationship can still exist, so it does not prove independence."
        feedback_nl: "Onjuist. r = 0 sluit alleen een lineair verband uit; een gebogen verband kan nog steeds bestaan, dus het bewijst geen onafhankelijkheid."
      - text_en: "No possible association of any kind"
        text_nl: "Geen enkel verband van welke aard dan ook"
        correct: false
        feedback_en: "Incorrect. Pearson r only measures linear association. A U-shaped relationship, for example, can give r = 0."
        feedback_nl: "Onjuist. Pearsons r meet alleen een lineair verband. Een U-vormig verband kan bijvoorbeeld r = 0 opleveren."
      - text_en: "No linear association"
        text_nl: "Geen lineair verband"
        correct: true
        feedback_en: "Correct! r = 0 means there is no linear association; a non-linear relationship may still be present."
        feedback_nl: "Correct! r = 0 betekent dat er geen lineair verband is; een niet-lineair verband kan nog wel aanwezig zijn."
      - text_en: "Perfect negative association"
        text_nl: "Perfect negatief verband"
        correct: false
        feedback_en: "Incorrect. A perfect negative association is r = −1, not r = 0."
        feedback_nl: "Onjuist. Een perfect negatief verband is r = −1, niet r = 0."

  - id: 137
    tags: ["Tori"]
    source: "Tori Langill practice test, q37"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "What is a Type II error?"
    question_nl: "Wat is een Type II-fout?"
    answers:
      - text_en: "Failing to reject a false null hypothesis"
        text_nl: "Een onware nulhypothese niet verwerpen"
        correct: true
        feedback_en: "Correct! A Type II error is a false negative: there is a real effect (H₀ is false), but the test misses it. Its probability is β."
        feedback_nl: "Correct! Een Type II-fout is een vals-negatief resultaat: er is een echt effect (H₀ is onwaar), maar de toets mist het. De kans daarop is β."
      - text_en: "Rejecting a false null hypothesis"
        text_nl: "Een onware nulhypothese verwerpen"
        correct: false
        feedback_en: "Incorrect. Rejecting a false H₀ is a correct decision."
        feedback_nl: "Onjuist. Een onware H₀ verwerpen is een juiste beslissing."
      - text_en: "Failing to reject a true null hypothesis"
        text_nl: "Een ware nulhypothese niet verwerpen"
        correct: false
        feedback_en: "Incorrect. Retaining a true H₀ is a correct decision."
        feedback_nl: "Onjuist. Een ware H₀ niet verwerpen is een juiste beslissing."
      - text_en: "Rejecting a true null hypothesis"
        text_nl: "Een ware nulhypothese verwerpen"
        correct: false
        feedback_en: "Incorrect. That is a Type I error (a false positive)."
        feedback_nl: "Onjuist. Dat is een Type I-fout (een vals-positief resultaat)."

  - id: 138
    tags: ["Tori"]
    source: "Tori Langill practice test, q38"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "A hotel provides customer-service training to its employees. Every participating employee completes the same numeric assessment shortly before the training and again shortly after it. The researcher records employee IDs so that each person's two scores can be linked. Department names, years of employment, and preferred shifts are also in the file, but the current analysis does not compare departments or shifts. The question is whether the population mean score changes from before to after training. The two sets of scores come from the same people, rather than from two unrelated groups of employees. Assuming the relevant conditions are met, which test is appropriate?"
    question_nl: "Een hotel geeft zijn medewerkers een training klantgerichtheid. Elke deelnemende medewerker maakt kort vóór en kort na de training dezelfde numerieke toets. De onderzoeker registreert de personeelsnummers, zodat de twee scores van elke persoon gekoppeld kunnen worden. Afdelingen, aantal dienstjaren en voorkeursdiensten staan ook in het bestand, maar de huidige analyse vergelijkt geen afdelingen of diensten. De vraag is of de gemiddelde score in de populatie verandert van vóór naar na de training. De twee reeksen scores komen van dezelfde mensen, niet van twee losse groepen medewerkers. Welke toets is passend, ervan uitgaande dat aan de relevante voorwaarden is voldaan?"
    answers:
      - text_en: "One-way ANOVA for unrelated groups"
        text_nl: "Eenweg-ANOVA voor onafhankelijke groepen"
        correct: false
        feedback_en: "Incorrect. ANOVA for unrelated groups assumes independent groups (usually three or more); here the same people are measured twice."
        feedback_nl: "Onjuist. Een ANOVA voor onafhankelijke groepen veronderstelt losse groepen (meestal drie of meer); hier worden dezelfde mensen twee keer gemeten."
      - text_en: "Chi-square test of independence"
        text_nl: "Chi-kwadraattoets op onafhankelijkheid"
        correct: false
        feedback_en: "Incorrect. Chi-square is for categorical variables; the outcome here is a numeric score."
        feedback_nl: "Onjuist. Chi-kwadraat is voor categorische variabelen; de uitkomst is hier een numerieke score."
      - text_en: "Independent-samples t-test"
        text_nl: "T-toets voor onafhankelijke steekproeven"
        correct: false
        feedback_en: "Incorrect. The two sets of scores come from the same people and are therefore dependent; an independent t-test ignores this pairing."
        feedback_nl: "Onjuist. De twee reeksen scores komen van dezelfde mensen en zijn dus afhankelijk; een onafhankelijke t-toets negeert die koppeling."
      - text_en: "Paired-samples t-test"
        text_nl: "Gepaarde t-toets"
        correct: true
        feedback_en: "Correct! The same employees provide both measurements and the IDs preserve the pairs. A paired t-test compares the mean within-person change."
        feedback_nl: "Correct! Dezelfde medewerkers leveren beide metingen en de ID's bewaren de paren. Een gepaarde t-toets vergelijkt de gemiddelde verandering per persoon."

  - id: 139
    tags: ["Tori"]
    source: "Tori Langill practice test, q39"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A hotel near a railway station receives both business and leisure guests. The sales director is particularly interested in breakfast, although the questionnaire also asks about room cleanliness and staff helpfulness. The researcher knows that these two guest groups may have different experiences. Using the booking records, she first places every eligible guest into either the business group or the leisure group. She then uses a random number generator to select guests separately from each of those two groups. Guests are not chosen simply because they are available in the lobby, and no whole hotel or floor is selected. Which sampling method does this procedure describe?"
    question_nl: "Een hotel bij een treinstation ontvangt zowel zakelijke als recreatieve gasten. De salesdirecteur is vooral geïnteresseerd in het ontbijt, hoewel de vragenlijst ook vraagt naar de netheid van de kamer en de behulpzaamheid van het personeel. De onderzoeker weet dat deze twee groepen gasten verschillende ervaringen kunnen hebben. Met de boekingsgegevens deelt ze eerst elke geschikte gast in bij de zakelijke of de recreatieve groep. Daarna gebruikt ze een randomgenerator om uit elk van die twee groepen afzonderlijk gasten te selecteren. Gasten worden niet gekozen omdat ze toevallig in de lobby zitten, en er wordt geen volledig hotel of volledige verdieping geselecteerd. Welke steekproefmethode beschrijft deze procedure?"
    answers:
      - text_en: "Systematic sampling"
        text_nl: "Systematische steekproef"
        correct: false
        feedback_en: "Incorrect. Systematic sampling uses a fixed interval (every k-th unit); here guests are drawn at random within groups."
        feedback_nl: "Onjuist. Een systematische steekproef gebruikt een vast interval (elke k-de eenheid); hier worden gasten aselect binnen groepen getrokken."
      - text_en: "Stratified sampling"
        text_nl: "Gestratificeerde steekproef"
        correct: true
        feedback_en: "Correct! The population is first divided by guest type (strata), then guests are drawn at random within each stratum: stratified sampling."
        feedback_nl: "Correct! De populatie wordt eerst verdeeld naar type gast (strata), daarna worden binnen elk stratum aselect gasten getrokken: een gestratificeerde steekproef."
      - text_en: "Convenience sampling"
        text_nl: "Gemakssteekproef"
        correct: false
        feedback_en: "Incorrect. The text explicitly says guests are not chosen because they happen to be available."
        feedback_nl: "Onjuist. De tekst zegt uitdrukkelijk dat gasten niet gekozen worden omdat ze toevallig beschikbaar zijn."
      - text_en: "Cluster sampling"
        text_nl: "Clustersteekproef"
        correct: false
        feedback_en: "Incorrect. In cluster sampling you select whole groups (hotels, floors) and survey everyone in them. Here individuals are drawn within each group."
        feedback_nl: "Onjuist. Bij een clustersteekproef selecteer je hele groepen (hotels, verdiepingen) en ondervraag je iedereen daarin. Hier worden binnen elke groep individuen getrokken."

  - id: 140
    tags: ["Tori"]
    source: "Tori Langill practice test, q40"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "A hotel chain compares a numeric service-quality outcome across four independent service teams. The teams use different uniforms and work in buildings of different ages, but the current analysis concerns their population mean scores. The group variances are unequal, and sample sizes also differ. The researcher has checked that the other conditions for a suitable mean comparison are met. Management first wants an overall comparison of the four means and then, only if that comparison is significant, a procedure identifying the pairs that differ. Both stages should accommodate unequal variances. Which combination of an overall test and a pairwise follow-up best fits this plan?"
    question_nl: "Een hotelketen vergelijkt een numerieke uitkomst voor servicekwaliteit tussen vier onafhankelijke serviceteams. De teams dragen verschillende uniformen en werken in gebouwen van verschillende leeftijd, maar de huidige analyse gaat over hun gemiddelde scores in de populatie. De groepsvarianties zijn ongelijk en ook de steekproefgroottes verschillen. De onderzoeker heeft gecontroleerd dat aan de andere voorwaarden voor een vergelijking van gemiddelden is voldaan. Het management wil eerst een overkoepelende vergelijking van de vier gemiddelden en daarna, alleen als die significant is, een procedure die aangeeft welke paren verschillen. Beide stappen moeten rekening houden met ongelijke varianties. Welke combinatie van een overkoepelende toets en een paarsgewijze vervolgtoets past het best bij dit plan?"
    answers:
      - text_en: "Levene's test followed by Pearson correlation"
        text_nl: "De toets van Levene gevolgd door Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Levene's test only checks the equality of variances, and Pearson correlation does not compare group means."
        feedback_nl: "Onjuist. De toets van Levene controleert alleen de gelijkheid van varianties, en Pearson-correlatie vergelijkt geen groepsgemiddelden."
      - text_en: "Welch's ANOVA followed by Games-Howell if significant"
        text_nl: "Welch-ANOVA gevolgd door Games-Howell als die significant is"
        correct: true
        feedback_en: "Correct! Four independent groups, numeric outcome, unequal variances: Welch's ANOVA for the overall test and Games-Howell as the post-hoc test, both robust to unequal variances."
        feedback_nl: "Correct! Vier onafhankelijke groepen, numerieke uitkomst, ongelijke varianties: Welch-ANOVA als overkoepelende toets en Games-Howell als post-hoctoets, beide robuust bij ongelijke varianties."
      - text_en: "A paired t-test followed by a pie chart"
        text_nl: "Een gepaarde t-toets gevolgd door een cirkeldiagram"
        correct: false
        feedback_en: "Incorrect. The teams are independent (not paired) and there are four of them; a pie chart is not a statistical test."
        feedback_nl: "Onjuist. De teams zijn onafhankelijk (niet gepaard) en het zijn er vier; een cirkeldiagram is geen toets."
      - text_en: "Standard ANOVA followed by unadjusted t-tests regardless of assumptions"
        text_nl: "Standaard-ANOVA gevolgd door ongecorrigeerde t-toetsen, ongeacht de voorwaarden"
        correct: false
        feedback_en: "Incorrect. Standard ANOVA assumes equal variances, and unadjusted t-tests inflate the Type I error risk."
        feedback_nl: "Onjuist. Een standaard-ANOVA veronderstelt gelijke varianties, en ongecorrigeerde t-toetsen verhogen de kans op een Type I-fout."

  - id: 141
    tags: ["Tori"]
    source: "Tori Langill practice test, q41"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "A hotel has received bookings through its own website, online travel agencies, and telephone reservations. For every booking, the researcher records the channel and whether the guest is travelling for business or leisure. The spreadsheet also includes room price, length of stay, and breakfast spending. Management wants to compare the counts in each booking channel separately for business and leisure guests, so that both guest types can be seen beside one another within each channel. Which graph is most appropriate?"
    question_nl: "Een hotel heeft boekingen ontvangen via de eigen website, online reisbureaus en telefonische reserveringen. Voor elke boeking noteert de onderzoeker het kanaal en of de gast zakelijk of recreatief reist. Het spreadsheet bevat ook de kamerprijs, de verblijfsduur en de ontbijtbesteding. Het management wil de aantallen per boekingskanaal apart vergelijken voor zakelijke en recreatieve gasten, zodat beide typen gasten binnen elk kanaal naast elkaar te zien zijn. Welke grafiek is het meest geschikt?"
    answers:
      - text_en: "A single pie chart combining all guests"
        text_nl: "Eén cirkeldiagram voor alle gasten samen"
        correct: false
        feedback_en: "Incorrect. A single pie chart cannot show business and leisure side by side within each channel."
        feedback_nl: "Onjuist. Eén cirkeldiagram kan zakelijk en recreatief niet naast elkaar binnen elk kanaal tonen."
      - text_en: "Histogram of booking channels"
        text_nl: "Histogram van de boekingskanalen"
        correct: false
        feedback_en: "Incorrect. A histogram is for the distribution of a numeric variable; booking channel is categorical."
        feedback_nl: "Onjuist. Een histogram is voor de verdeling van een numerieke variabele; boekingskanaal is categorisch."
      - text_en: "Scatterplot of channel codes"
        text_nl: "Spreidingsdiagram van kanaalcodes"
        correct: false
        feedback_en: "Incorrect. Channel codes are categories, not numeric values; a scatterplot is meaningless here."
        feedback_nl: "Onjuist. Kanaalcodes zijn categorieën, geen numerieke waarden; een spreidingsdiagram is hier zinloos."
      - text_en: "Clustered bar chart"
        text_nl: "Geclusterd staafdiagram"
        correct: true
        feedback_en: "Correct! Booking channel and guest type are both categorical. Clustered bars show the counts per channel for both guest types side by side."
        feedback_nl: "Correct! Boekingskanaal en type gast zijn beide categorisch. Geclusterde staven tonen de aantallen per kanaal voor beide typen gasten naast elkaar."

  - id: 142
    tags: ["Tori"]
    source: "Tori Langill practice test, q42"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "What is the null hypothesis of a one-way ANOVA with four groups?"
    question_nl: "Wat is de nulhypothese van een eenweg-ANOVA met vier groepen?"
    answers:
      - text_en: "All four population variances are zero"
        text_nl: "Alle vier de populatievarianties zijn nul"
        correct: false
        feedback_en: "Incorrect. ANOVA tests means, not variances, and variances of zero would mean there is no variation at all."
        feedback_nl: "Onjuist. ANOVA toetst gemiddelden, geen varianties, en een variantie van nul zou betekenen dat er helemaal geen variatie is."
      - text_en: "Every pair of means differs"
        text_nl: "Elk paar gemiddelden verschilt"
        correct: false
        feedback_en: "Incorrect. That is not H₀. Even the alternative hypothesis only states that at least one mean differs."
        feedback_nl: "Onjuist. Dat is niet H₀. Zelfs de alternatieve hypothese stelt alleen dat minstens één gemiddelde verschilt."
      - text_en: "All four population means are equal"
        text_nl: "Alle vier de populatiegemiddelden zijn gelijk"
        correct: true
        feedback_en: "Correct! H₀: μ₁ = μ₂ = μ₃ = μ₄. The omnibus null covers equality of every group mean."
        feedback_nl: "Correct! H₀: μ₁ = μ₂ = μ₃ = μ₄. De overkoepelende nulhypothese stelt dat alle groepsgemiddelden gelijk zijn."
      - text_en: "Only the first two population means are equal"
        text_nl: "Alleen de eerste twee populatiegemiddelden zijn gelijk"
        correct: false
        feedback_en: "Incorrect. H₀ concerns all groups, not just the first two."
        feedback_nl: "Onjuist. H₀ gaat over alle groepen, niet alleen over de eerste twee."

  - id: 143
    tags: ["Tori"]
    source: "Tori Langill practice test, q43"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "A hotel wants to know whether euros spent and minutes spent at breakfast are linearly related. The scatterplot is approximately linear with no major outliers. Which analysis fits?"
    question_nl: "Een hotel wil weten of het aantal bestede euro's en het aantal minuten aan het ontbijt lineair samenhangen. Het spreidingsdiagram is ongeveer lineair, zonder grote uitschieters. Welke analyse past?"
    answers:
      - text_en: "One-way ANOVA with guest ID as the factor"
        text_nl: "Eenweg-ANOVA met gast-ID als factor"
        correct: false
        feedback_en: "Incorrect. Guest ID is not a meaningful grouping variable, and ANOVA compares means, not linear relationships."
        feedback_nl: "Onjuist. Gast-ID is geen zinvolle groeperingsvariabele, en ANOVA vergelijkt gemiddelden, geen lineaire verbanden."
      - text_en: "Paired t-test comparing euros directly with minutes"
        text_nl: "Gepaarde t-toets die euro's direct met minuten vergelijkt"
        correct: false
        feedback_en: "Incorrect. Euros and minutes are different units; comparing their means is meaningless. The question is about association."
        feedback_nl: "Onjuist. Euro's en minuten zijn verschillende eenheden; hun gemiddelden vergelijken is zinloos. De vraag gaat over samenhang."
      - text_en: "Chi-square test on the raw numeric values"
        text_nl: "Chi-kwadraattoets op de ruwe numerieke waarden"
        correct: false
        feedback_en: "Incorrect. Chi-square is for categorical variables, not for raw numeric values."
        feedback_nl: "Onjuist. Chi-kwadraat is voor categorische variabelen, niet voor ruwe numerieke waarden."
      - text_en: "Pearson correlation"
        text_nl: "Pearson-correlatie"
        correct: true
        feedback_en: "Correct! Two numeric variables, an approximately linear pattern and no major outliers: Pearson correlation measures the strength and direction of the linear relationship."
        feedback_nl: "Correct! Twee numerieke variabelen, een ongeveer lineair patroon en geen grote uitschieters: Pearson-correlatie meet de sterkte en richting van het lineaire verband."

  - id: 144
    tags: ["Tori"]
    source: "Tori Langill practice test, q44"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A chain randomly selects six hotels and surveys every employee in those hotels. Which method is used?"
    question_nl: "Een keten selecteert aselect zes hotels en ondervraagt alle medewerkers in die hotels. Welke methode wordt gebruikt?"
    answers:
      - text_en: "Convenience sampling"
        text_nl: "Gemakssteekproef"
        correct: false
        feedback_en: "Incorrect. The hotels are selected at random, not because they are easy to reach."
        feedback_nl: "Onjuist. De hotels worden aselect gekozen, niet omdat ze makkelijk bereikbaar zijn."
      - text_en: "Stratified sampling"
        text_nl: "Gestratificeerde steekproef"
        correct: false
        feedback_en: "Incorrect. In stratified sampling you draw individuals within every subgroup; here whole groups are selected and fully surveyed."
        feedback_nl: "Onjuist. Bij een gestratificeerde steekproef trek je individuen binnen elke subgroep; hier worden hele groepen geselecteerd en volledig ondervraagd."
      - text_en: "Cluster sampling"
        text_nl: "Clustersteekproef"
        correct: true
        feedback_en: "Correct! Whole groups (hotels) are selected at random and everyone in them is surveyed: cluster sampling."
        feedback_nl: "Correct! Hele groepen (hotels) worden aselect gekozen en iedereen daarin wordt ondervraagd: een clustersteekproef."
      - text_en: "Systematic sampling"
        text_nl: "Systematische steekproef"
        correct: false
        feedback_en: "Incorrect. Systematic sampling uses a fixed interval on a list (every k-th unit), which is not the case here."
        feedback_nl: "Onjuist. Een systematische steekproef gebruikt een vast interval op een lijst (elke k-de eenheid); dat is hier niet het geval."

  - id: 145
    tags: ["Tori"]
    source: "Tori Langill practice test, q45"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "A hotel promises that its usual check-in procedure takes an average of 5 minutes. To investigate this claim, a researcher records check-in times in minutes for a sample of guests using that procedure. The spreadsheet also records whether guests arrive by car, whether they have luggage, and which receptionist serves them. However, the current research question does not compare those categories or examine relationships between them. It asks whether the population mean check-in time differs from the stated target of 5 minutes. Assuming the relevant conditions are met, which statistical test should be used?"
    question_nl: "Een hotel belooft dat de gebruikelijke incheckprocedure gemiddeld 5 minuten duurt. Om die bewering te onderzoeken, noteert een onderzoeker de incheckduur in minuten bij een steekproef van gasten die deze procedure gebruiken. Het spreadsheet vermeldt ook of gasten met de auto komen, of ze bagage hebben en welke receptionist hen helpt. De huidige onderzoeksvraag vergelijkt die categorieën echter niet en onderzoekt ook geen verbanden ertussen. De vraag is of de gemiddelde incheckduur in de populatie afwijkt van het genoemde doel van 5 minuten. Welke toets moet gebruikt worden, ervan uitgaande dat aan de relevante voorwaarden is voldaan?"
    answers:
      - text_en: "One-sample t-test"
        text_nl: "One-sample t-toets"
        correct: true
        feedback_en: "Correct! One numeric sample is compared with a fixed value (5 minutes): a one-sample t-test. The arrival categories are not part of this question."
        feedback_nl: "Correct! Eén numerieke steekproef wordt vergeleken met een vaste waarde (5 minuten): een one-sample t-toets. De aankomstcategorieën horen niet bij deze vraag."
      - text_en: "Chi-square test of independence"
        text_nl: "Chi-kwadraattoets op onafhankelijkheid"
        correct: false
        feedback_en: "Incorrect. Chi-square examines the association between two categorical variables; the outcome here is numeric."
        feedback_nl: "Onjuist. Chi-kwadraat onderzoekt het verband tussen twee categorische variabelen; de uitkomst is hier numeriek."
      - text_en: "Paired-samples t-test"
        text_nl: "Gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. There are no paired measurements (e.g. before/after) here; there is one sample and a target value."
        feedback_nl: "Onjuist. Er zijn hier geen gepaarde metingen (bijv. voor/na); er is één steekproef en een streefwaarde."
      - text_en: "Independent-samples t-test"
        text_nl: "T-toets voor onafhankelijke steekproeven"
        correct: false
        feedback_en: "Incorrect. That would compare two groups with each other; here one group is compared with a fixed number."
        feedback_nl: "Onjuist. Die vergelijkt twee groepen met elkaar; hier wordt één groep vergeleken met een vast getal."

  - id: 146
    tags: ["Tori"]
    source: "Tori Langill practice test, q46"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "Which hypotheses test whether the proportion preferring blue differs from the proportion preferring green?"
    question_nl: "Met welke hypothesen toets je of de proportie die blauw verkiest, verschilt van de proportie die groen verkiest?"
    answers:
      - text_en: "H₀: πblue ≠ πgreen; H₁: πblue = πgreen"
        text_nl: "H₀: πblue ≠ πgreen; H₁: πblue = πgreen"
        correct: false
        feedback_en: "Incorrect. H₀ and H₁ are reversed: H₀ always contains the equals sign, and the claim of a difference belongs in H₁."
        feedback_nl: "Onjuist. H₀ en H₁ zijn omgedraaid: H₀ bevat altijd het gelijkheidsteken, en de bewering dat er een verschil is, hoort in H₁."
      - text_en: "H₀: πblue = πgreen; H₁: πblue ≠ πgreen"
        text_nl: "H₀: πblue = πgreen; H₁: πblue ≠ πgreen"
        correct: true
        feedback_en: "Correct! Preference is categorical, so use π (proportion). The question is non-directional ('differs'), so H₁ uses ≠."
        feedback_nl: "Correct! Voorkeur is categorisch, dus gebruik je π (proportie). De vraag is tweezijdig ('verschilt'), dus H₁ gebruikt ≠."
      - text_en: "H₀: πblue > πgreen; H₁: πblue > πgreen"
        text_nl: "H₀: πblue > πgreen; H₁: πblue > πgreen"
        correct: false
        feedback_en: "Incorrect. H₀ and H₁ are identical, so they overlap completely, and the question is not directional."
        feedback_nl: "Onjuist. H₀ en H₁ zijn identiek en overlappen dus volledig, en de vraag is niet eenzijdig."
      - text_en: "H₀: μblue = μgreen; H₁: μblue ≠ μgreen"
        text_nl: "H₀: μblue = μgreen; H₁: μblue ≠ μgreen"
        correct: false
        feedback_en: "Incorrect. μ is for means of numeric variables; preference for a colour is categorical, so π applies."
        feedback_nl: "Onjuist. μ is voor gemiddelden van numerieke variabelen; voorkeur voor een kleur is categorisch, dus π is van toepassing."

  - id: 147
    tags: ["Tori"]
    source: "Tori Langill practice test, q47"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "Independent guests are classified as business or leisure and as returned or did not return. All expected counts exceed 5. Which analysis fits?"
    question_nl: "Onafhankelijke gasten worden ingedeeld als zakelijk of recreatief en als teruggekomen of niet teruggekomen. Alle verwachte aantallen zijn groter dan 5. Welke analyse past?"
    answers:
      - text_en: "Independent t-test on arbitrary category codes"
        text_nl: "Onafhankelijke t-toets op willekeurige categoriecodes"
        correct: false
        feedback_en: "Incorrect. Category codes (e.g. 1/2) are not real numbers; a mean of codes is meaningless."
        feedback_nl: "Onjuist. Categoriecodes (bijv. 1/2) zijn geen echte getallen; een gemiddelde van codes is zinloos."
      - text_en: "Pearson correlation of guest IDs"
        text_nl: "Pearson-correlatie van gast-ID's"
        correct: false
        feedback_en: "Incorrect. Guest IDs are identifiers, not variables; correlating them is meaningless."
        feedback_nl: "Onjuist. Gast-ID's zijn identificatiecodes, geen variabelen; ze correleren is zinloos."
      - text_en: "Chi-square test of independence"
        text_nl: "Chi-kwadraattoets op onafhankelijkheid"
        correct: true
        feedback_en: "Correct! Two categorical variables, independent observations and all expected counts > 5: the chi-square test of independence fits."
        feedback_nl: "Correct! Twee categorische variabelen, onafhankelijke waarnemingen en alle verwachte aantallen > 5: de chi-kwadraattoets op onafhankelijkheid past."
      - text_en: "Paired t-test on the two category labels"
        text_nl: "Gepaarde t-toets op de twee categorielabels"
        correct: false
        feedback_en: "Incorrect. There are no paired numeric measurements, only categories."
        feedback_nl: "Onjuist. Er zijn geen gepaarde numerieke metingen, alleen categorieën."

  - id: 148
    tags: ["Tori"]
    source: "Tori Langill practice test, q48"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A weighing scale consistently adds 2 kg to every reading. Which description fits best?"
    question_nl: "Een weegschaal telt bij elke meting consequent 2 kg op. Welke omschrijving past het best?"
    answers:
      - text_en: "Perfectly valid because readings repeat"
        text_nl: "Perfect valide, want de metingen herhalen zich"
        correct: false
        feedback_en: "Incorrect. Repeatable readings indicate reliability, not validity. The scale is consistently wrong, so it is not valid."
        feedback_nl: "Onjuist. Herhaalbare metingen wijzen op betrouwbaarheid, niet op validiteit. De weegschaal zit er consequent naast en is dus niet valide."
      - text_en: "Reliable readings with poor accuracy"
        text_nl: "Betrouwbare metingen met een slechte nauwkeurigheid"
        correct: true
        feedback_en: "Correct! The readings are consistent (reliable), but systematically 2 kg too high (biased, so not valid). Reliability does not guarantee validity."
        feedback_nl: "Correct! De metingen zijn consistent (betrouwbaar), maar systematisch 2 kg te hoog (vertekend, dus niet valide). Betrouwbaarheid garandeert geen validiteit."
      - text_en: "Valid readings with poor consistency"
        text_nl: "Valide metingen met een slechte consistentie"
        correct: false
        feedback_en: "Incorrect. The opposite is true: the readings are consistent but not accurate."
        feedback_nl: "Onjuist. Het omgekeerde is waar: de metingen zijn consistent maar niet juist."
      - text_en: "Neither consistent nor accurate"
        text_nl: "Niet consistent en niet juist"
        correct: false
        feedback_en: "Incorrect. The scale is consistent: it always adds the same 2 kg. It is only inaccurate."
        feedback_nl: "Onjuist. De weegschaal is wél consistent: hij telt er altijd dezelfde 2 kg bij. Hij is alleen niet juist."

  - id: 149
    tags: ["Tori"]
    source: "Tori Langill practice test, q49"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "H₀ states that training does not improve satisfaction. The study fails to find an improvement, but the training really does improve it. What occurred?"
    question_nl: "H₀ stelt dat een training de tevredenheid niet verbetert. Het onderzoek vindt geen verbetering, maar de training verbetert de tevredenheid in werkelijkheid wel. Wat is er gebeurd?"
    answers:
      - text_en: "Correct rejection"
        text_nl: "Terecht verwerpen"
        correct: false
        feedback_en: "Incorrect. H₀ was not rejected (no improvement found), so this cannot be a rejection."
        feedback_nl: "Onjuist. H₀ werd niet verworpen (er werd geen verbetering gevonden), dus dit kan geen verwerping zijn."
      - text_en: "Type II error"
        text_nl: "Type II-fout"
        correct: true
        feedback_en: "Correct! H₀ is false (there is an improvement), but the study does not reject it: failing to reject a false H₀ is a Type II error."
        feedback_nl: "Correct! H₀ is onwaar (er is wel een verbetering), maar het onderzoek verwerpt hem niet: een onware H₀ niet verwerpen is een Type II-fout."
      - text_en: "Correct nonrejection"
        text_nl: "Terecht niet verwerpen"
        correct: false
        feedback_en: "Incorrect. Not rejecting is only correct if H₀ is true. Here the training really works, so H₀ is false."
        feedback_nl: "Onjuist. Niet verwerpen is alleen terecht als H₀ waar is. Hier werkt de training echt, dus H₀ is onwaar."
      - text_en: "Type I error"
        text_nl: "Type I-fout"
        correct: false
        feedback_en: "Incorrect. A Type I error is rejecting a true H₀. Here H₀ was not rejected."
        feedback_nl: "Onjuist. Een Type I-fout is een ware H₀ verwerpen. Hier werd H₀ niet verworpen."

  - id: 150
    tags: ["Tori"]
    source: "Tori Langill practice test, q50"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A 95 percent confidence interval for an improvement is [0.1, 0.4] points. Management considers an improvement of at least 2 points useful. What is the best conclusion?"
    question_nl: "Een 95%-betrouwbaarheidsinterval voor een verbetering is [0,1; 0,4] punten. Het management vindt een verbetering van minstens 2 punten zinvol. Wat is de beste conclusie?"
    answers:
      - text_en: "The improvement is statistically detectable but below the stated practical threshold"
        text_nl: "De verbetering is statistisch aantoonbaar, maar ligt onder de genoemde praktische drempel"
        correct: true
        feedback_en: "Correct! The interval excludes 0 (statistically significant), but even the upper bound (0.4) is far below 2 points. Statistically significant ≠ practically relevant."
        feedback_nl: "Correct! Het interval bevat 0 niet (statistisch significant), maar zelfs de bovengrens (0,4) ligt ver onder 2 punten. Statistisch significant ≠ praktisch relevant."
      - text_en: "The interval shows no evidence of a positive improvement"
        text_nl: "Het interval toont geen bewijs voor een positieve verbetering"
        correct: false
        feedback_en: "Incorrect. The whole interval is above 0, so there is evidence of a (small) positive improvement."
        feedback_nl: "Onjuist. Het hele interval ligt boven 0, dus er is wel bewijs voor een (kleine) positieve verbetering."
      - text_en: "The true improvement must exceed 2 points"
        text_nl: "De ware verbetering moet groter zijn dan 2 punten"
        correct: false
        feedback_en: "Incorrect. The entire interval is below 2; the data suggest the improvement is much smaller than 2 points."
        feedback_nl: "Onjuist. Het hele interval ligt onder 2; de data wijzen erop dat de verbetering veel kleiner is dan 2 punten."
      - text_en: "Statistical significance guarantees practical usefulness"
        text_nl: "Statistische significantie garandeert praktisch nut"
        correct: false
        feedback_en: "Incorrect. A result can be significant but too small to matter in practice; this is such a case."
        feedback_nl: "Onjuist. Een resultaat kan significant zijn maar te klein om in de praktijk iets te betekenen; dit is zo'n geval."

  - id: 151
    tags: ["Tori"]
    source: "Tori Langill practice test, q51"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "A large hotel chain collects waiting times and numeric satisfaction scores from 2,000 guests. The spreadsheet also records nationality, room type, and whether guests visit the spa. A suitable correlation analysis of waiting time and satisfaction gives r = −.12 and p < .001. Management wants to report both the magnitude of the linear association and the statistical evidence for it. The researcher has not conducted an experiment, so the analysis does not establish that changing waiting time causes a change in satisfaction. A colleague calls the relationship strong solely because the p-value is very small. Which report best interprets the actual result?"
    question_nl: "Een grote hotelketen verzamelt wachttijden en numerieke tevredenheidsscores van 2.000 gasten. Het spreadsheet vermeldt ook nationaliteit, kamertype en of gasten de spa bezoeken. Een geschikte correlatieanalyse van wachttijd en tevredenheid geeft r = −.12 en p < .001. Het management wil zowel de sterkte van het lineaire verband als het statistische bewijs ervoor rapporteren. De onderzoeker heeft geen experiment uitgevoerd, dus de analyse toont niet aan dat een verandering in wachttijd een verandering in tevredenheid veroorzaakt. Een collega noemt het verband sterk, uitsluitend omdat de p-waarde heel klein is. Welke rapportage interpreteert het werkelijke resultaat het best?"
    answers:
      - text_en: "No association because absolute r is below .50"
        text_nl: "Geen verband, omdat de absolute waarde van r onder .50 ligt"
        correct: false
        feedback_en: "Incorrect. A small |r| means a weak association, not no association. With p < .001 there is clear evidence of a (weak) relationship."
        feedback_nl: "Onjuist. Een kleine |r| betekent een zwak verband, niet géén verband. Met p < .001 is er duidelijk bewijs voor een (zwak) verband."
      - text_en: "A strong negative relationship because p is very small"
        text_nl: "Een sterk negatief verband, omdat p heel klein is"
        correct: false
        feedback_en: "Incorrect. The p-value measures evidence, not strength. With n = 2,000 even a weak correlation becomes significant; |r| = .12 is weak."
        feedback_nl: "Onjuist. De p-waarde meet bewijs, geen sterkte. Bij n = 2.000 wordt zelfs een zwakke correlatie significant; |r| = .12 is zwak."
      - text_en: "A weak negative linear association with strong statistical evidence, without a causal conclusion"
        text_nl: "Een zwak negatief lineair verband met sterk statistisch bewijs, zonder causale conclusie"
        correct: true
        feedback_en: "Correct! |r| = .12 is small (weak), the sign is negative, and p < .001 gives strong evidence in this large sample. Without an experiment there is no causal claim."
        feedback_nl: "Correct! |r| = .12 is klein (zwak), het teken is negatief en p < .001 geeft sterk bewijs in deze grote steekproef. Zonder experiment is er geen causale conclusie."
      - text_en: "Proof that reducing waiting time will raise every guest's satisfaction"
        text_nl: "Bewijs dat een kortere wachttijd de tevredenheid van elke gast verhoogt"
        correct: false
        feedback_en: "Incorrect. Correlation does not prove causation and says nothing about every individual guest."
        feedback_nl: "Onjuist. Correlatie bewijst geen oorzakelijkheid en zegt niets over elke individuele gast."

  - id: 152
    tags: ["Tori"]
    source: "Tori Langill practice test, q52"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A satisfaction questionnaire looks relevant to the students who read it. Which form of validity does this illustrate?"
    question_nl: "Een tevredenheidsvragenlijst lijkt relevant voor de studenten die hem lezen. Welke vorm van validiteit illustreert dit?"
    answers:
      - text_en: "Sampling validity"
        text_nl: "Steekproefvaliditeit"
        correct: false
        feedback_en: "Incorrect. This is not a standard form of validity; sampling concerns the selection of respondents."
        feedback_nl: "Onjuist. Dit is geen standaardvorm van validiteit; een steekproef gaat over het selecteren van respondenten."
      - text_en: "Face validity"
        text_nl: "Indruksvaliditeit (face validity)"
        correct: true
        feedback_en: "Correct! Face validity concerns whether an instrument appears, at first sight, to measure what it should. That is exactly what is described here."
        feedback_nl: "Correct! Indruksvaliditeit gaat over de vraag of een instrument op het eerste gezicht lijkt te meten wat het moet meten. Dat is precies wat hier beschreven wordt."
      - text_en: "Predictive validity"
        text_nl: "Predictieve validiteit"
        correct: false
        feedback_en: "Incorrect. Predictive validity concerns whether scores predict a future outcome, not how the questionnaire looks."
        feedback_nl: "Onjuist. Predictieve validiteit gaat over de vraag of scores een toekomstige uitkomst voorspellen, niet over hoe de vragenlijst overkomt."
      - text_en: "Test-retest reliability"
        text_nl: "Test-hertestbetrouwbaarheid"
        correct: false
        feedback_en: "Incorrect. Test-retest reliability concerns stable scores over time, not whether the questions look relevant."
        feedback_nl: "Onjuist. Test-hertestbetrouwbaarheid gaat over stabiele scores in de tijd, niet over de vraag of de items relevant lijken."

  - id: 153
    tags: ["Tori"]
    source: "Tori Langill practice test, q53"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "A contingency table has three row categories and four column categories. What are its chi-square degrees of freedom?"
    question_nl: "Een kruistabel heeft drie rijcategorieën en vier kolomcategorieën. Hoeveel vrijheidsgraden heeft de chi-kwadraattoets?"
    answers:
      - text_en: "12"
        text_nl: "12"
        correct: false
        feedback_en: "Incorrect. 12 is the number of cells (3 × 4), not the degrees of freedom."
        feedback_nl: "Onjuist. 12 is het aantal cellen (3 × 4), niet het aantal vrijheidsgraden."
      - text_en: "7"
        text_nl: "7"
        correct: false
        feedback_en: "Incorrect. 7 = 3 + 4; the degrees of freedom are calculated by multiplying, not adding."
        feedback_nl: "Onjuist. 7 = 3 + 4; de vrijheidsgraden bereken je door te vermenigvuldigen, niet door op te tellen."
      - text_en: "3"
        text_nl: "3"
        correct: false
        feedback_en: "Incorrect. 3 is only (columns − 1); you also have to multiply by (rows − 1)."
        feedback_nl: "Onjuist. 3 is alleen (kolommen − 1); je moet ook nog vermenigvuldigen met (rijen − 1)."
      - text_en: "6"
        text_nl: "6"
        correct: true
        feedback_en: "Correct! df = (rows − 1) × (columns − 1) = (3 − 1) × (4 − 1) = 2 × 3 = 6."
        feedback_nl: "Correct! df = (rijen − 1) × (kolommen − 1) = (3 − 1) × (4 − 1) = 2 × 3 = 6."

  - id: 154
    tags: ["Tori"]
    source: "Tori Langill practice test, q54"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A researcher surveys guests who happen to be sitting in the lobby. What is the main sampling concern?"
    question_nl: "Een onderzoeker ondervraagt gasten die toevallig in de lobby zitten. Wat is het belangrijkste bezwaar voor de steekproef?"
    answers:
      - text_en: "All guests have equal selection probabilities"
        text_nl: "Alle gasten hebben een gelijke selectiekans"
        correct: false
        feedback_en: "Incorrect. On the contrary: guests who are never in the lobby have no chance of being selected."
        feedback_nl: "Onjuist. Integendeel: gasten die nooit in de lobby zitten, hebben geen kans om geselecteerd te worden."
      - text_en: "Random selection makes the sample too small"
        text_nl: "Aselecte selectie maakt de steekproef te klein"
        correct: false
        feedback_en: "Incorrect. There is no random selection here at all; it is a convenience sample."
        feedback_nl: "Onjuist. Er is hier helemaal geen aselecte selectie; het is een gemakssteekproef."
      - text_en: "The method requires a complete guest list"
        text_nl: "De methode vereist een volledige gastenlijst"
        correct: false
        feedback_en: "Incorrect. A convenience sample needs no list; that is precisely why it is easy (and risky)."
        feedback_nl: "Onjuist. Een gemakssteekproef heeft geen lijst nodig; daarom is ze juist makkelijk (en riskant)."
      - text_en: "The sample may underrepresent other types of guests"
        text_nl: "Andere typen gasten kunnen ondervertegenwoordigd zijn"
        correct: true
        feedback_en: "Correct! Who is in the lobby can be related to guest characteristics (e.g. leisure vs business). This convenience sample can therefore be biased."
        feedback_nl: "Correct! Wie er in de lobby zit, kan samenhangen met kenmerken van gasten (bijv. recreatief vs zakelijk). Deze gemakssteekproef kan daardoor vertekend zijn."

  - id: 155
    tags: ["Tori"]
    source: "Tori Langill practice test, q55"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Which method compares mean satisfaction scores across three unrelated service teams, assuming the conditions are met?"
    question_nl: "Welke methode vergelijkt de gemiddelde tevredenheidsscores van drie onafhankelijke serviceteams, ervan uitgaande dat aan de voorwaarden is voldaan?"
    answers:
      - text_en: "One-sample t-test"
        text_nl: "One-sample t-toets"
        correct: false
        feedback_en: "Incorrect. A one-sample t-test compares one mean with a fixed value, not three groups with each other."
        feedback_nl: "Onjuist. Een one-sample t-toets vergelijkt één gemiddelde met een vaste waarde, geen drie groepen met elkaar."
      - text_en: "Chi-square test of independence"
        text_nl: "Chi-kwadraattoets op onafhankelijkheid"
        correct: false
        feedback_en: "Incorrect. Chi-square is for categorical outcomes; satisfaction scores are numeric."
        feedback_nl: "Onjuist. Chi-kwadraat is voor categorische uitkomsten; tevredenheidsscores zijn numeriek."
      - text_en: "One-way ANOVA"
        text_nl: "Eenweg-ANOVA"
        correct: true
        feedback_en: "Correct! One-way ANOVA compares the means of a numeric outcome across three or more independent groups (levels of one factor)."
        feedback_nl: "Correct! Een eenweg-ANOVA vergelijkt de gemiddelden van een numerieke uitkomst tussen drie of meer onafhankelijke groepen (niveaus van één factor)."
      - text_en: "Paired-samples t-test"
        text_nl: "Gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. A paired t-test compares two related measurements, not three unrelated groups."
        feedback_nl: "Onjuist. Een gepaarde t-toets vergelijkt twee samenhangende metingen, geen drie onafhankelijke groepen."

  - id: 156
    tags: ["Tori"]
    source: "Tori Langill practice test, q56"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "What is the main purpose of a confidence interval?"
    question_nl: "Wat is het belangrijkste doel van een betrouwbaarheidsinterval?"
    answers:
      - text_en: "To estimate a population parameter with a range expressing uncertainty"
        text_nl: "Een populatieparameter schatten met een bereik dat de onzekerheid uitdrukt"
        correct: true
        feedback_en: "Correct! A confidence interval gives a range of plausible values for the population parameter and thus communicates the estimation uncertainty."
        feedback_nl: "Correct! Een betrouwbaarheidsinterval geeft een bereik van plausibele waarden voor de populatieparameter en maakt zo de onzekerheid van de schatting zichtbaar."
      - text_en: "To report the exact population parameter"
        text_nl: "De exacte populatieparameter rapporteren"
        correct: false
        feedback_en: "Incorrect. With a sample you never know the exact parameter; that is precisely why you report an interval."
        feedback_nl: "Onjuist. Met een steekproef ken je de exacte parameter nooit; daarom rapporteer je juist een interval."
      - text_en: "To display every observation"
        text_nl: "Elke waarneming weergeven"
        correct: false
        feedback_en: "Incorrect. An interval summarises the uncertainty around an estimate; it does not show individual observations."
        feedback_nl: "Onjuist. Een interval vat de onzekerheid rond een schatting samen; het toont geen individuele waarnemingen."
      - text_en: "To prove the null hypothesis"
        text_nl: "De nulhypothese bewijzen"
        correct: false
        feedback_en: "Incorrect. Neither a confidence interval nor a test can prove H₀."
        feedback_nl: "Onjuist. Een betrouwbaarheidsinterval kan H₀ niet bewijzen, en een toets ook niet."

  - id: 157
    tags: ["Tori"]
    source: "Tori Langill practice test, q57"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "For the proportion of guests who return within one year, which parameter is relevant?"
    question_nl: "Welke parameter is relevant voor de proportie gasten die binnen een jaar terugkomt?"
    answers:
      - text_en: "μ, the population mean spending"
        text_nl: "μ, de gemiddelde besteding in de populatie"
        correct: false
        feedback_en: "Incorrect. μ is for numeric outcomes; 'returned yes/no' is categorical."
        feedback_nl: "Onjuist. μ is voor numerieke uitkomsten; 'teruggekomen ja/nee' is categorisch."
      - text_en: "r, the correlation coefficient"
        text_nl: "r, de correlatiecoëfficiënt"
        correct: false
        feedback_en: "Incorrect. r describes the relationship between two numeric variables and is not a proportion."
        feedback_nl: "Onjuist. r beschrijft het verband tussen twee numerieke variabelen en is geen proportie."
      - text_en: "π, the population proportion"
        text_nl: "π, de populatieproportie"
        correct: true
        feedback_en: "Correct! Returned versus did not return is a categorical (binary) outcome, so the parameter is the population proportion π."
        feedback_nl: "Correct! Teruggekomen versus niet teruggekomen is een categorische (binaire) uitkomst, dus de parameter is de populatieproportie π."
      - text_en: "s, the sample standard deviation"
        text_nl: "s, de standaardafwijking in de steekproef"
        correct: false
        feedback_en: "Incorrect. s is a sample statistic for spread, not a population parameter for a proportion."
        feedback_nl: "Onjuist. s is een steekproefgrootheid voor spreiding, geen populatieparameter voor een proportie."

  - id: 158
    tags: ["Tori"]
    source: "Tori Langill practice test, q58"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "A test rejects H₀ and H₀ really is false. How should this decision be classified?"
    question_nl: "Een toets verwerpt H₀ en H₀ is in werkelijkheid onwaar. Hoe moet deze beslissing worden ingedeeld?"
    answers:
      - text_en: "Correct rejection"
        text_nl: "Terecht verwerpen"
        correct: true
        feedback_en: "Correct! Rejecting a false H₀ is a correct decision (the probability of this is the power, 1 − β)."
        feedback_nl: "Correct! Een onware H₀ verwerpen is een juiste beslissing (de kans daarop is het onderscheidingsvermogen, 1 − β)."
      - text_en: "Type II error"
        text_nl: "Type II-fout"
        correct: false
        feedback_en: "Incorrect. A Type II error is not rejecting a false H₀; here H₀ was rejected."
        feedback_nl: "Onjuist. Een Type II-fout is een onware H₀ niet verwerpen; hier werd H₀ wel verworpen."
      - text_en: "Correct nonrejection"
        text_nl: "Terecht niet verwerpen"
        correct: false
        feedback_en: "Incorrect. H₀ was rejected, so this cannot be a nonrejection."
        feedback_nl: "Onjuist. H₀ werd verworpen, dus dit kan geen niet-verwerping zijn."
      - text_en: "Type I error"
        text_nl: "Type I-fout"
        correct: false
        feedback_en: "Incorrect. A Type I error is rejecting a true H₀; here H₀ is false."
        feedback_nl: "Onjuist. Een Type I-fout is een ware H₀ verwerpen; hier is H₀ onwaar."

  - id: 159
    tags: ["Tori"]
    source: "Tori Langill practice test, q59"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "What does a two-sided independent-samples t-test usually state in H₀?"
    question_nl: "Wat stelt H₀ meestal bij een tweezijdige t-toets voor onafhankelijke steekproeven?"
    answers:
      - text_en: "The two sample means must be identical"
        text_nl: "De twee steekproefgemiddelden moeten identiek zijn"
        correct: false
        feedback_en: "Incorrect. Hypotheses are about population parameters, not about sample means; sample means almost always differ somewhat."
        feedback_nl: "Onjuist. Hypothesen gaan over populatieparameters, niet over steekproefgemiddelden; steekproefgemiddelden verschillen bijna altijd een beetje."
      - text_en: "The two population means are equal"
        text_nl: "De twee populatiegemiddelden zijn gelijk"
        correct: true
        feedback_en: "Correct! H₀: μ₁ = μ₂. The test assesses whether the data provide enough evidence against equal population means."
        feedback_nl: "Correct! H₀: μ₁ = μ₂. De toets beoordeelt of de data genoeg bewijs leveren tegen gelijke populatiegemiddelden."
      - text_en: "The two population variances are unequal"
        text_nl: "De twee populatievarianties zijn ongelijk"
        correct: false
        feedback_en: "Incorrect. Variances concern an assumption (checked with Levene's test), not the H₀ of the t-test."
        feedback_nl: "Onjuist. Varianties gaan over een voorwaarde (gecontroleerd met de toets van Levene), niet over de H₀ van de t-toets."
      - text_en: "The variables have a perfect correlation"
        text_nl: "De variabelen correleren perfect"
        correct: false
        feedback_en: "Incorrect. A t-test compares means; correlation plays no role in its H₀."
        feedback_nl: "Onjuist. Een t-toets vergelijkt gemiddelden; correlatie speelt geen rol in de H₀."

  - id: 160
    tags: ["Tori"]
    source: "Tori Langill practice test, q60"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "On a standard histogram of waiting time, what does the vertical axis usually show?"
    question_nl: "Wat staat er meestal op de verticale as van een standaardhistogram van de wachttijd?"
    answers:
      - text_en: "Frequency or count"
        text_nl: "Frequentie of aantal"
        correct: true
        feedback_en: "Correct! The horizontal axis shows the intervals (bins) of waiting time; the vertical axis shows how many observations fall in each interval."
        feedback_nl: "Correct! Op de horizontale as staan de intervallen (klassen) van de wachttijd; op de verticale as hoeveel waarnemingen in elk interval vallen."
      - text_en: "The significance level"
        text_nl: "Het significantieniveau"
        correct: false
        feedback_en: "Incorrect. α is a chosen threshold for a test, not something you plot on a histogram axis."
        feedback_nl: "Onjuist. α is een gekozen drempel voor een toets, niet iets wat je op de as van een histogram uitzet."
      - text_en: "Waiting time in minutes"
        text_nl: "Wachttijd in minuten"
        correct: false
        feedback_en: "Incorrect. Waiting time is on the horizontal axis (divided into intervals), not the vertical one."
        feedback_nl: "Onjuist. De wachttijd staat op de horizontale as (verdeeld in intervallen), niet op de verticale."
      - text_en: "The names of guests"
        text_nl: "De namen van de gasten"
        correct: false
        feedback_en: "Incorrect. A histogram summarises frequencies; individual names do not appear in it."
        feedback_nl: "Onjuist. Een histogram vat frequenties samen; individuele namen komen er niet in voor."

  - id: 161
    tags: ["Tori"]
    source: "Tori Langill practice test, q61"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "For an independent 2 × 2 table with very small expected counts, which test may be appropriate?"
    question_nl: "Welke toets kan geschikt zijn voor een 2 × 2-tabel met onafhankelijke waarnemingen en zeer kleine verwachte aantallen?"
    answers:
      - text_en: "A paired-samples t-test"
        text_nl: "Een gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. A t-test needs a numeric outcome and paired data; here there are two categorical variables."
        feedback_nl: "Onjuist. Een t-toets vereist een numerieke uitkomst en gepaarde data; hier gaat het om twee categorische variabelen."
      - text_en: "Pearson correlation on category codes"
        text_nl: "Pearson-correlatie op categoriecodes"
        correct: false
        feedback_en: "Incorrect. Category codes are not real numbers; Pearson correlation is not appropriate here."
        feedback_nl: "Onjuist. Categoriecodes zijn geen echte getallen; Pearson-correlatie is hier niet geschikt."
      - text_en: "One-sample t-test"
        text_nl: "One-sample t-toets"
        correct: false
        feedback_en: "Incorrect. A one-sample t-test compares one numeric mean with a fixed value; that is not the case here."
        feedback_nl: "Onjuist. Een one-sample t-toets vergelijkt één numeriek gemiddelde met een vaste waarde; dat is hier niet aan de orde."
      - text_en: "Fisher's exact test"
        text_nl: "De exacte toets van Fisher"
        correct: true
        feedback_en: "Correct! Fisher's exact test calculates the p-value exactly and is therefore suitable for sparse 2 × 2 tables where the chi-square approximation fails."
        feedback_nl: "Correct! De exacte toets van Fisher berekent de p-waarde exact en is daarom geschikt voor dunbezette 2 × 2-tabellen waar de chi-kwadraatbenadering tekortschiet."

  - id: 162
    tags: ["Tori"]
    source: "Tori Langill practice test, q62"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Which graph best displays the relationship between waiting time and guest spending?"
    question_nl: "Welke grafiek toont het verband tussen wachttijd en bestedingen van gasten het best?"
    answers:
      - text_en: "Scatterplot"
        text_nl: "Spreidingsdiagram"
        correct: true
        feedback_en: "Correct! Waiting time and spending are both numeric; a scatterplot shows each guest's pair of values and thus the relationship."
        feedback_nl: "Correct! Wachttijd en bestedingen zijn beide numeriek; een spreidingsdiagram toont per gast het paar waarden en zo het verband."
      - text_en: "A single histogram"
        text_nl: "Eén histogram"
        correct: false
        feedback_en: "Incorrect. A histogram shows the distribution of one variable, not the relationship between two."
        feedback_nl: "Onjuist. Een histogram toont de verdeling van één variabele, niet het verband tussen twee."
      - text_en: "Pie chart"
        text_nl: "Cirkeldiagram"
        correct: false
        feedback_en: "Incorrect. A pie chart shows shares of categories; it cannot show the relationship between two numeric variables."
        feedback_nl: "Onjuist. Een cirkeldiagram toont aandelen van categorieën; het kan geen verband tussen twee numerieke variabelen tonen."
      - text_en: "A bar chart of nationality counts"
        text_nl: "Een staafdiagram van de aantallen per nationaliteit"
        correct: false
        feedback_en: "Incorrect. That shows a different (categorical) variable and says nothing about waiting time and spending."
        feedback_nl: "Onjuist. Dat toont een andere (categorische) variabele en zegt niets over wachttijd en bestedingen."

  - id: 163
    tags: ["Tori"]
    source: "Tori Langill practice test, q63"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Why apply a Bonferroni adjustment when making several comparisons?"
    question_nl: "Waarom pas je een Bonferroni-correctie toe als je meerdere vergelijkingen maakt?"
    answers:
      - text_en: "To eliminate all Type II errors"
        text_nl: "Om alle Type II-fouten uit te sluiten"
        correct: false
        feedback_en: "Incorrect. A Bonferroni adjustment actually makes Type II errors more likely (the test becomes stricter); it certainly does not eliminate them."
        feedback_nl: "Onjuist. Een Bonferroni-correctie maakt Type II-fouten juist waarschijnlijker (de toets wordt strenger); ze sluit ze zeker niet uit."
      - text_en: "To limit the familywise risk of Type I error"
        text_nl: "Om de kans op minstens één Type I-fout over alle vergelijkingen te beperken"
        correct: true
        feedback_en: "Correct! Bonferroni divides α by the number of comparisons (or multiplies the p-values), keeping the overall risk of a false positive under control."
        feedback_nl: "Correct! Bonferroni deelt α door het aantal vergelijkingen (of vermenigvuldigt de p-waarden), zodat de totale kans op een vals-positief resultaat onder controle blijft."
      - text_en: "To prove equal variances"
        text_nl: "Om gelijke varianties te bewijzen"
        correct: false
        feedback_en: "Incorrect. Equality of variances is checked with Levene's test, not with Bonferroni."
        feedback_nl: "Onjuist. Gelijkheid van varianties controleer je met de toets van Levene, niet met Bonferroni."
      - text_en: "To make every comparison significant"
        text_nl: "Om elke vergelijking significant te maken"
        correct: false
        feedback_en: "Incorrect. It is the reverse: the adjustment makes it harder to reach significance."
        feedback_nl: "Onjuist. Het is omgekeerd: de correctie maakt het juist moeilijker om significantie te bereiken."

  - id: 164
    tags: ["Tori"]
    source: "Tori Langill practice test, q64"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "What is an important limitation when employees within sampled hotels are very similar?"
    question_nl: "Wat is een belangrijke beperking als de medewerkers binnen de geselecteerde hotels sterk op elkaar lijken?"
    answers:
      - text_en: "All population estimates must equal zero"
        text_nl: "Alle schattingen voor de populatie moeten nul zijn"
        correct: false
        feedback_en: "Incorrect. Similarity within clusters does not make estimates zero; it makes them less precise."
        feedback_nl: "Onjuist. Gelijkenis binnen clusters maakt schattingen niet nul; het maakt ze minder nauwkeurig."
      - text_en: "The sample may contain less independent information than its size suggests"
        text_nl: "De steekproef bevat mogelijk minder onafhankelijke informatie dan de omvang doet vermoeden"
        correct: true
        feedback_en: "Correct! If people within a cluster are similar, each extra person adds little new information. Precision is then lower than in a simple random sample of the same size."
        feedback_nl: "Correct! Als mensen binnen een cluster op elkaar lijken, voegt elke extra persoon weinig nieuwe informatie toe. De nauwkeurigheid is dan lager dan bij een even grote enkelvoudige aselecte steekproef."
      - text_en: "The questionnaire loses face validity automatically"
        text_nl: "De vragenlijst verliest automatisch haar indruksvaliditeit"
        correct: false
        feedback_en: "Incorrect. Face validity concerns the instrument, not the way the sample is drawn."
        feedback_nl: "Onjuist. Indruksvaliditeit gaat over het instrument, niet over de manier waarop de steekproef getrokken wordt."
      - text_en: "Cluster sampling becomes convenience sampling automatically"
        text_nl: "Een clustersteekproef wordt automatisch een gemakssteekproef"
        correct: false
        feedback_en: "Incorrect. The clusters are still selected at random; similarity within clusters does not change the selection method."
        feedback_nl: "Onjuist. De clusters worden nog steeds aselect gekozen; gelijkenis binnen clusters verandert de selectiemethode niet."

  - id: 165
    tags: ["Tori"]
    source: "Tori Langill practice test, q65"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "Two unrelated groups of guests experience different check-in procedures. Which test compares their mean waiting times?"
    question_nl: "Twee onafhankelijke groepen gasten krijgen verschillende incheckprocedures. Welke toets vergelijkt hun gemiddelde wachttijden?"
    answers:
      - text_en: "Independent-samples t-test"
        text_nl: "T-toets voor onafhankelijke steekproeven"
        correct: true
        feedback_en: "Correct! Two different, independent groups and a numeric outcome (waiting time): the independent-samples t-test."
        feedback_nl: "Correct! Twee verschillende, onafhankelijke groepen en een numerieke uitkomst (wachttijd): de t-toets voor onafhankelijke steekproeven."
      - text_en: "One-sample t-test"
        text_nl: "One-sample t-toets"
        correct: false
        feedback_en: "Incorrect. A one-sample t-test compares one group with a fixed value, not two groups with each other."
        feedback_nl: "Onjuist. Een one-sample t-toets vergelijkt één groep met een vaste waarde, geen twee groepen met elkaar."
      - text_en: "Paired-samples t-test"
        text_nl: "Gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. A paired t-test requires the same people (or matched pairs); these groups are unrelated."
        feedback_nl: "Onjuist. Een gepaarde t-toets vereist dezelfde personen (of gematchte paren); deze groepen zijn onafhankelijk."
      - text_en: "Pearson correlation"
        text_nl: "Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Pearson correlation measures the association between two numeric variables, not a difference in means between groups."
        feedback_nl: "Onjuist. Pearson-correlatie meet het verband tussen twee numerieke variabelen, geen verschil in gemiddelden tussen groepen."

  - id: 166
    tags: ["Tori"]
    source: "Tori Langill practice test, q66"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A resort initially uses a guest-experience questionnaire containing ten questions about bedroom furnishings. The questionnaire is easy to read and produces consistent scores when guests complete it again. However, an expert review shows that the resort's definition of guest experience also includes restaurant service, staff interactions, and the check-in process. The researcher revises the questionnaire so that its questions cover rooms, food, staff, and check-in. The team keeps the same response scale and translation process. Their main reason for the revision is to include the important areas that were missing, rather than simply to make the questionnaire look more attractive. Which form of validity is being strengthened?"
    question_nl: "Een resort gebruikt aanvankelijk een vragenlijst over de gastervaring met tien vragen over de inrichting van de slaapkamer. De vragenlijst is makkelijk leesbaar en geeft consistente scores als gasten hem opnieuw invullen. Een beoordeling door experts laat echter zien dat de definitie van gastervaring van het resort ook de service in het restaurant, het contact met het personeel en het incheckproces omvat. De onderzoeker herziet de vragenlijst zodat de vragen kamers, eten, personeel en inchecken dekken. Het team behoudt dezelfde antwoordschaal en hetzelfde vertaalproces. De belangrijkste reden voor de herziening is de ontbrekende belangrijke onderdelen toe te voegen, niet alleen de vragenlijst er aantrekkelijker te laten uitzien. Welke vorm van validiteit wordt versterkt?"
    answers:
      - text_en: "Interrater reliability"
        text_nl: "Interbeoordelaarsbetrouwbaarheid"
        correct: false
        feedback_en: "Incorrect. Interrater reliability concerns agreement between assessors; that plays no role here."
        feedback_nl: "Onjuist. Interbeoordelaarsbetrouwbaarheid gaat over overeenstemming tussen beoordelaars; dat speelt hier geen rol."
      - text_en: "Content validity"
        text_nl: "Inhoudsvaliditeit"
        correct: true
        feedback_en: "Correct! The revision adds the missing domains of the guest experience. Broader coverage of the concept strengthens content validity."
        feedback_nl: "Correct! De herziening voegt de ontbrekende domeinen van de gastervaring toe. Een bredere dekking van het begrip versterkt de inhoudsvaliditeit."
      - text_en: "Face validity only"
        text_nl: "Alleen indruksvaliditeit"
        correct: false
        feedback_en: "Incorrect. The text explicitly says the aim is not just to make it look better, but to cover missing content."
        feedback_nl: "Onjuist. De tekst zegt uitdrukkelijk dat het doel niet alleen een beter uiterlijk is, maar het dekken van ontbrekende inhoud."
      - text_en: "Statistical significance"
        text_nl: "Statistische significantie"
        correct: false
        feedback_en: "Incorrect. Statistical significance is a test result, not a form of validity of a measurement instrument."
        feedback_nl: "Onjuist. Statistische significantie is een toetsresultaat, geen vorm van validiteit van een meetinstrument."

  - id: 167
    tags: ["Tori"]
    source: "Tori Langill practice test, q67"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "Which alternative hypothesis corresponds to a two-sided comparison of mean room prices?"
    question_nl: "Welke alternatieve hypothese hoort bij een tweezijdige vergelijking van gemiddelde kamerprijzen?"
    answers:
      - text_en: "H₁: μA ≠ μB"
        text_nl: "H₁: μA ≠ μB"
        correct: true
        feedback_en: "Correct! Two-sided means a difference in either direction is possible: H₁ uses ≠. Room price is numeric, so μ is used."
        feedback_nl: "Correct! Tweezijdig betekent dat een verschil in beide richtingen mogelijk is: H₁ gebruikt ≠. Kamerprijs is numeriek, dus je gebruikt μ."
      - text_en: "H₁: μA = μB"
        text_nl: "H₁: μA = μB"
        correct: false
        feedback_en: "Incorrect. Equality belongs in H₀, not in H₁."
        feedback_nl: "Onjuist. Gelijkheid hoort in H₀, niet in H₁."
      - text_en: "H₁: πA > πB"
        text_nl: "H₁: πA > πB"
        correct: false
        feedback_en: "Incorrect. π is for proportions; room prices are numeric. Moreover, > is one-sided."
        feedback_nl: "Onjuist. π is voor proporties; kamerprijzen zijn numeriek. Bovendien is > eenzijdig."
      - text_en: "H₁: μA > μB"
        text_nl: "H₁: μA > μB"
        correct: false
        feedback_en: "Incorrect. This is a one-sided alternative (only 'greater than'); a two-sided comparison uses ≠."
        feedback_nl: "Onjuist. Dit is een eenzijdig alternatief (alleen 'groter dan'); een tweezijdige vergelijking gebruikt ≠."

  - id: 168
    tags: ["Tori"]
    source: "Tori Langill practice test, q68"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "A supplier sends a hotel a batch of kitchen products. The delivery arrives late, the packaging has changed, and the purchasing manager is concerned about storage space. A quality inspector tests whether the products meet the required standard. H₀ states that the product meets the quality standard. The inspection does not reject H₀, so the product is approved for use. For this question, assume that the product's true condition is known and that it is actually defective. What type of outcome has occurred?"
    question_nl: "Een leverancier stuurt een hotel een partij keukenproducten. De levering komt te laat, de verpakking is veranderd en de inkoopmanager maakt zich zorgen over de opslagruimte. Een kwaliteitsinspecteur toetst of de producten aan de vereiste norm voldoen. H₀ stelt dat het product aan de kwaliteitsnorm voldoet. De inspectie verwerpt H₀ niet, dus het product wordt goedgekeurd voor gebruik. Veronderstel voor deze vraag dat de werkelijke toestand van het product bekend is en dat het in werkelijkheid defect is. Welk type uitkomst is er opgetreden?"
    answers:
      - text_en: "Correct nonrejection"
        text_nl: "Terecht niet verwerpen"
        correct: false
        feedback_en: "Incorrect. Not rejecting is only correct if H₀ is true. The product is defective, so H₀ is false."
        feedback_nl: "Onjuist. Niet verwerpen is alleen terecht als H₀ waar is. Het product is defect, dus H₀ is onwaar."
      - text_en: "Type II error"
        text_nl: "Type II-fout"
        correct: true
        feedback_en: "Correct! H₀ (meets the standard) is false, because the product is defective, yet H₀ is not rejected: a Type II error. Delivery, packaging and storage space are irrelevant."
        feedback_nl: "Correct! H₀ (voldoet aan de norm) is onwaar, want het product is defect, maar H₀ wordt niet verworpen: een Type II-fout. Levering, verpakking en opslagruimte zijn niet relevant."
      - text_en: "Correct rejection"
        text_nl: "Terecht verwerpen"
        correct: false
        feedback_en: "Incorrect. H₀ was not rejected, so there can be no (correct) rejection."
        feedback_nl: "Onjuist. H₀ werd niet verworpen, dus er kan geen sprake zijn van (terecht) verwerpen."
      - text_en: "Type I error"
        text_nl: "Type I-fout"
        correct: false
        feedback_en: "Incorrect. A Type I error is rejecting a true H₀ (rejecting a good product). Here a defective product was approved."
        feedback_nl: "Onjuist. Een Type I-fout is een ware H₀ verwerpen (een goed product afkeuren). Hier werd juist een defect product goedgekeurd."

  - id: 169
    tags: ["Tori"]
    source: "Tori Langill practice test, q69"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "A hotel researcher is reviewing several studies of relationships between numeric variables. One study concerns waiting time and guest satisfaction, another concerns room price and spending, and two others concern different numeric outcomes. The reports use different sample sizes and contain different p-values, but management's current question is specifically about the strength of the reported linear relationships. The four coefficients are r = −.85, r = .60, r = .25, and r = .00. The manager mistakenly suggests ignoring negative coefficients because they must indicate weak relationships. Considering the coefficients themselves, which one indicates the strongest linear relationship?"
    question_nl: "Een hotelonderzoeker bekijkt verschillende studies naar verbanden tussen numerieke variabelen. Eén studie gaat over wachttijd en gastentevredenheid, een andere over kamerprijs en bestedingen, en twee andere over andere numerieke uitkomsten. De rapporten hebben verschillende steekproefgroottes en verschillende p-waarden, maar de huidige vraag van het management gaat specifiek over de sterkte van de gerapporteerde lineaire verbanden. De vier coëfficiënten zijn r = −.85, r = .60, r = .25 en r = .00. De manager stelt ten onrechte voor negatieve coëfficiënten te negeren, omdat die op zwakke verbanden zouden wijzen. Welke coëfficiënt wijst, op basis van de coëfficiënten zelf, op het sterkste lineaire verband?"
    answers:
      - text_en: "r = .60"
        text_nl: "r = .60"
        correct: false
        feedback_en: "Incorrect. |.60| is smaller than |−.85|. The strength is determined by the absolute value."
        feedback_nl: "Onjuist. |.60| is kleiner dan |−.85|. De sterkte bepaal je met de absolute waarde."
      - text_en: "r = −.85"
        text_nl: "r = −.85"
        correct: true
        feedback_en: "Correct! Compare absolute values: .85 > .60 > .25 > .00. The minus sign only indicates direction (negative), not weakness."
        feedback_nl: "Correct! Vergelijk de absolute waarden: .85 > .60 > .25 > .00. Het minteken geeft alleen de richting aan (negatief), geen zwakte."
      - text_en: "r = .25"
        text_nl: "r = .25"
        correct: false
        feedback_en: "Incorrect. r = .25 is a weak relationship; |−.85| is much stronger."
        feedback_nl: "Onjuist. r = .25 is een zwak verband; |−.85| is veel sterker."
      - text_en: "r = .00"
        text_nl: "r = .00"
        correct: false
        feedback_en: "Incorrect. r = .00 means no linear relationship at all, so it is the weakest."
        feedback_nl: "Onjuist. r = .00 betekent helemaal geen lineair verband, dus dat is juist het zwakst."

  - id: 170
    tags: ["Tori"]
    source: "Tori Langill practice test, q70"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "Which plot directly displays mean estimates with their confidence intervals?"
    question_nl: "Welke grafiek toont gemiddelden direct samen met hun betrouwbaarheidsintervallen?"
    answers:
      - text_en: "A histogram without interval annotations"
        text_nl: "Een histogram zonder aanduiding van intervallen"
        correct: false
        feedback_en: "Incorrect. A histogram shows the distribution of observations, not means with their uncertainty."
        feedback_nl: "Onjuist. Een histogram toont de verdeling van waarnemingen, geen gemiddelden met hun onzekerheid."
      - text_en: "A scatterplot without interval annotations"
        text_nl: "Een spreidingsdiagram zonder aanduiding van intervallen"
        correct: false
        feedback_en: "Incorrect. A scatterplot shows pairs of observations, not estimated means with intervals."
        feedback_nl: "Onjuist. Een spreidingsdiagram toont paren waarnemingen, geen geschatte gemiddelden met intervallen."
      - text_en: "A pie chart of categories"
        text_nl: "Een cirkeldiagram van categorieën"
        correct: false
        feedback_en: "Incorrect. A pie chart shows shares of a whole; it cannot display uncertainty."
        feedback_nl: "Onjuist. Een cirkeldiagram toont aandelen van een geheel; het kan geen onzekerheid weergeven."
      - text_en: "A point estimate plot with labelled confidence interval error bars"
        text_nl: "Een grafiek met puntschattingen en gelabelde foutbalken voor het betrouwbaarheidsinterval"
        correct: true
        feedback_en: "Correct! Points for the means with error bars that are explicitly labelled as confidence intervals show the uncertainty around each estimate."
        feedback_nl: "Correct! Punten voor de gemiddelden met foutbalken die uitdrukkelijk als betrouwbaarheidsinterval zijn gelabeld, tonen de onzekerheid rond elke schatting."

  - id: 171
    tags: ["Tori"]
    source: "Tori Langill practice test, q71"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "H₀ states that a bag contains no prohibited item. A safe bag triggers an alarm. What occurred?"
    question_nl: "H₀ stelt dat een tas geen verboden voorwerp bevat. Een veilige tas laat het alarm afgaan. Wat is er gebeurd?"
    answers:
      - text_en: "Correct nonrejection"
        text_nl: "Terecht niet verwerpen"
        correct: false
        feedback_en: "Incorrect. The alarm means H₀ is rejected, so this is not a nonrejection."
        feedback_nl: "Onjuist. Het alarm betekent dat H₀ verworpen wordt, dus dit is geen niet-verwerping."
      - text_en: "Type II error"
        text_nl: "Type II-fout"
        correct: false
        feedback_en: "Incorrect. A Type II error would be a bag with a prohibited item that does not trigger the alarm (missing a false H₀)."
        feedback_nl: "Onjuist. Een Type II-fout zou een tas mét verboden voorwerp zijn die géén alarm geeft (een onware H₀ missen)."
      - text_en: "Type I error"
        text_nl: "Type I-fout"
        correct: true
        feedback_en: "Correct! The bag is safe (H₀ is true), but the alarm rejects H₀: a false alarm, i.e. a Type I error."
        feedback_nl: "Correct! De tas is veilig (H₀ is waar), maar het alarm verwerpt H₀: een vals alarm, dus een Type I-fout."
      - text_en: "Correct rejection"
        text_nl: "Terecht verwerpen"
        correct: false
        feedback_en: "Incorrect. Rejecting is only correct if H₀ is false; this bag is safe, so H₀ is true."
        feedback_nl: "Onjuist. Verwerpen is alleen terecht als H₀ onwaar is; deze tas is veilig, dus H₀ is waar."

  - id: 172
    tags: ["Tori"]
    source: "Tori Langill practice test, q72"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "A mean plot has error bars explicitly labelled plus or minus one standard deviation. What do these bars describe?"
    question_nl: "Een grafiek met gemiddelden heeft foutbalken die uitdrukkelijk gelabeld zijn als plus of min één standaardafwijking. Wat beschrijven deze balken?"
    answers:
      - text_en: "The probability that the null is true"
        text_nl: "De kans dat de nulhypothese waar is"
        correct: false
        feedback_en: "Incorrect. Error bars do not show the probability of H₀; no graph or test does that."
        feedback_nl: "Onjuist. Foutbalken tonen niet de kans op H₀; geen enkele grafiek of toets doet dat."
      - text_en: "Spread of observations around each mean"
        text_nl: "De spreiding van de waarnemingen rond elk gemiddelde"
        correct: true
        feedback_en: "Correct! Standard deviation bars describe the variability of the data around the mean, not the uncertainty of the mean itself."
        feedback_nl: "Correct! Balken van de standaardafwijking beschrijven de spreiding van de data rond het gemiddelde, niet de onzekerheid van het gemiddelde zelf."
      - text_en: "A 95 percent confidence interval automatically"
        text_nl: "Automatisch een 95%-betrouwbaarheidsinterval"
        correct: false
        feedback_en: "Incorrect. ± 1 SD is not a confidence interval; a CI is based on the standard error and is usually much narrower."
        feedback_nl: "Onjuist. ± 1 SD is geen betrouwbaarheidsinterval; een BI is gebaseerd op de standaardfout en meestal veel smaller."
      - text_en: "The difference between the largest and smallest values"
        text_nl: "Het verschil tussen de grootste en de kleinste waarde"
        correct: false
        feedback_en: "Incorrect. That is the range, not the standard deviation."
        feedback_nl: "Onjuist. Dat is de variatiebreedte (range), niet de standaardafwijking."

  - id: 173
    tags: ["Tori"]
    source: "Tori Langill practice test, q73"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "What does MECE mean for a pair of hypotheses?"
    question_nl: "Wat betekent MECE voor een paar hypothesen?"
    answers:
      - text_en: "They overlap and omit some possibilities"
        text_nl: "Ze overlappen en laten mogelijkheden weg"
        correct: false
        feedback_en: "Incorrect. That is exactly the opposite of MECE."
        feedback_nl: "Onjuist. Dat is precies het tegendeel van MECE."
      - text_en: "Both must use sample means"
        text_nl: "Beide moeten steekproefgemiddelden gebruiken"
        correct: false
        feedback_en: "Incorrect. Hypotheses are about population parameters (μ, π), not about sample means."
        feedback_nl: "Onjuist. Hypothesen gaan over populatieparameters (μ, π), niet over steekproefgemiddelden."
      - text_en: "They do not overlap and together cover all possibilities"
        text_nl: "Ze overlappen niet en dekken samen alle mogelijkheden"
        correct: true
        feedback_en: "Correct! MECE = Mutually Exclusive (no overlap) and Collectively Exhaustive (together complete). Example: H₀: μ ≤ 5 and H₁: μ > 5."
        feedback_nl: "Correct! MECE = Mutually Exclusive (elkaar uitsluitend, geen overlap) en Collectively Exhaustive (samen volledig). Voorbeeld: H₀: μ ≤ 5 en H₁: μ > 5."
      - text_en: "Both must claim equality"
        text_nl: "Beide moeten gelijkheid stellen"
        correct: false
        feedback_en: "Incorrect. Only H₀ contains equality; if both claimed it, they would overlap."
        feedback_nl: "Onjuist. Alleen H₀ bevat gelijkheid; als beide dat zouden stellen, zouden ze overlappen."

  - id: 174
    tags: ["Tori"]
    source: "Tori Langill practice test, q74"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A hotel researcher estimates the population mean time guests spend waiting at reception. She has collected one sample and uses it to calculate both a 95 percent and a 99 percent confidence interval with the same statistical method. The sample mean, sample size, and sample standard deviation are identical in the two calculations. The front-office manager asks whether the higher confidence level will make the result more precise and suggests that the interval should therefore become narrower. The researcher must explain the effect of changing the confidence level alone, without collecting any additional observations. How will the 99 percent interval compare with the 95 percent interval?"
    question_nl: "Een hotelonderzoeker schat de gemiddelde tijd die gasten in de populatie aan de receptie wachten. Ze heeft één steekproef verzameld en berekent daarmee zowel een 95%- als een 99%-betrouwbaarheidsinterval, met dezelfde statistische methode. Het steekproefgemiddelde, de steekproefgrootte en de standaardafwijking zijn in beide berekeningen gelijk. De front-officemanager vraagt of het hogere betrouwbaarheidsniveau het resultaat nauwkeuriger maakt en suggereert dat het interval daarom smaller moet worden. De onderzoeker moet het effect uitleggen van alleen het betrouwbaarheidsniveau veranderen, zonder extra waarnemingen te verzamelen. Hoe verhoudt het 99%-interval zich tot het 95%-interval?"
    answers:
      - text_en: "It is always identical"
        text_nl: "Het is altijd identiek"
        correct: false
        feedback_en: "Incorrect. A different confidence level uses a different critical value, so the interval changes."
        feedback_nl: "Onjuist. Een ander betrouwbaarheidsniveau gebruikt een andere kritieke waarde, dus het interval verandert."
      - text_en: "It is narrower"
        text_nl: "Het is smaller"
        correct: false
        feedback_en: "Incorrect. The opposite: to be more confident of capturing the parameter, you need a wider net."
        feedback_nl: "Onjuist. Het omgekeerde: om met meer zekerheid de parameter te vangen, heb je een breder net nodig."
      - text_en: "Its midpoint must be zero"
        text_nl: "Het midden moet nul zijn"
        correct: false
        feedback_en: "Incorrect. The midpoint stays the sample mean; it does not change with the confidence level."
        feedback_nl: "Onjuist. Het midden blijft het steekproefgemiddelde; dat verandert niet met het betrouwbaarheidsniveau."
      - text_en: "It is wider"
        text_nl: "Het is breder"
        correct: true
        feedback_en: "Correct! Only the confidence level changes. A higher level (99% vs 95%) uses a larger critical value, so the margin of error increases and the interval is wider."
        feedback_nl: "Correct! Alleen het betrouwbaarheidsniveau verandert. Een hoger niveau (99% vs 95%) gebruikt een grotere kritieke waarde, dus de foutmarge neemt toe en het interval wordt breder."

  - id: 175
    tags: ["Tori"]
    source: "Tori Langill practice test, q75"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "Which statement correctly distinguishes r from its p-value?"
    question_nl: "Welke uitspraak maakt correct onderscheid tussen r en de bijbehorende p-waarde?"
    answers:
      - text_en: "r describes linear direction and strength; p assesses evidence against zero population correlation"
        text_nl: "r beschrijft richting en sterkte van het lineaire verband; p beoordeelt het bewijs tegen een populatiecorrelatie van nul"
        correct: true
        feedback_en: "Correct! r is the effect size (direction and strength). The p-value indicates how much evidence there is against H₀: ρ = 0, and depends on sample size as well as r."
        feedback_nl: "Correct! r is de effectgrootte (richting en sterkte). De p-waarde geeft aan hoeveel bewijs er is tegen H₀: ρ = 0, en hangt af van zowel de steekproefgrootte als r."
      - text_en: "A smaller p-value always means a larger absolute r"
        text_nl: "Een kleinere p-waarde betekent altijd een grotere absolute r"
        correct: false
        feedback_en: "Incorrect. Not always: with a large sample, a weak r can still give a very small p-value."
        feedback_nl: "Onjuist. Niet altijd: bij een grote steekproef kan een zwakke r toch een zeer kleine p-waarde geven."
      - text_en: "Both prove causation"
        text_nl: "Beide bewijzen oorzakelijkheid"
        correct: false
        feedback_en: "Incorrect. Neither r nor p proves causation."
        feedback_nl: "Onjuist. Noch r, noch p bewijst oorzakelijkheid."
      - text_en: "r is the sample size; p is the effect size"
        text_nl: "r is de steekproefgrootte; p is de effectgrootte"
        correct: false
        feedback_en: "Incorrect. The sample size is n. r is the effect size; p is not an effect size."
        feedback_nl: "Onjuist. De steekproefgrootte is n. r is de effectgrootte; p is geen effectgrootte."

  - id: 176
    tags: ["Tori"]
    source: "Tori Langill practice test, q76"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A chain surveys 5,000 convenient online volunteers and reports a very narrow confidence interval. What is the best critique?"
    question_nl: "Een keten ondervraagt 5.000 online vrijwilligers die makkelijk te bereiken waren en rapporteert een zeer smal betrouwbaarheidsinterval. Wat is de beste kritiek?"
    answers:
      - text_en: "A large sample guarantees representativeness"
        text_nl: "Een grote steekproef garandeert representativiteit"
        correct: false
        feedback_en: "Incorrect. Size does not fix a biased selection method; a large convenience sample remains biased."
        feedback_nl: "Onjuist. Omvang herstelt een vertekende selectiemethode niet; een grote gemakssteekproef blijft vertekend."
      - text_en: "Confidence intervals correct every form of nonresponse"
        text_nl: "Betrouwbaarheidsintervallen corrigeren voor elke vorm van non-respons"
        correct: false
        feedback_en: "Incorrect. A confidence interval only reflects random sampling variation, not bias from nonresponse or self-selection."
        feedback_nl: "Onjuist. Een betrouwbaarheidsinterval weerspiegelt alleen toevallige steekproefvariatie, geen vertekening door non-respons of zelfselectie."
      - text_en: "A narrow interval does not remove selection bias"
        text_nl: "Een smal interval neemt selectiebias niet weg"
        correct: true
        feedback_en: "Correct! A large n makes the interval narrow (precise), but volunteers can differ systematically from the population. Precision is not the same as unbiasedness."
        feedback_nl: "Correct! Een grote n maakt het interval smal (nauwkeurig), maar vrijwilligers kunnen systematisch verschillen van de populatie. Nauwkeurigheid is niet hetzelfde als zuiverheid."
      - text_en: "A narrow interval proves construct validity"
        text_nl: "Een smal interval bewijst constructvaliditeit"
        correct: false
        feedback_en: "Incorrect. Construct validity concerns whether the right concept is measured; interval width says nothing about it."
        feedback_nl: "Onjuist. Constructvaliditeit gaat over de vraag of het juiste begrip gemeten wordt; de breedte van het interval zegt daar niets over."

  - id: 177
    tags: ["Tori"]
    source: "Tori Langill practice test, q77"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "A researcher creates a contingency table from 100 independent hotel guests. Rows show guest types and columns show whether guests cancelled their bookings. The table contains observed counts, and the researcher must also calculate the counts expected under the null hypothesis of independence. For the particular cell of interest, the row total is 40 and the column total is 30; the grand total is 100. The hotel's average room price is €120, the survey was conducted over four weeks, and the front-office team is planning a repeat survey. What is the expected count for the intersection of that row and column?"
    question_nl: "Een onderzoeker maakt een kruistabel van 100 onafhankelijke hotelgasten. De rijen geven het type gast weer en de kolommen of gasten hun boeking annuleerden. De tabel bevat geobserveerde aantallen, en de onderzoeker moet ook de aantallen berekenen die verwacht worden onder de nulhypothese van onafhankelijkheid. Voor de betreffende cel is het rijtotaal 40 en het kolomtotaal 30; het totaal is 100. De gemiddelde kamerprijs van het hotel is €120, de enquête liep vier weken, en het front-officeteam plant een herhaling. Wat is het verwachte aantal in de cel waar die rij en kolom elkaar kruisen?"
    answers:
      - text_en: "30"
        text_nl: "30"
        correct: false
        feedback_en: "Incorrect. 30 is only the column total; you still have to multiply by the row total and divide by the grand total."
        feedback_nl: "Onjuist. 30 is alleen het kolomtotaal; je moet nog vermenigvuldigen met het rijtotaal en delen door het totaal."
      - text_en: "70"
        text_nl: "70"
        correct: false
        feedback_en: "Incorrect. 70 = 40 + 30 (or 100 − 30); expected counts are calculated by multiplying, not adding."
        feedback_nl: "Onjuist. 70 = 40 + 30 (of 100 − 30); verwachte aantallen bereken je door te vermenigvuldigen, niet door op te tellen."
      - text_en: "40"
        text_nl: "40"
        correct: false
        feedback_en: "Incorrect. 40 is only the row total, not the expected count of the cell."
        feedback_nl: "Onjuist. 40 is alleen het rijtotaal, niet het verwachte aantal in de cel."
      - text_en: "12"
        text_nl: "12"
        correct: true
        feedback_en: "Correct! Expected = (row total × column total) / grand total = 40 × 30 / 100 = 12. Room price and survey duration are irrelevant."
        feedback_nl: "Correct! Verwacht = (rijtotaal × kolomtotaal) / totaal = 40 × 30 / 100 = 12. Kamerprijs en duur van de enquête zijn niet relevant."

  - id: 178
    tags: ["Tori"]
    source: "Tori Langill practice test, q78"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "Two small independent samples have heavily skewed ordinal ratings. The goal is to compare their distributions, with no claim about means. Which test is a reasonable option?"
    question_nl: "Twee kleine onafhankelijke steekproeven hebben sterk scheef verdeelde ordinale beoordelingen. Het doel is hun verdelingen te vergelijken, zonder uitspraak over gemiddelden. Welke toets is een redelijke optie?"
    answers:
      - text_en: "One-sample t-test against zero"
        text_nl: "One-sample t-toets tegen nul"
        correct: false
        feedback_en: "Incorrect. That compares one mean with zero; there are two groups here and no claim about means."
        feedback_nl: "Onjuist. Die vergelijkt één gemiddelde met nul; hier zijn er twee groepen en geen uitspraak over gemiddelden."
      - text_en: "Paired-samples t-test"
        text_nl: "Gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. The samples are independent, not paired, and a t-test is about means."
        feedback_nl: "Onjuist. De steekproeven zijn onafhankelijk, niet gepaard, en een t-toets gaat over gemiddelden."
      - text_en: "Pearson correlation on room labels"
        text_nl: "Pearson-correlatie op kamerlabels"
        correct: false
        feedback_en: "Incorrect. Room labels are not numeric variables, and correlation does not compare two groups."
        feedback_nl: "Onjuist. Kamerlabels zijn geen numerieke variabelen, en correlatie vergelijkt geen twee groepen."
      - text_en: "Mann-Whitney U test"
        text_nl: "Mann-Whitney U-toets"
        correct: true
        feedback_en: "Correct! The Mann-Whitney U test compares two independent groups using ranks; it suits small samples with skewed ordinal data and is not a direct test of means."
        feedback_nl: "Correct! De Mann-Whitney U-toets vergelijkt twee onafhankelijke groepen op basis van rangnummers; hij past bij kleine steekproeven met scheve ordinale data en is geen directe toets van gemiddelden."

  - id: 179
    tags: ["Tori"]
    source: "Tori Langill practice test, q79"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "A hotel chain compares numeric guest satisfaction scores across three unrelated service teams. The teams operate at different properties, and the report includes details about room décor and restaurant opening hours. A valid one-way ANOVA for the population mean satisfaction scores gives p = .01. Management uses α = .05. The researcher has not yet examined any pairwise follow-up comparisons, so there is no information identifying a particular pair of teams that differs. A manager assumes that the significant result means every team differs from every other team. What does the reported overall ANOVA result actually establish at the stated significance level?"
    question_nl: "Een hotelketen vergelijkt numerieke tevredenheidsscores van gasten tussen drie onafhankelijke serviceteams. De teams werken in verschillende vestigingen, en het rapport bevat details over de inrichting van de kamers en de openingstijden van het restaurant. Een geldige eenweg-ANOVA op de gemiddelde tevredenheidsscores in de populatie geeft p = .01. Het management hanteert α = .05. De onderzoeker heeft nog geen paarsgewijze vervolgvergelijkingen bekeken, dus er is geen informatie over welk paar teams verschilt. Een manager neemt aan dat het significante resultaat betekent dat elk team van elk ander team verschilt. Wat toont het gerapporteerde overkoepelende ANOVA-resultaat bij het genoemde significantieniveau werkelijk aan?"
    answers:
      - text_en: "At least one population mean differs"
        text_nl: "Minstens één populatiegemiddelde verschilt"
        correct: true
        feedback_en: "Correct! p = .01 < .05, so H₀ (all means equal) is rejected: at least one mean differs. Which teams differ requires a post-hoc test."
        feedback_nl: "Correct! p = .01 < .05, dus H₀ (alle gemiddelden gelijk) wordt verworpen: minstens één gemiddelde verschilt. Welke teams verschillen, vraagt een post-hoctoets."
      - text_en: "Group variances are equal"
        text_nl: "De groepsvarianties zijn gelijk"
        correct: false
        feedback_en: "Incorrect. ANOVA tests means; equal variances are an assumption, checked with Levene's test."
        feedback_nl: "Onjuist. ANOVA toetst gemiddelden; gelijke varianties zijn een voorwaarde die je met de toets van Levene controleert."
      - text_en: "Every group differs from every other group"
        text_nl: "Elke groep verschilt van elke andere groep"
        correct: false
        feedback_en: "Incorrect. A significant ANOVA does not say that all pairs differ; only a post-hoc test can show which ones do."
        feedback_nl: "Onjuist. Een significante ANOVA zegt niet dat alle paren verschillen; alleen een post-hoctoets kan laten zien welke dat zijn."
      - text_en: "The group with the largest sample mean differs from all others"
        text_nl: "De groep met het hoogste steekproefgemiddelde verschilt van alle andere"
        correct: false
        feedback_en: "Incorrect. That cannot be concluded without pairwise comparisons."
        feedback_nl: "Onjuist. Dat kun je niet concluderen zonder paarsgewijze vergelijkingen."

  - id: 180
    tags: ["Tori"]
    source: "Tori Langill practice test, q80"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A study seeks to compare mean staff competence, but its scale mainly measures confidence rather than competence. What should be addressed first?"
    question_nl: "Een onderzoek wil de gemiddelde competentie van medewerkers vergelijken, maar de schaal meet vooral zelfvertrouwen in plaats van competentie. Wat moet eerst worden aangepakt?"
    answers:
      - text_en: "Which p-value is the smallest"
        text_nl: "Welke p-waarde het kleinst is"
        correct: false
        feedback_en: "Incorrect. A p-value is meaningless if the instrument measures the wrong concept."
        feedback_nl: "Onjuist. Een p-waarde is zinloos als het instrument het verkeerde begrip meet."
      - text_en: "Whether the sample mean can be rounded"
        text_nl: "Of het steekproefgemiddelde afgerond mag worden"
        correct: false
        feedback_en: "Incorrect. Rounding is a detail; the fundamental problem is what is being measured."
        feedback_nl: "Onjuist. Afronden is een detail; het fundamentele probleem is wat er gemeten wordt."
      - text_en: "Whether a pie chart looks attractive"
        text_nl: "Of een cirkeldiagram er aantrekkelijk uitziet"
        correct: false
        feedback_en: "Incorrect. The presentation does not solve a measurement problem."
        feedback_nl: "Onjuist. De presentatie lost een meetprobleem niet op."
      - text_en: "Whether the measure has construct validity for competence"
        text_nl: "Of het meetinstrument constructvaliditeit heeft voor competentie"
        correct: true
        feedback_en: "Correct! If the scale measures confidence instead of competence, construct validity is lacking. A statistically correct analysis cannot repair measurement of the wrong construct."
        feedback_nl: "Correct! Als de schaal zelfvertrouwen meet in plaats van competentie, ontbreekt de constructvaliditeit. Een statistisch correcte analyse kan een meting van het verkeerde construct niet herstellen."

  - id: 181
    tags: ["Tori"]
    source: "Tori Langill practice test, q81"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "Why can cluster sampling be useful for a geographically dispersed hotel chain?"
    question_nl: "Waarom kan een clustersteekproef nuttig zijn voor een geografisch verspreide hotelketen?"
    answers:
      - text_en: "It concentrates data collection in selected locations"
        text_nl: "De dataverzameling wordt geconcentreerd op geselecteerde locaties"
        correct: true
        feedback_en: "Correct! By randomly selecting a few hotels (clusters), you only need to collect data there. That saves travel and you do not need a list of all employees."
        feedback_nl: "Correct! Door een paar hotels (clusters) aselect te kiezen, hoef je alleen daar data te verzamelen. Dat bespaart reistijd en je hebt geen lijst van alle medewerkers nodig."
      - text_en: "It removes differences between hotels"
        text_nl: "Verschillen tussen hotels verdwijnen"
        correct: false
        feedback_en: "Incorrect. Cluster sampling does not remove differences between hotels; such differences can actually reduce precision."
        feedback_nl: "Onjuist. Een clustersteekproef haalt geen verschillen tussen hotels weg; zulke verschillen kunnen de nauwkeurigheid juist verkleinen."
      - text_en: "It guarantees that every hotel is included"
        text_nl: "Het garandeert dat elk hotel wordt opgenomen"
        correct: false
        feedback_en: "Incorrect. Only a sample of hotels is selected, not all of them."
        feedback_nl: "Onjuist. Er wordt slechts een steekproef van hotels gekozen, niet alle hotels."
      - text_en: "It makes random selection unnecessary"
        text_nl: "Aselecte selectie wordt overbodig"
        correct: false
        feedback_en: "Incorrect. The clusters must still be selected at random; otherwise it is no longer a probability sample."
        feedback_nl: "Onjuist. De clusters moeten nog steeds aselect gekozen worden; anders is het geen kanssteekproef meer."

  - id: 182
    tags: ["Tori"]
    source: "Tori Langill practice test, q82"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "A pie chart divides all 100 bookings into three mutually exclusive channels. What can it appropriately show?"
    question_nl: "Een cirkeldiagram verdeelt alle 100 boekingen over drie elkaar uitsluitende kanalen. Wat kan het op een passende manier tonen?"
    answers:
      - text_en: "The linear relationship between price and spending"
        text_nl: "Het lineaire verband tussen prijs en bestedingen"
        correct: false
        feedback_en: "Incorrect. A relationship between two numeric variables calls for a scatterplot, not a pie chart."
        feedback_nl: "Onjuist. Voor een verband tussen twee numerieke variabelen gebruik je een spreidingsdiagram, geen cirkeldiagram."
      - text_en: "Changes in an individual's spending over time"
        text_nl: "Veranderingen in de bestedingen van een individu in de tijd"
        correct: false
        feedback_en: "Incorrect. Changes over time call for a line graph."
        feedback_nl: "Onjuist. Voor veranderingen in de tijd gebruik je een lijndiagram."
      - text_en: "A confidence interval for each mean"
        text_nl: "Een betrouwbaarheidsinterval voor elk gemiddelde"
        correct: false
        feedback_en: "Incorrect. A pie chart cannot display means or uncertainty."
        feedback_nl: "Onjuist. Een cirkeldiagram kan geen gemiddelden of onzekerheid weergeven."
      - text_en: "Each channel's share of total bookings"
        text_nl: "Het aandeel van elk kanaal in het totaal aantal boekingen"
        correct: true
        feedback_en: "Correct! A pie chart shows parts of a whole when the categories are mutually exclusive and together make up the whole, as here."
        feedback_nl: "Correct! Een cirkeldiagram toont delen van een geheel, als de categorieën elkaar uitsluiten en samen het geheel vormen, zoals hier."

  - id: 183
    tags: ["Tori"]
    source: "Tori Langill practice test, q83"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A hotel launches a campaign encouraging guests to book through its own website instead of an intermediary. The campaign includes a new photograph, a breakfast offer, and a change to the wording of the booking button. The researcher records each booking as direct or not direct, and compares the population proportion of direct bookings before and after the campaign. Management's research claim is that this proportion has increased. Although average room revenue is also recorded, it is not the outcome in the current question. The researcher wants hypotheses that do not overlap and that together cover all possibilities. Which MECE pair of hypotheses matches this aim?"
    question_nl: "Een hotel start een campagne die gasten aanmoedigt via de eigen website te boeken in plaats van via een tussenpersoon. De campagne bevat een nieuwe foto, een ontbijtaanbieding en een andere tekst op de boekingsknop. De onderzoeker registreert elke boeking als direct of niet direct en vergelijkt de proportie directe boekingen in de populatie vóór en na de campagne. De bewering van het management is dat deze proportie is gestegen. De gemiddelde kameromzet wordt ook geregistreerd, maar is niet de uitkomst in deze vraag. De onderzoeker wil hypothesen die niet overlappen en samen alle mogelijkheden dekken. Welk MECE-paar hypothesen past bij dit doel?"
    answers:
      - text_en: "H₀: πnew > πold; H₁: πnew > πold"
        text_nl: "H₀: πnew > πold; H₁: πnew > πold"
        correct: false
        feedback_en: "Incorrect. H₀ and H₁ are identical, so they overlap completely."
        feedback_nl: "Onjuist. H₀ en H₁ zijn identiek en overlappen dus volledig."
      - text_en: "H₀: πnew < πold; H₁: πnew > πold"
        text_nl: "H₀: πnew < πold; H₁: πnew > πold"
        correct: false
        feedback_en: "Incorrect. The possibility πnew = πold is missing, so the pair is not collectively exhaustive."
        feedback_nl: "Onjuist. De mogelijkheid πnew = πold ontbreekt, dus het paar is niet collectief uitputtend."
      - text_en: "H₀: πnew ≤ πold; H₁: πnew > πold"
        text_nl: "H₀: πnew ≤ πold; H₁: πnew > πold"
        correct: true
        feedback_en: "Correct! Direct vs not direct is categorical, so use π. The claim (an increase) goes in H₁: πnew > πold; the MECE complement is H₀: πnew ≤ πold."
        feedback_nl: "Correct! Direct vs niet direct is categorisch, dus gebruik je π. De bewering (een stijging) komt in H₁: πnew > πold; het MECE-complement is H₀: πnew ≤ πold."
      - text_en: "H₀: μnew = μold; H₁: μnew > μold"
        text_nl: "H₀: μnew = μold; H₁: μnew > μold"
        correct: false
        feedback_en: "Incorrect. μ is for numeric means (e.g. room revenue), but the outcome is a proportion. In addition, = and > are not exhaustive."
        feedback_nl: "Onjuist. μ is voor numerieke gemiddelden (bijv. kameromzet), maar de uitkomst is een proportie. Bovendien zijn = en > niet uitputtend."

  - id: 184
    tags: ["Tori"]
    source: "Tori Langill practice test, q84"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "Holding sample size and confidence level constant, what happens if the standard deviation increases?"
    question_nl: "Wat gebeurt er als de standaardafwijking toeneemt, terwijl de steekproefgrootte en het betrouwbaarheidsniveau gelijk blijven?"
    answers:
      - text_en: "The confidence interval becomes narrower"
        text_nl: "Het betrouwbaarheidsinterval wordt smaller"
        correct: false
        feedback_en: "Incorrect. The opposite: more spread means more uncertainty, so a wider interval."
        feedback_nl: "Onjuist. Het omgekeerde: meer spreiding betekent meer onzekerheid, dus een breder interval."
      - text_en: "Its confidence level becomes 100 percent"
        text_nl: "Het betrouwbaarheidsniveau wordt 100%"
        correct: false
        feedback_en: "Incorrect. The confidence level is chosen by the researcher and does not change with the spread."
        feedback_nl: "Onjuist. Het betrouwbaarheidsniveau kiest de onderzoeker zelf en verandert niet met de spreiding."
      - text_en: "The confidence interval becomes wider"
        text_nl: "Het betrouwbaarheidsinterval wordt breder"
        correct: true
        feedback_en: "Correct! A larger SD increases the standard error (s/√n) and thus the margin of error, so the interval becomes wider."
        feedback_nl: "Correct! Een grotere SD vergroot de standaardfout (s/√n) en daarmee de foutmarge, dus het interval wordt breder."
      - text_en: "Its bounds become equal"
        text_nl: "De grenzen worden gelijk"
        correct: false
        feedback_en: "Incorrect. Equal bounds would mean an interval with no width (no uncertainty); more spread does the opposite."
        feedback_nl: "Onjuist. Gelijke grenzen zouden een interval zonder breedte betekenen (geen onzekerheid); meer spreiding doet het omgekeerde."

  - id: 185
    tags: ["Tori"]
    source: "Tori Langill practice test, q85"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Which alternative is suitable for a one-way comparison of means when group variances are unequal and the other conditions are met?"
    question_nl: "Welk alternatief is geschikt voor een eenweg-vergelijking van gemiddelden als de groepsvarianties ongelijk zijn en aan de andere voorwaarden is voldaan?"
    answers:
      - text_en: "A paired t-test on unrelated groups"
        text_nl: "Een gepaarde t-toets op onafhankelijke groepen"
        correct: false
        feedback_en: "Incorrect. A paired t-test is only for related measurements, and only for two of them."
        feedback_nl: "Onjuist. Een gepaarde t-toets is alleen voor samenhangende metingen, en alleen voor twee."
      - text_en: "Welch's ANOVA"
        text_nl: "Welch-ANOVA"
        correct: true
        feedback_en: "Correct! Welch's ANOVA compares group means without assuming equal variances."
        feedback_nl: "Correct! De Welch-ANOVA vergelijkt groepsgemiddelden zonder gelijke varianties te veronderstellen."
      - text_en: "Pearson correlation"
        text_nl: "Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Pearson correlation measures an association between two numeric variables, not differences between group means."
        feedback_nl: "Onjuist. Pearson-correlatie meet een verband tussen twee numerieke variabelen, geen verschillen tussen groepsgemiddelden."
      - text_en: "A chi-square independence test"
        text_nl: "Een chi-kwadraattoets op onafhankelijkheid"
        correct: false
        feedback_en: "Incorrect. Chi-square is for categorical variables, not for comparing numeric means."
        feedback_nl: "Onjuist. Chi-kwadraat is voor categorische variabelen, niet voor het vergelijken van numerieke gemiddelden."

  - id: 186
    tags: ["Tori"]
    source: "Tori Langill practice test, q86"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "Mean scores are 74.2 for group A and 70.5 for group B. A valid two-sided t-test gives p = .04. At α = .05, which conclusion is justified?"
    question_nl: "De gemiddelde scores zijn 74,2 voor groep A en 70,5 voor groep B. Een geldige tweezijdige t-toets geeft p = .04. Welke conclusie is gerechtvaardigd bij α = .05?"
    answers:
      - text_en: "The population variances differ significantly"
        text_nl: "De populatievarianties verschillen significant"
        correct: false
        feedback_en: "Incorrect. The t-test compares means, not variances; variances are tested with Levene's test."
        feedback_nl: "Onjuist. De t-toets vergelijkt gemiddelden, geen varianties; varianties toets je met de toets van Levene."
      - text_en: "There is no evidence of a mean difference"
        text_nl: "Er is geen bewijs voor een verschil in gemiddelden"
        correct: false
        feedback_en: "Incorrect. p = .04 < .05, so there is evidence of a difference."
        feedback_nl: "Onjuist. p = .04 < .05, dus er is wél bewijs voor een verschil."
      - text_en: "Group membership is proved to cause higher scores"
        text_nl: "Het is bewezen dat groepslidmaatschap hogere scores veroorzaakt"
        correct: false
        feedback_en: "Incorrect. A significant difference does not prove causation (unless there is a randomised experiment), and nothing is ever 'proved'."
        feedback_nl: "Onjuist. Een significant verschil bewijst geen oorzakelijkheid (tenzij er een gerandomiseerd experiment is), en iets 'bewijzen' kan nooit."
      - text_en: "There is evidence of different population means, with group A's sample mean higher"
        text_nl: "Er is bewijs voor verschillende populatiegemiddelden, waarbij het steekproefgemiddelde van groep A hoger is"
        correct: true
        feedback_en: "Correct! p = .04 < .05: the difference in means is significant. The sample means show the direction (A: 74.2 > B: 70.5)."
        feedback_nl: "Correct! p = .04 < .05: het verschil in gemiddelden is significant. De steekproefgemiddelden tonen de richting (A: 74,2 > B: 70,5)."

  - id: 187
    tags: ["Tori"]
    source: "Tori Langill practice test, q87"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "A valid chi-square test gives p = .02 for employee role and a categorical quality rating. What follows at α = .05?"
    question_nl: "Een geldige chi-kwadraattoets geeft p = .02 voor de functie van medewerkers en een categorische kwaliteitsbeoordeling. Wat volgt hieruit bij α = .05?"
    answers:
      - text_en: "All categories have equal frequencies"
        text_nl: "Alle categorieën hebben gelijke frequenties"
        correct: false
        feedback_en: "Incorrect. That is not what the test of independence examines, and a significant result does not point to equality."
        feedback_nl: "Onjuist. Dat onderzoekt de toets op onafhankelijkheid niet, en een significant resultaat wijst niet op gelijkheid."
      - text_en: "Every role has a different mean quality score"
        text_nl: "Elke functie heeft een andere gemiddelde kwaliteitsscore"
        correct: false
        feedback_en: "Incorrect. The quality rating is categorical, so there are no means; moreover, the test does not say that every role differs."
        feedback_nl: "Onjuist. De kwaliteitsbeoordeling is categorisch, dus er zijn geen gemiddelden; bovendien zegt de toets niet dat elke functie verschilt."
      - text_en: "There is evidence of an association between role and quality category"
        text_nl: "Er is bewijs voor een verband tussen functie en kwaliteitscategorie"
        correct: true
        feedback_en: "Correct! p = .02 < .05: H₀ (independence) is rejected. There is an association, but this does not show causation or which cells contribute most."
        feedback_nl: "Correct! p = .02 < .05: H₀ (onafhankelijkheid) wordt verworpen. Er is een verband, maar dat toont geen oorzakelijkheid en ook niet welke cellen het meest bijdragen."
      - text_en: "Managers are proved to cause poor quality"
        text_nl: "Het is bewezen dat managers slechte kwaliteit veroorzaken"
        correct: false
        feedback_en: "Incorrect. Chi-square shows association, not causation, and says nothing specifically about managers."
        feedback_nl: "Onjuist. Chi-kwadraat toont een verband, geen oorzakelijkheid, en zegt niets specifieks over managers."

  - id: 188
    tags: ["Tori"]
    source: "Tori Langill practice test, q88"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "A staff selection score is compared with employees' later job performance. Which validity evidence is sought?"
    question_nl: "Een selectiescore van medewerkers wordt vergeleken met hun latere functioneren. Naar welk bewijs voor validiteit wordt gezocht?"
    answers:
      - text_en: "Systematic sampling"
        text_nl: "Systematische steekproef"
        correct: false
        feedback_en: "Incorrect. Systematic sampling is a sampling method, not a form of validity."
        feedback_nl: "Onjuist. Een systematische steekproef is een steekproefmethode, geen vorm van validiteit."
      - text_en: "Test-retest reliability only"
        text_nl: "Alleen test-hertestbetrouwbaarheid"
        correct: false
        feedback_en: "Incorrect. Test-retest reliability compares the same measurement twice, not a score with a later outcome."
        feedback_nl: "Onjuist. Test-hertestbetrouwbaarheid vergelijkt dezelfde meting twee keer, niet een score met een latere uitkomst."
      - text_en: "Predictive validity"
        text_nl: "Predictieve validiteit"
        correct: true
        feedback_en: "Correct! Predictive validity: does the score (selection) predict a relevant future outcome (job performance)?"
        feedback_nl: "Correct! Predictieve validiteit: voorspelt de score (selectie) een relevante toekomstige uitkomst (functioneren)?"
      - text_en: "Content validity only"
        text_nl: "Alleen inhoudsvaliditeit"
        correct: false
        feedback_en: "Incorrect. Content validity concerns whether all aspects of a concept are covered, not the prediction of a future outcome."
        feedback_nl: "Onjuist. Inhoudsvaliditeit gaat over de vraag of alle aspecten van een begrip gedekt worden, niet over het voorspellen van een toekomstige uitkomst."

  - id: 189
    tags: ["Tori"]
    source: "Tori Langill practice test, q89"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "A scatterplot shows a strong U-shaped pattern. Why might Pearson r be misleading as a summary of the relationship?"
    question_nl: "Een spreidingsdiagram toont een sterk U-vormig patroon. Waarom kan Pearsons r een misleidende samenvatting van het verband zijn?"
    answers:
      - text_en: "It summarises linear rather than curved association"
        text_nl: "r vat een lineair verband samen, geen gebogen verband"
        correct: true
        feedback_en: "Correct! In a U-shape the descending and ascending parts cancel each other out in a linear summary, so r can be close to 0 despite a strong relationship."
        feedback_nl: "Correct! Bij een U-vorm heffen het dalende en het stijgende deel elkaar op in een lineaire samenvatting, waardoor r dicht bij 0 kan liggen ondanks een sterk verband."
      - text_en: "It always equals one for curved patterns"
        text_nl: "r is altijd één bij gebogen patronen"
        correct: false
        feedback_en: "Incorrect. That is not true; for a U-shape r is usually close to 0."
        feedback_nl: "Onjuist. Dat klopt niet; bij een U-vorm ligt r meestal juist dicht bij 0."
      - text_en: "It is only valid for nominal variables"
        text_nl: "r is alleen geldig voor nominale variabelen"
        correct: false
        feedback_en: "Incorrect. Pearson r is for numeric (interval/ratio) variables, not nominal ones."
        feedback_nl: "Onjuist. Pearsons r is voor numerieke variabelen (interval/ratio), niet voor nominale."
      - text_en: "It measures differences between categorical frequencies"
        text_nl: "r meet verschillen tussen categorische frequenties"
        correct: false
        feedback_en: "Incorrect. That is what chi-square does; r measures linear association between numeric variables."
        feedback_nl: "Onjuist. Dat doet chi-kwadraat; r meet het lineaire verband tussen numerieke variabelen."

  - id: 190
    tags: ["Tori"]
    source: "Tori Langill practice test, q90"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "With the design and sample size fixed, a researcher lowers α from .05 to .01. What is the usual trade-off?"
    question_nl: "Bij een vast design en een vaste steekproefgrootte verlaagt een onderzoeker α van .05 naar .01. Wat is de gebruikelijke afweging?"
    answers:
      - text_en: "Higher Type I error risk and lower Type II error risk"
        text_nl: "Meer kans op een Type I-fout en minder kans op een Type II-fout"
        correct: false
        feedback_en: "Incorrect. This is the wrong way round: a lower α means less risk of a Type I error."
        feedback_nl: "Onjuist. Dit is precies omgekeerd: een lagere α betekent minder kans op een Type I-fout."
      - text_en: "No change in the rejection rule"
        text_nl: "Geen verandering in de beslisregel"
        correct: false
        feedback_en: "Incorrect. The rejection rule does change: you now only reject if p < .01."
        feedback_nl: "Onjuist. De beslisregel verandert wel: je verwerpt nu alleen als p < .01."
      - text_en: "Lower Type I error risk but higher Type II error risk"
        text_nl: "Minder kans op een Type I-fout, maar meer kans op een Type II-fout"
        correct: true
        feedback_en: "Correct! A stricter threshold makes false positives less likely, but real effects are missed more often (lower power, more Type II errors)."
        feedback_nl: "Correct! Een strengere drempel maakt vals-positieve resultaten minder waarschijnlijk, maar echte effecten worden vaker gemist (minder onderscheidingsvermogen, meer Type II-fouten)."
      - text_en: "Both error risks become zero"
        text_nl: "Beide foutkansen worden nul"
        correct: false
        feedback_en: "Incorrect. Error risks can never both be reduced to zero; lowering one usually increases the other."
        feedback_nl: "Onjuist. Foutkansen kunnen nooit allebei nul worden; de ene verlagen verhoogt meestal de andere."

  - id: 191
    tags: ["Tori"]
    source: "Tori Langill practice test, q91"
    topic_en: "Chi-square Test"
    topic_nl: "Chi-kwadraattoets"
    topic_link: "/HRa/week-04/hra2/"
    question_en: "What is H₀ for a chi-square test of independence?"
    question_nl: "Wat is H₀ bij een chi-kwadraattoets op onafhankelijkheid?"
    answers:
      - text_en: "Every cell must have the same count"
        text_nl: "Elke cel moet hetzelfde aantal hebben"
        correct: false
        feedback_en: "Incorrect. Under H₀ the expected counts follow from the row and column totals; they need not be equal."
        feedback_nl: "Onjuist. Onder H₀ volgen de verwachte aantallen uit de rij- en kolomtotalen; ze hoeven niet gelijk te zijn."
      - text_en: "The two variables have a perfect linear relationship"
        text_nl: "De twee variabelen hebben een perfect lineair verband"
        correct: false
        feedback_en: "Incorrect. Chi-square is about categorical association, not a linear relationship, and H₀ states that there is no association."
        feedback_nl: "Onjuist. Chi-kwadraat gaat over een verband tussen categorische variabelen, niet over een lineair verband, en H₀ stelt juist dat er geen verband is."
      - text_en: "The two categorical variables are independent in the population"
        text_nl: "De twee categorische variabelen zijn onafhankelijk in de populatie"
        correct: true
        feedback_en: "Correct! H₀: there is no association between the two categorical variables in the population (independence)."
        feedback_nl: "Correct! H₀: er is geen verband tussen de twee categorische variabelen in de populatie (onafhankelijkheid)."
      - text_en: "The two population means are equal"
        text_nl: "De twee populatiegemiddelden zijn gelijk"
        correct: false
        feedback_en: "Incorrect. That is the H₀ of a t-test; chi-square does not work with means."
        feedback_nl: "Onjuist. Dat is de H₀ van een t-toets; chi-kwadraat werkt niet met gemiddelden."

  - id: 192
    tags: ["Tori"]
    source: "Tori Langill practice test, q92"
    topic_en: "Type I & II Errors"
    topic_nl: "Type I & II Fouten"
    topic_link: "/HRa/week-02/hra1/"
    question_en: "Which statement about the seriousness of Type I and Type II errors is most accurate?"
    question_nl: "Welke uitspraak over de ernst van Type I- en Type II-fouten is het meest juist?"
    answers:
      - text_en: "Type II is always worse"
        text_nl: "Type II is altijd erger"
        correct: false
        feedback_en: "Incorrect. Not always: for example, convicting an innocent person (Type I) is often considered worse."
        feedback_nl: "Onjuist. Niet altijd: zo wordt het veroordelen van een onschuldige (Type I) vaak als erger beschouwd."
      - text_en: "It depends on their consequences in the specific situation"
        text_nl: "Het hangt af van de gevolgen in de specifieke situatie"
        correct: true
        feedback_en: "Correct! Costs and harms determine which error is more serious. Missing unsafe food (Type II) is serious; a false fire alarm (Type I) is mainly annoying."
        feedback_nl: "Correct! Kosten en schade bepalen welke fout ernstiger is. Onveilig eten missen (Type II) is ernstig; een vals brandalarm (Type I) is vooral vervelend."
      - text_en: "They are always equally serious"
        text_nl: "Ze zijn altijd even ernstig"
        correct: false
        feedback_en: "Incorrect. The consequences usually differ per situation, so they are not always equally serious."
        feedback_nl: "Onjuist. De gevolgen verschillen meestal per situatie, dus ze zijn niet altijd even ernstig."
      - text_en: "Type I is always worse"
        text_nl: "Type I is altijd erger"
        correct: false
        feedback_en: "Incorrect. Not always: with a food or safety inspection, missing a real problem (Type II) is often worse."
        feedback_nl: "Onjuist. Niet altijd: bij een voedsel- of veiligheidsinspectie is een echt probleem missen (Type II) vaak erger."

  - id: 193
    tags: ["Tori"]
    source: "Tori Langill practice test, q93"
    topic_en: "Confidence Intervals"
    topic_nl: "Betrouwbaarheidsinterval"
    topic_link: "/HRa/week-03/hra2/"
    question_en: "A hotel compares the mean waiting times of two independent guest groups using a valid two-sided test. The report includes the group sample sizes, a description of the lobby, and the percentage of guests who ordered breakfast. For the mean difference in waiting time, the matching 95 percent confidence interval is [1.2, 4.8] minutes. The null hypothesis for this comparison states that the population mean difference is zero. Management uses α = .05 and asks whether the interval supports rejecting that null. Which conclusion follows from the reported interval and the matching test?"
    question_nl: "Een hotel vergelijkt de gemiddelde wachttijden van twee onafhankelijke groepen gasten met een geldige tweezijdige toets. Het rapport vermeldt de steekproefgroottes, een beschrijving van de lobby en het percentage gasten dat ontbijt bestelde. Het bijbehorende 95%-betrouwbaarheidsinterval voor het verschil in gemiddelde wachttijd is [1,2; 4,8] minuten. De nulhypothese stelt dat het verschil tussen de populatiegemiddelden nul is. Het management hanteert α = .05 en vraagt of het interval het verwerpen van die nulhypothese ondersteunt. Welke conclusie volgt uit het gerapporteerde interval en de bijbehorende toets?"
    answers:
      - text_en: "Fail to reject because both bounds are positive"
        text_nl: "Niet verwerpen omdat beide grenzen positief zijn"
        correct: false
        feedback_en: "Incorrect. Precisely because both bounds are positive, 0 is outside the interval, so H₀ is rejected."
        feedback_nl: "Onjuist. Juist omdat beide grenzen positief zijn, ligt 0 buiten het interval, dus H₀ wordt verworpen."
      - text_en: "Conclude that 95 percent of individual differences lie there"
        text_nl: "Concluderen dat 95% van de individuele verschillen daarbinnen ligt"
        correct: false
        feedback_en: "Incorrect. A confidence interval concerns the population mean difference, not individual differences."
        feedback_nl: "Onjuist. Een betrouwbaarheidsinterval gaat over het verschil tussen populatiegemiddelden, niet over individuele verschillen."
      - text_en: "Conclude that the true difference must be 3 minutes"
        text_nl: "Concluderen dat het ware verschil precies 3 minuten moet zijn"
        correct: false
        feedback_en: "Incorrect. 3 is the midpoint (point estimate); the true difference can be anywhere in the interval (or even outside it)."
        feedback_nl: "Onjuist. 3 is het midden (de puntschatting); het ware verschil kan overal in het interval liggen (of zelfs erbuiten)."
      - text_en: "Reject the null of zero mean difference"
        text_nl: "De nulhypothese van een gemiddeld verschil van nul verwerpen"
        correct: true
        feedback_en: "Correct! The two-sided 95% interval [1.2, 4.8] does not contain 0, so the matching test rejects H₀ at α = .05."
        feedback_nl: "Correct! Het tweezijdige 95%-interval [1,2; 4,8] bevat 0 niet, dus de bijbehorende toets verwerpt H₀ bij α = .05."

  - id: 194
    tags: ["Tori"]
    source: "Tori Langill practice test, q94"
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    question_en: "Pearson correlation is primarily appropriate for which pair of variables?"
    question_nl: "Voor welk paar variabelen is Pearson-correlatie in de eerste plaats geschikt?"
    answers:
      - text_en: "Two numeric interval or ratio variables with a linear relationship"
        text_nl: "Twee numerieke variabelen (interval of ratio) met een lineair verband"
        correct: true
        feedback_en: "Correct! Pearson r summarises the linear association between two numeric (interval/ratio) variables."
        feedback_nl: "Correct! Pearsons r vat het lineaire verband tussen twee numerieke variabelen (interval/ratio) samen."
      - text_en: "One nominal category and one arbitrary ID"
        text_nl: "Eén nominale categorie en één willekeurig ID"
        correct: false
        feedback_en: "Incorrect. Neither variable is numeric in a meaningful way."
        feedback_nl: "Onjuist. Geen van beide variabelen is op een zinvolle manier numeriek."
      - text_en: "Two nominal category labels"
        text_nl: "Twee nominale categorielabels"
        correct: false
        feedback_en: "Incorrect. For two nominal variables, use a crosstab with a chi-square test."
        feedback_nl: "Onjuist. Voor twee nominale variabelen gebruik je een kruistabel met een chi-kwadraattoets."
      - text_en: "Two unordered category codes"
        text_nl: "Twee ongeordende categoriecodes"
        correct: false
        feedback_en: "Incorrect. Codes for unordered categories have no meaningful numeric distance; Pearson r is meaningless there."
        feedback_nl: "Onjuist. Codes voor ongeordende categorieën hebben geen betekenisvolle numerieke afstand; Pearsons r is daar zinloos."

  - id: 195
    tags: ["Tori"]
    source: "Tori Langill practice test, q95"
    topic_en: "Sampling"
    topic_nl: "Steekproef"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "What distinguishes probability sampling from nonprobability sampling?"
    question_nl: "Wat onderscheidt een kanssteekproef van een niet-kanssteekproef?"
    answers:
      - text_en: "Units have known nonzero selection probabilities"
        text_nl: "Eenheden hebben een bekende selectiekans die groter is dan nul"
        correct: true
        feedback_en: "Correct! In probability sampling, selection follows a defined random mechanism, so every unit has a known chance > 0 of being selected."
        feedback_nl: "Correct! Bij een kanssteekproef verloopt de selectie via een vastgelegd toevalsmechanisme, zodat elke eenheid een bekende kans > 0 heeft om geselecteerd te worden."
      - text_en: "It eliminates all measurement error"
        text_nl: "Ze sluit alle meetfouten uit"
        correct: false
        feedback_en: "Incorrect. Sampling method says nothing about measurement error; that concerns the instrument."
        feedback_nl: "Onjuist. De steekproefmethode zegt niets over meetfouten; die gaan over het instrument."
      - text_en: "It always costs less"
        text_nl: "Ze is altijd goedkoper"
        correct: false
        feedback_en: "Incorrect. Probability sampling is often actually more expensive (you need a sampling frame and random selection)."
        feedback_nl: "Onjuist. Een kanssteekproef is vaak juist duurder (je hebt een steekproefkader en aselecte selectie nodig)."
      - text_en: "It always produces a perfectly representative sample"
        text_nl: "Ze levert altijd een perfect representatieve steekproef op"
        correct: false
        feedback_en: "Incorrect. Even a random sample can, by chance, deviate from the population; it is only unbiased on average."
        feedback_nl: "Onjuist. Ook een aselecte steekproef kan door toeval afwijken van de populatie; ze is alleen gemiddeld zuiver."

  - id: 196
    tags: ["Tori"]
    source: "Tori Langill practice test, q96"
    topic_en: "Descriptive Statistics"
    topic_nl: "Beschrijvende Statistiek"
    topic_link: "/HRa/week-03/hra1/"
    question_en: "Which graph best compares the number of guests in different room categories?"
    question_nl: "Welke grafiek vergelijkt het aantal gasten in verschillende kamercategorieën het best?"
    answers:
      - text_en: "Bar chart"
        text_nl: "Staafdiagram"
        correct: true
        feedback_en: "Correct! Room category is categorical; a bar chart compares the frequencies (counts) per category."
        feedback_nl: "Correct! Kamercategorie is categorisch; een staafdiagram vergelijkt de frequenties (aantallen) per categorie."
      - text_en: "An error bar plot of means"
        text_nl: "Een grafiek met gemiddelden en foutbalken"
        correct: false
        feedback_en: "Incorrect. That shows means with uncertainty, not counts per category."
        feedback_nl: "Onjuist. Die toont gemiddelden met onzekerheid, geen aantallen per categorie."
      - text_en: "Scatterplot"
        text_nl: "Spreidingsdiagram"
        correct: false
        feedback_en: "Incorrect. A scatterplot requires two numeric variables."
        feedback_nl: "Onjuist. Een spreidingsdiagram vereist twee numerieke variabelen."
      - text_en: "Histogram"
        text_nl: "Histogram"
        correct: false
        feedback_en: "Incorrect. A histogram is for the distribution of a numeric variable; for categories you use a bar chart (with gaps between the bars)."
        feedback_nl: "Onjuist. Een histogram is voor de verdeling van een numerieke variabele; voor categorieën gebruik je een staafdiagram (met ruimte tussen de staven)."

  - id: 197
    tags: ["Tori"]
    source: "Tori Langill practice test, q97"
    topic_en: "Hypotheses"
    topic_nl: "Hypothesen"
    topic_link: "/HRa/week-01/hra2/"
    question_en: "A researcher measures the euros spent on spicy and non-spicy dishes, rather than the number of orders. Which choice matches the outcome?"
    question_nl: "Een onderzoeker meet het aantal euro's dat aan pittige en niet-pittige gerechten wordt besteed, in plaats van het aantal bestellingen. Welke keuze past bij de uitkomst?"
    answers:
      - text_en: "Compare population means of spending using μ"
        text_nl: "De populatiegemiddelden van de bestedingen vergelijken met μ"
        correct: true
        feedback_en: "Correct! The outcome is spending in euros (numeric), so you compare means with μ. The parameter follows the measured outcome, not the group labels."
        feedback_nl: "Correct! De uitkomst is besteding in euro's (numeriek), dus je vergelijkt gemiddelden met μ. De parameter volgt de gemeten uitkomst, niet de groepslabels."
      - text_en: "Compare preference proportions using π"
        text_nl: "Voorkeursproporties vergelijken met π"
        correct: false
        feedback_en: "Incorrect. π would fit if you counted the number of orders (proportions); here spending in euros is measured."
        feedback_nl: "Onjuist. π zou passen als je het aantal bestellingen telde (proporties); hier wordt de besteding in euro's gemeten."
      - text_en: "Use no parameter because euros cannot be measured"
        text_nl: "Geen parameter gebruiken, omdat euro's niet meetbaar zijn"
        correct: false
        feedback_en: "Incorrect. Euros are perfectly measurable (ratio level)."
        feedback_nl: "Onjuist. Euro's zijn prima meetbaar (rationiveau)."
      - text_en: "Use π because dish labels are categories"
        text_nl: "π gebruiken omdat de gerechten categorieën zijn"
        correct: false
        feedback_en: "Incorrect. The categories (spicy/non-spicy) define the groups, but the outcome is numeric; so μ, not π."
        feedback_nl: "Onjuist. De categorieën (pittig/niet-pittig) bepalen de groepen, maar de uitkomst is numeriek; dus μ, niet π."

  - id: 198
    tags: ["Tori"]
    source: "Tori Langill practice test, q98"
    topic_en: "Reliability & Validity"
    topic_nl: "Betrouwbaarheid & Validiteit"
    topic_link: "/HRa/week-02/hra2/"
    question_en: "Two assessors independently rate the cleanliness of the same room using the same checklist. What does their agreement mainly assess?"
    question_nl: "Twee beoordelaars beoordelen onafhankelijk van elkaar de netheid van dezelfde kamer met dezelfde checklist. Wat beoordeelt hun overeenstemming vooral?"
    answers:
      - text_en: "Confidence level"
        text_nl: "Betrouwbaarheidsniveau"
        correct: false
        feedback_en: "Incorrect. The confidence level belongs to confidence intervals, not to agreement between assessors."
        feedback_nl: "Onjuist. Het betrouwbaarheidsniveau hoort bij betrouwbaarheidsintervallen, niet bij overeenstemming tussen beoordelaars."
      - text_en: "Interrater reliability"
        text_nl: "Interbeoordelaarsbetrouwbaarheid"
        correct: true
        feedback_en: "Correct! Agreement between independent assessors using the same instrument is interrater reliability."
        feedback_nl: "Correct! Overeenstemming tussen onafhankelijke beoordelaars met hetzelfde instrument is interbeoordelaarsbetrouwbaarheid."
      - text_en: "Population representativeness"
        text_nl: "Representativiteit voor de populatie"
        correct: false
        feedback_en: "Incorrect. Representativeness concerns the sample, not agreement between assessors."
        feedback_nl: "Onjuist. Representativiteit gaat over de steekproef, niet over overeenstemming tussen beoordelaars."
      - text_en: "Face validity"
        text_nl: "Indruksvaliditeit"
        correct: false
        feedback_en: "Incorrect. Face validity concerns whether the checklist looks appropriate, not whether assessors agree."
        feedback_nl: "Onjuist. Indruksvaliditeit gaat over de vraag of de checklist geschikt lijkt, niet of beoordelaars het met elkaar eens zijn."

  - id: 199
    tags: ["Tori"]
    source: "Tori Langill practice test, q99"
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "A restaurant group compares mean meal spending across four independent branches. The branches have different numbers of guests in the sample, and their spending variances are unequal. The report also includes branch opening dates and the colour of the menus. With otherwise suitable numeric data, the researcher uses Welch's ANOVA and obtains a significant result. Management now wants to identify which pairs of branch means differ. The follow-up needs to accommodate unequal variances rather than assume that all branches have the same spending variance. Which pairwise follow-up procedure is appropriate?"
    question_nl: "Een restaurantgroep vergelijkt de gemiddelde besteding per maaltijd tussen vier onafhankelijke vestigingen. De vestigingen hebben verschillende aantallen gasten in de steekproef, en de varianties van de bestedingen zijn ongelijk. Het rapport vermeldt ook de openingsdata van de vestigingen en de kleur van de menukaarten. Met verder geschikte numerieke data gebruikt de onderzoeker een Welch-ANOVA en vindt een significant resultaat. Het management wil nu weten welke paren vestigingen verschillen. De vervolgtoets moet rekening houden met ongelijke varianties in plaats van aan te nemen dat alle vestigingen dezelfde variantie hebben. Welke paarsgewijze vervolgprocedure is passend?"
    answers:
      - text_en: "An unadjusted correlation test"
        text_nl: "Een ongecorrigeerde correlatietoets"
        correct: false
        feedback_en: "Incorrect. A correlation test does not compare group means and does not correct for multiple comparisons."
        feedback_nl: "Onjuist. Een correlatietoets vergelijkt geen groepsgemiddelden en corrigeert niet voor meervoudige vergelijkingen."
      - text_en: "Games-Howell"
        text_nl: "Games-Howell"
        correct: true
        feedback_en: "Correct! Games-Howell is the post-hoc test for pairwise comparisons of means with unequal variances and unequal group sizes, the natural follow-up to Welch's ANOVA."
        feedback_nl: "Correct! Games-Howell is de post-hoctoets voor paarsgewijze vergelijkingen van gemiddelden bij ongelijke varianties en ongelijke groepsgroottes, de logische vervolgstap na een Welch-ANOVA."
      - text_en: "Levene's test"
        text_nl: "De toets van Levene"
        correct: false
        feedback_en: "Incorrect. Levene's test only checks whether variances are equal; it does not identify which means differ."
        feedback_nl: "Onjuist. De toets van Levene controleert alleen of varianties gelijk zijn; hij wijst niet aan welke gemiddelden verschillen."
      - text_en: "Tukey HSD under an equal-variance assumption"
        text_nl: "Tukey HSD met de aanname van gelijke varianties"
        correct: false
        feedback_en: "Incorrect. Tukey HSD assumes equal variances, which is explicitly not the case here."
        feedback_nl: "Onjuist. Tukey HSD veronderstelt gelijke varianties, en dat is hier uitdrukkelijk niet het geval."

  - id: 200
    tags: ["Tori"]
    source: "Tori Langill practice test, q100"
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "What does Levene's test assess?"
    question_nl: "Wat beoordeelt de toets van Levene?"
    answers:
      - text_en: "Normality of all observations"
        text_nl: "Normaliteit van alle waarnemingen"
        correct: false
        feedback_en: "Incorrect. Normality is checked with, for example, the Shapiro-Wilk test or a Q-Q plot, not with Levene's test."
        feedback_nl: "Onjuist. Normaliteit controleer je bijvoorbeeld met de Shapiro-Wilk-toets of een Q-Q-plot, niet met de toets van Levene."
      - text_en: "Independence of participants"
        text_nl: "Onafhankelijkheid van de deelnemers"
        correct: false
        feedback_en: "Incorrect. Independence follows from the research design; no test like Levene's checks it."
        feedback_nl: "Onjuist. Onafhankelijkheid volgt uit het onderzoeksdesign; een toets als die van Levene controleert dat niet."
      - text_en: "Equality of group variances"
        text_nl: "Gelijkheid van de groepsvarianties"
        correct: true
        feedback_en: "Correct! Levene's test checks the assumption of equal variances (homogeneity of variance). If p < .05, use Welch's test."
        feedback_nl: "Correct! De toets van Levene controleert de voorwaarde van gelijke varianties (homogeniteit van varianties). Als p < .05, gebruik je de toets van Welch."
      - text_en: "Equality of group means"
        text_nl: "Gelijkheid van de groepsgemiddelden"
        correct: false
        feedback_en: "Incorrect. Means are compared with a t-test or ANOVA; Levene's test is about variances."
        feedback_nl: "Onjuist. Gemiddelden vergelijk je met een t-toets of ANOVA; de toets van Levene gaat over varianties."
