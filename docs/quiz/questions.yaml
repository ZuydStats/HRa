    question_en: "The scatterplot above shows study hours and exam scores of 25 students. How would you describe the correlation?"
    question_nl: "Het spreidingsdiagram hierboven toont studie-uren en tentamencijfers van 25 studenten. Hoe beschrijf je de correlatie?"
    answers:
      - text_en: "Strong negative"
        text_nl: "Sterk negatief"
        correct: false
        feedback_en: "Incorrect. The points go up from left to right: more study hours go with higher scores. That is positive, not negative."
        feedback_nl: "Onjuist. De punten lopen van links naar rechts omhoog: meer studie-uren gaan samen met hogere cijfers. Dat is positief, niet negatief."
      - text_en: "Strong positive"
        text_nl: "Sterk positief"
        correct: true
        feedback_en: "Correct! More study hours go with higher scores (positive) and the points lie close to a straight line (strong). A correlation says nothing about cause and effect."
        feedback_nl: "Correct! Meer studie-uren gaan samen met hogere cijfers (positief) en de punten liggen dicht bij een rechte lijn (sterk). Een correlatie zegt niets over oorzaak en gevolg."
      - text_en: "No correlation"
        text_nl: "Geen correlatie"
        correct: false
        feedback_en: "Incorrect. There is a clear upward pattern; with no correlation the points would form a shapeless cloud."
        feedback_nl: "Onjuist. Er is een duidelijk stijgend patroon; zonder correlatie zouden de punten een vormeloze wolk vormen."
      - text_en: "Weak negative"
        text_nl: "Zwak negatief"
        correct: false
        feedback_en: "Incorrect. The direction is positive (rising) and the points are close to a line, so the relationship is strong, not weak."
        feedback_nl: "Onjuist. De richting is positief (stijgend) en de punten liggen dicht bij een lijn, dus het verband is sterk, niet zwak."

  # bron: Research Skills oefenvragen, slide 51
  - id: 69
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    image: "images/q_correlation_price_bookings.png"
    question_en: "The output above shows the correlation between price per night and number of bookings for 120 hotels. Which conclusion is correct?"
    question_nl: "De output hierboven toont de correlatie tussen de prijs per nacht en het aantal boekingen van 120 hotels. Welke conclusie is juist?"
    answers:
      - text_en: "There is a significant positive correlation"
        text_nl: "Er is een significante positieve correlatie"
        correct: false
        feedback_en: "Incorrect. r = −0.620 is negative: higher prices go with fewer bookings."
        feedback_nl: "Onjuist. r = −0,620 is negatief: hogere prijzen gaan samen met minder boekingen."
      - text_en: "A higher price causes fewer bookings"
        text_nl: "Een hogere prijs veroorzaakt minder boekingen"
        correct: false
        feedback_en: "Incorrect. Too strong: a correlation shows that variables go together, not that one causes the other."
        feedback_nl: "Onjuist. Te sterk geformuleerd: een correlatie toont samenhang, geen oorzaak."
      - text_en: "A significant, fairly strong negative correlation: higher prices go with fewer bookings"
        text_nl: "Een significante, vrij sterke negatieve correlatie: hogere prijzen gaan samen met minder boekingen"
        correct: true
        feedback_en: "Correct! r = −0.62: negative (higher price, fewer bookings) and fairly strong. p < 0.001: significant."
        feedback_nl: "Correct! r = −0,62: negatief (hogere prijs, minder boekingen) en vrij sterk. p < 0,001: significant."
      - text_en: "There is no correlation, because r is negative"
        text_nl: "Er is geen correlatie, omdat r negatief is"
        correct: false
        feedback_en: "Incorrect. A negative r means a negative relationship, not 'no relationship'. No correlation would be r close to 0."
        feedback_nl: "Onjuist. Een negatieve r betekent een negatief verband, niet 'geen verband'. Geen correlatie zou r dicht bij 0 zijn."

  # bron: Research Skills oefenvragen, slide 52
  - id: 70
    topic_en: "Correlation Analysis"
    topic_nl: "Correlatieanalyse"
    topic_link: "/HRa/week-05/hra1/"
    image: "images/q_scatter_workload.png"
    question_en: "You want to compute Pearson's r for the two variables in the scatterplot above. Is that appropriate?"
    question_nl: "Je wilt voor de twee variabelen in het spreidingsdiagram hierboven Pearsons r berekenen. Is dat terecht?"
    answers:
      - text_en: "Yes, there is a strong positive correlation"
        text_nl: "Ja, er is een sterke positieve correlatie"
        correct: false
        feedback_en: "Incorrect. Performance first rises and then falls; the relationship is not positive over the whole range."
        feedback_nl: "Onjuist. De prestatie stijgt eerst en daalt daarna; het verband is niet over het hele bereik positief."
      - text_en: "Yes, both variables are measured at ratio level"
        text_nl: "Ja, beide variabelen zijn op rationiveau gemeten"
        correct: false
        feedback_en: "Incorrect. The measurement level is fine, but that is not enough: the assumption of linearity must also hold."
        feedback_nl: "Onjuist. Het meetniveau klopt wel, maar dat is niet genoeg: ook de aanname van lineariteit moet kloppen."
      - text_en: "No, both variables are nominal"
        text_nl: "Nee, beide variabelen zijn nominaal"
        correct: false
        feedback_en: "Incorrect. Hours per week and a performance score are numerical variables, not nominal."
        feedback_nl: "Onjuist. Uren per week en een prestatiescore zijn numerieke variabelen, niet nominaal."
      - text_en: "No, the relationship is not linear"
        text_nl: "Nee, het verband is niet lineair"
        correct: true
        feedback_en: "Correct! Pearson's r only measures linear relationships. Here the relationship is an inverted U: performance rises up to about 40 hours, then falls. Pearson's r would be close to 0 and wrongly suggest 'no relationship'."
        feedback_nl: "Correct! Pearsons r meet alleen lineaire verbanden. Hier is het verband een omgekeerde U: tot ongeveer 40 uur stijgt de prestatie, daarna daalt ze. Pearsons r zou dicht bij 0 uitkomen en ten onrechte 'geen verband' suggereren."

  # ── T-TOETS ───────────────────────────────────────────────────────────────

  # bron: Research Skills oefenvragen, slide 39
  - id: 71
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    image: "images/q_ttest_time_on_site.png"
    question_en: "A website compared the time visitors spent on the site (minutes) for a new design (n = 40, M = 12.4) and the old design (n = 40, M = 10.8). Based on the output above, which conclusion is correct (α = 0.05)?"
    question_nl: "Een website vergeleek de tijd die bezoekers op de site doorbrachten (minuten) bij een nieuw ontwerp (n = 40, M = 12,4) en het oude ontwerp (n = 40, M = 10,8). Welke conclusie is juist op basis van de output hierboven (α = 0,05)?"
    answers:
      - text_en: "The variances differ, so the t-test cannot be used"
        text_nl: "De varianties verschillen, dus de t-toets mag niet worden gebruikt"
        correct: false
        feedback_en: "Incorrect. Levene's test gives p = 0.519 > 0.05, so the variances may be considered equal. Even if they differed, you would use Welch's t, not drop the t-test."
        feedback_nl: "Onjuist. De toets van Levene geeft p = 0,519 > 0,05, dus de varianties mogen als gelijk worden beschouwd. En ook als ze verschilden, gebruik je de Welch-toets in plaats van de t-toets te laten vallen."
      - text_en: "Levene's test is not significant, and the mean time differs significantly"
        text_nl: "De toets van Levene is niet significant, en de gemiddelde tijd verschilt significant"
        correct: true
        feedback_en: "Correct! Levene: p = 0.519 > 0.05, so equal variances are assumed and you read Student's t. t(78) = 2.20, p = 0.031 < 0.05: the difference in mean time is significant."
        feedback_nl: "Correct! Levene: p = 0,519 > 0,05, dus de varianties mogen als gelijk worden beschouwd en je leest de Student's t af. t(78) = 2,20, p = 0,031 < 0,05: het verschil in gemiddelde tijd is significant."
      - text_en: "There is no significant difference, because p < 0.05"
        text_nl: "Er is geen significant verschil, omdat p < 0,05"
        correct: false
        feedback_en: "Incorrect. p < 0.05 means the difference is significant, not that it is absent."
        feedback_nl: "Onjuist. p < 0,05 betekent juist dat het verschil significant is, niet dat het er niet is."
      - text_en: "Every visitor stays exactly 1.6 minutes longer with the new design"
        text_nl: "Elke bezoeker blijft met het nieuwe ontwerp precies 1,6 minuut langer"
        correct: false
        feedback_en: "Incorrect. 1.6 minutes is the difference between the group means, not the difference for every individual visitor."
        feedback_nl: "Onjuist. 1,6 minuut is het verschil tussen de groepsgemiddelden, niet het verschil voor elke individuele bezoeker."

  # bron: Research Skills oefenvragen, slide 40
  - id: 72
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "What does Levene's test check in an independent-samples t-test?"
    question_nl: "Wat controleert de toets van Levene bij een onafhankelijke t-toets?"
    answers:
      - text_en: "Whether the groups are normally distributed"
        text_nl: "Of de groepen normaal verdeeld zijn"
        correct: false
        feedback_en: "Incorrect. Normality is checked with, for example, the Shapiro-Wilk test, not with Levene's test."
        feedback_nl: "Onjuist. Normaliteit controleer je bijvoorbeeld met de Shapiro-Wilk-toets, niet met de toets van Levene."
      - text_en: "Whether the group means are equal"
        text_nl: "Of de groepsgemiddelden gelijk zijn"
        correct: false
        feedback_en: "Incorrect. Whether the means differ is tested by the t-test itself."
        feedback_nl: "Onjuist. Of de gemiddelden verschillen, toetst de t-toets zelf."
      - text_en: "Whether the samples are large enough"
        text_nl: "Of de steekproeven groot genoeg zijn"
        correct: false
        feedback_en: "Incorrect. Levene's test says nothing about sample size."
        feedback_nl: "Onjuist. De toets van Levene zegt niets over de steekproefgrootte."
      - text_en: "Whether the variances of the groups are equal"
        text_nl: "Of de varianties van de groepen gelijk zijn"
        correct: true
        feedback_en: "Correct! Levene's test checks the assumption of equal variances (homogeneity of variances). It determines whether you read Student's t or Welch's t."
        feedback_nl: "Correct! De toets van Levene toetst de aanname van gelijke varianties (homogeniteit van varianties). Die bepaalt of je de Student's t of de Welch-toets afleest."

  # bron: Research Skills oefenvragen, slide 41
  - id: 73
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "The reaction time of 30 cabin crew members is measured before and after a night flight. Which test should you use to compare the two measurements?"
    question_nl: "De reactietijd van 30 cabinemedewerkers wordt gemeten voor en na een nachtvlucht. Welke toets gebruik je om de twee metingen te vergelijken?"
    answers:
      - text_en: "An independent-samples t-test"
        text_nl: "Een onafhankelijke t-toets"
        correct: false
        feedback_en: "Incorrect. An independent t-test compares two different groups of people. Here the same people are measured twice."
        feedback_nl: "Onjuist. Een onafhankelijke t-toets vergelijkt twee verschillende groepen mensen. Hier worden dezelfde mensen twee keer gemeten."
      - text_en: "A paired-samples t-test"
        text_nl: "Een gepaarde t-toets"
        correct: true
        feedback_en: "Correct! The same people are measured twice, so the measurements are linked. You compare the before–after difference per person."
        feedback_nl: "Correct! Dezelfde personen worden twee keer gemeten; de metingen zijn dus aan elkaar gekoppeld. Je vergelijkt per persoon het verschil tussen voor en na."
      - text_en: "A chi-square test"
        text_nl: "Een chi-kwadraattoets"
        correct: false
        feedback_en: "Incorrect. A chi-square test is for two categorical variables. Reaction time is a ratio variable."
        feedback_nl: "Onjuist. Een chi-kwadraattoets is voor twee categorische variabelen. Reactietijd is een ratiovariabele."
      - text_en: "A one-way ANOVA"
        text_nl: "Een eenweg-ANOVA"
        correct: false
        feedback_en: "Incorrect. A one-way ANOVA compares three or more independent groups. Here there are two linked measurements."
        feedback_nl: "Onjuist. Een eenweg-ANOVA vergelijkt drie of meer onafhankelijke groepen. Hier zijn er twee gekoppelde metingen."

  # bron: Research Skills oefenvragen, slide 42
  - id: 74
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "You compare the average tip of waiters who introduce themselves by name with the average tip of other waiters. Which test fits?"
    question_nl: "Je vergelijkt de gemiddelde fooi van obers die zich met hun naam voorstellen met de gemiddelde fooi van andere obers. Welke toets past hierbij?"
    answers:
      - text_en: "An independent-samples t-test"
        text_nl: "Een onafhankelijke t-toets"
        correct: true
        feedback_en: "Correct! You compare the mean of a ratio variable (tip in euros) between two different groups of people. The groups are independent: each waiter is in only one group."
        feedback_nl: "Correct! Je vergelijkt het gemiddelde van een ratiovariabele (fooi in euro's) tussen twee verschillende groepen mensen. De groepen zijn onafhankelijk: elke ober zit in maar één groep."
      - text_en: "A paired-samples t-test"
        text_nl: "Een gepaarde t-toets"
        correct: false
        feedback_en: "Incorrect. A paired t-test is for linked measurements (e.g. the same people twice). These are two separate groups of waiters."
        feedback_nl: "Onjuist. Een gepaarde t-toets is voor gekoppelde metingen (bijv. dezelfde mensen twee keer). Dit zijn twee aparte groepen obers."
      - text_en: "A chi-square test"
        text_nl: "Een chi-kwadraattoets"
        correct: false
        feedback_en: "Incorrect. A chi-square test is for two categorical variables. The tip is an amount in euros, so you compare means."
        feedback_nl: "Onjuist. Een chi-kwadraattoets is voor twee categorische variabelen. De fooi is een bedrag in euro's, dus je vergelijkt gemiddelden."
      - text_en: "A Pearson correlation"
        text_nl: "Een Pearson-correlatie"
        correct: false
        feedback_en: "Incorrect. Pearson's r requires two interval/ratio variables. 'Introduces himself by name (yes/no)' is a grouping variable."
        feedback_nl: "Onjuist. Pearsons r vraagt twee interval-/ratiovariabelen. 'Stelt zich voor met naam (ja/nee)' is een groepsvariabele."

  # bron: Research Skills oefenvragen, slide 43
  - id: 75
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    image: "images/q_paired_ttest_training.png"
    question_en: "25 employees rated their job satisfaction (1–10) before and after a training course. Based on the output above, which statement is correct (α = 0.05)?"
    question_nl: "25 medewerkers beoordeelden hun werktevredenheid (1–10) voor en na een training. Welke uitspraak is juist op basis van de output hierboven (α = 0,05)?"
    answers:
      - text_en: "Satisfaction is significantly higher after the training"
        text_nl: "De tevredenheid is na de training significant hoger"
        correct: true
        feedback_en: "Correct! t(24) = −2.80, p = 0.010 < 0.05: significant. The difference is computed as 'before − after' = 6.20 − 6.90 = −0.70, so a negative difference means the score after the training is higher."
        feedback_nl: "Correct! t(24) = −2,80, p = 0,010 < 0,05: significant. Het verschil is berekend als 'voor − na' = 6,20 − 6,90 = −0,70. Een negatief verschil betekent dus dat de score ná de training hoger is."
      - text_en: "Satisfaction is significantly lower after the training"
        text_nl: "De tevredenheid is na de training significant lager"
        correct: false
        feedback_en: "Incorrect. The negative t comes from 'before − after'. The means show 6.90 after versus 6.20 before: satisfaction went up."
        feedback_nl: "Onjuist. De negatieve t komt van 'voor − na'. De gemiddelden tonen 6,90 na tegenover 6,20 voor: de tevredenheid is gestegen."
      - text_en: "There is no significant difference, because t is negative"
        text_nl: "Er is geen significant verschil, omdat t negatief is"
        correct: false
        feedback_en: "Incorrect. The sign of t tells you the direction, not the significance. p = 0.010 < 0.05, so the difference is significant."
        feedback_nl: "Onjuist. Het teken van t zegt iets over de richting, niet over de significantie. p = 0,010 < 0,05, dus het verschil is significant."
      - text_en: "An independent-samples t-test should have been used"
        text_nl: "Er had een onafhankelijke t-toets gebruikt moeten worden"
        correct: false
        feedback_en: "Incorrect. The same people were measured twice, so a paired-samples t-test is correct."
        feedback_nl: "Onjuist. Dezelfde personen zijn twee keer gemeten, dus een gepaarde t-toets is juist."

  # bron: Research Skills oefenvragen, slide 44
  - id: 76
    topic_en: "T-test"
    topic_nl: "T-toets"
    topic_link: "/HRa/week-05/hra2/"
    question_en: "In an independent-samples t-test, Levene's test gives p = 0.002. What should you do?"
    question_nl: "Bij een onafhankelijke t-toets geeft de toets van Levene p = 0,002. Wat doe je?"
    answers:
      - text_en: "Stop: no t-test can be performed"
        text_nl: "Stoppen: er kan geen t-toets worden uitgevoerd"
        correct: false
        feedback_en: "Incorrect. Unequal variances do not make the t-test unusable; there is a version that does not assume equal variances."
        feedback_nl: "Onjuist. Ongelijke varianties maken de t-toets niet onbruikbaar; er is een versie die geen gelijke varianties aanneemt."
      - text_en: "Use a paired-samples t-test instead"
        text_nl: "In plaats daarvan een gepaarde t-toets gebruiken"
        correct: false
        feedback_en: "Incorrect. Whether a test is paired depends on the design (same people measured twice), not on Levene's test."
        feedback_nl: "Onjuist. Of een toets gepaard is, hangt af van het design (dezelfde mensen twee keer gemeten), niet van de toets van Levene."
      - text_en: "Report Welch's t-test (equal variances not assumed)"
        text_nl: "De Welch-toets rapporteren (gelijke varianties niet aangenomen)"
        correct: true
        feedback_en: "Correct! p = 0.002 < 0.05: the variances differ significantly. You then report the version that does not assume equal variances: Welch's t-test (in SPSS the row 'Equal variances not assumed')."
        feedback_nl: "Correct! p = 0,002 < 0,05: de varianties verschillen significant. Je rapporteert dan de versie die geen gelijke varianties aanneemt: de Welch-toets (in SPSS de regel 'Equal variances not assumed')."
      - text_en: "Use a chi-square test instead"
        text_nl: "In plaats daarvan een chi-kwadraattoets gebruiken"
        correct: false
        feedback_en: "Incorrect. A chi-square test is for two categorical variables; the dependent variable here is still an interval/ratio variable."
        feedback_nl: "Onjuist. Een chi-kwadraattoets is voor twee categorische variabelen; de afhankelijke variabele is hier nog steeds een interval-/ratiovariabele."

  # ── ANOVA ─────────────────────────────────────────────────────────────────

  - id: 77
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Which of the following statements on an ANOVA test is false?"
    question_nl: "Welke van de volgende uitspraken over een ANOVA-toets is onjuist?"
    answers:
      - text_en: "We use an ANOVA when we want to test for the differences in the average scores for at least three distinct groups"
        text_nl: "We gebruiken een ANOVA als we de verschillen in gemiddelde scores voor minimaal drie afzonderlijke groepen willen toetsen"
        correct: false
        feedback_en: "This statement is TRUE. ANOVA is used when comparing means of 3 or more groups."
        feedback_nl: "Deze uitspraak is WAAR. ANOVA wordt gebruikt bij het vergelijken van gemiddelden van 3 of meer groepen."
      - text_en: "Using an ANOVA to compare the means of two groups is equal to executing an independent samples T-test"
        text_nl: "Een ANOVA gebruiken om de gemiddelden van twee groepen te vergelijken is gelijk aan het uitvoeren van een onafhankelijke steekproef t-toets"
        correct: false
        feedback_en: "This statement is TRUE. With two groups, ANOVA and an independent samples t-test give the same result (F = t²)."
        feedback_nl: "Deze uitspraak is WAAR. Met twee groepen geven ANOVA en een onafhankelijke t-toets hetzelfde resultaat (F = t²)."
      - text_en: "Executing an ANOVA without a post-hoc test such as the Bonferroni or the Games-Howell is useless"
        text_nl: "Een ANOVA uitvoeren zonder een post-hoctoets zoals de Bonferroni of de Games-Howell is zinloos"
        correct: true
        feedback_en: "Correct — this IS false. ANOVA tells you that at least one group differs, which IS useful information. Post-hoc tests tell you WHICH groups differ, but ANOVA alone is not useless."
        feedback_nl: "Correct — dit IS onjuist. ANOVA vertelt je dat minstens één groep verschilt, wat WEL nuttige informatie is. Post-hoctoetsen vertellen je WELKE groepen verschillen, maar ANOVA alleen is niet zinloos."
      - text_en: "The Welch-test is used to substitute the ANOVA F-test when the assumption of homogeneity of variance is violated"
        text_nl: "De Welch-toets wordt gebruikt als vervanging van de ANOVA F-toets wanneer de aanname van homogeniteit van variantie is geschonden"
        correct: false
        feedback_en: "This statement is TRUE. When Levene's test shows unequal variances, the Welch ANOVA is the robust alternative."
        feedback_nl: "Deze uitspraak is WAAR. Als Levene's toets ongelijke varianties aantoont, is de Welch ANOVA het robuuste alternatief."

  # bron: Research Skills oefenvragen, slide 46
  - id: 78
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    image: "images/q_anova_locations.png"
    question_en: "Guest satisfaction (1–10) was compared between three hotel locations. Based on the output above, which conclusion is correct (α = 0.05)?"
    question_nl: "De gasttevredenheid (1–10) is vergeleken tussen drie hotellocaties. Welke conclusie is juist op basis van de output hierboven (α = 0,05)?"
    answers:
      - text_en: "All three locations differ significantly from each other"
        text_nl: "Alle drie de locaties verschillen significant van elkaar"
        correct: false
        feedback_en: "Incorrect. An ANOVA only tells you that at least one group mean differs, not which groups differ from each other. For that you need a post-hoc test."
        feedback_nl: "Onjuist. Een ANOVA zegt alleen dat minstens één groepsgemiddelde afwijkt, niet welke groepen precies van elkaar verschillen. Daarvoor heb je een post-hoctoets nodig."
      - text_en: "The mean satisfaction differs significantly for at least one location"
        text_nl: "De gemiddelde tevredenheid verschilt significant voor minstens één locatie"
        correct: true
        feedback_en: "Correct! F(2, 87) = 10.72, p < 0.001: H0 (all means equal) is rejected. So at least one location's mean differs from the others."
        feedback_nl: "Correct! F(2, 87) = 10,72, p < 0,001: H0 (alle gemiddelden gelijk) wordt verworpen. Minstens één locatie heeft dus een afwijkend gemiddelde."
      - text_en: "There is no significant difference between the locations"
        text_nl: "Er is geen significant verschil tussen de locaties"
        correct: false
        feedback_en: "Incorrect. p < 0.001 is smaller than 0.05, so there is a significant difference."
        feedback_nl: "Onjuist. p < 0,001 is kleiner dan 0,05, dus er is wel een significant verschil."
      - text_en: "The airport hotel has the highest satisfaction"
        text_nl: "Het luchthavenhotel heeft de hoogste tevredenheid"
        correct: false
        feedback_en: "Incorrect. The airport hotel has the lowest mean (6.50); the beach hotel has the highest (8.10)."
        feedback_nl: "Onjuist. Het luchthavenhotel heeft juist het laagste gemiddelde (6,50); het strandhotel het hoogste (8,10)."

  # bron: Research Skills oefenvragen, slide 47
  - id: 79
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    image: "images/q_anova_posthoc.png"
    question_en: "After the ANOVA of the previous question, a Tukey post-hoc test was run (see the output above). Which pairs of locations differ significantly (α = 0.05)?"
    question_nl: "Na de ANOVA van de vorige vraag is een post-hoctoets van Tukey uitgevoerd (zie de output hierboven). Welke paren locaties verschillen significant (α = 0,05)?"
    answers:
      - text_en: "Only Beach – Airport"
        text_nl: "Alleen Beach – Airport"
        correct: false
        feedback_en: "Incorrect. City – Beach is also significant: p tukey = 0.029 < 0.05."
        feedback_nl: "Onjuist. City – Beach is ook significant: p tukey = 0,029 < 0,05."
      - text_en: "All three pairs"
        text_nl: "Alle drie de paren"
        correct: false
        feedback_en: "Incorrect. City – Airport has p tukey = 0.112 > 0.05, so that pair does not differ significantly."
        feedback_nl: "Onjuist. City – Airport heeft p tukey = 0,112 > 0,05, dus dat paar verschilt niet significant."
      - text_en: "City – Beach and Beach – Airport"
        text_nl: "City – Beach en Beach – Airport"
        correct: true
        feedback_en: "Correct! Look at the 'p tukey' column: City – Beach (p = 0.029) and Beach – Airport (p < 0.001) are below 0.05; City – Airport (p = 0.112) is not. The sign of the mean difference only gives the direction."
        feedback_nl: "Correct! Kijk naar de kolom 'p tukey': City – Beach (p = 0,029) en Beach – Airport (p < 0,001) zijn kleiner dan 0,05; City – Airport (p = 0,112) niet. Het teken van het gemiddelde verschil geeft alleen de richting."
      - text_en: "Only City – Airport"
        text_nl: "Alleen City – Airport"
        correct: false
        feedback_en: "Incorrect. City – Airport is precisely the only pair that is not significant (p = 0.112)."
        feedback_nl: "Onjuist. City – Airport is juist het enige paar dat níét significant is (p = 0,112)."

  # bron: Research Skills oefenvragen, slide 48
  - id: 80
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Why do you perform a post-hoc test after a significant ANOVA?"
    question_nl: "Waarom voer je na een significante ANOVA een post-hoctoets uit?"
    answers:
      - text_en: "To check whether the variances are equal"
        text_nl: "Om te controleren of de varianties gelijk zijn"
        correct: false
        feedback_en: "Incorrect. Equal variances are checked with Levene's test, before interpreting the ANOVA."
        feedback_nl: "Onjuist. Gelijke varianties controleer je met de toets van Levene, vóór je de ANOVA interpreteert."
      - text_en: "To increase the sample size"
        text_nl: "Om de steekproef te vergroten"
        correct: false
        feedback_en: "Incorrect. A post-hoc test uses the same data; it does not add observations."
        feedback_nl: "Onjuist. Een post-hoctoets gebruikt dezelfde data; er komen geen waarnemingen bij."
      - text_en: "To check whether the data are normally distributed"
        text_nl: "Om te controleren of de data normaal verdeeld zijn"
        correct: false
        feedback_en: "Incorrect. Normality is checked with, for example, the Shapiro-Wilk test."
        feedback_nl: "Onjuist. Normaliteit controleer je bijvoorbeeld met de Shapiro-Wilk-toets."
      - text_en: "To find out which groups differ from each other"
        text_nl: "Om te achterhalen welke groepen van elkaar verschillen"
        correct: true
        feedback_en: "Correct! A significant ANOVA only says that at least one group differs. A post-hoc test (e.g. Tukey, Bonferroni or Games-Howell) compares the groups pairwise and corrects for the number of comparisons."
        feedback_nl: "Correct! Een significante ANOVA vertelt alleen dat minstens één groep afwijkt. Een post-hoctoets (bijvoorbeeld Tukey, Bonferroni of Games-Howell) vergelijkt de groepen paarsgewijs en corrigeert daarbij voor het aantal vergelijkingen."

  # bron: Research Skills oefenvragen, slide 49
  - id: 81
    topic_en: "ANOVA"
    topic_nl: "ANOVA"
    topic_link: "/HRa/week-06/hra1/"
    question_en: "Why do you use an ANOVA instead of three separate t-tests to compare three groups?"
    question_nl: "Waarom gebruik je een ANOVA in plaats van drie losse t-toetsen om drie groepen te vergelijken?"
    answers:
      - text_en: "Multiple tests increase the risk of a type I error"
        text_nl: "Meerdere toetsen vergroten de kans op een type I-fout"
        correct: true
        feedback_en: "Correct! Each test has an α (5%) chance of a type I error. With three separate tests the chance of at least one false positive is about 1 − 0.95³ ≈ 14%. The ANOVA tests all groups at once with α = 0.05."
        feedback_nl: "Correct! Elke toets heeft een kans van α (5%) op een type I-fout. Bij drie losse toetsen is de kans dat er minstens één keer onterecht een verschil gevonden wordt ongeveer 1 − 0,95³ ≈ 14%. De ANOVA toetst alle groepen in één keer met α = 0,05."
      - text_en: "A t-test cannot handle more than 20 respondents"
        text_nl: "Een t-toets kan niet meer dan 20 respondenten aan"
        correct: false
        feedback_en: "Incorrect. A t-test has no maximum number of respondents."
        feedback_nl: "Onjuist. Een t-toets heeft geen maximum aantal respondenten."
      - text_en: "A t-test requires nominal data"
        text_nl: "Een t-toets vereist nominale data"
        correct: false
        feedback_en: "Incorrect. A t-test compares means of an interval/ratio variable; only the grouping variable is nominal."
        feedback_nl: "Onjuist. Een t-toets vergelijkt gemiddelden van een interval-/ratiovariabele; alleen de groepsvariabele is nominaal."
      - text_en: "An ANOVA always gives a smaller p-value"
        text_nl: "Een ANOVA geeft altijd een kleinere p-waarde"
        correct: false
        feedback_en: "Incorrect. There is no such rule. The reason is controlling the overall type I error, not getting a smaller p-value."
        feedback_nl: "Onjuist. Zo'n regel bestaat niet. De reden is het beheersen van de totale type I-fout, niet een kleinere p-waarde."
