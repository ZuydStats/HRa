site_name: HR analytics
site_description: HR analytics
site_url: https://zuydstats.github.io/HRa/

repo_name: ZuydStats/HRa
repo_url: https://github.com/ZuydStats/HRa

theme:
  name: material
  language: en
  icon:
    logo: material/chart-box-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follow system setting
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/theme.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Important information:
    - About the Course FAQ: important-information/faq.md
    - "🎯 Test yourself exam": quiz/index.md
    - "🔮 Let's Play Stats": https://talangill.github.io/letsplaystats/
  - Week 1:
    - HRa1 - Welcome to HR analytics: week-01/hra1.md
    - HRa2 - Research questions and hypotheses: week-01/hra2.md
  - Week 2:
    - HRa1 - Quantitative analyses and Type I & II errors: week-02/hra1.md
    - HRa2 - Reliability, Validity, Sampling & Workshop - Introduction to JAMOVI: week-02/hra2.md
    - Answer keys: week-02/answer-keys.md
  - Week 3:
    - HRa1 - Descriptives & graphs: week-03/hra1.md
    - HRa2 - Estimation & Hypothesis Testing & Workshop - OCAI: week-03/hra2.md
  - Week 4:
    - HRa1 - Test Yourself what graph to use: week-04/hra1.md
    - HRa2 - Crosstabs & Chi-Square & Workshop - People Power Planning: week-04/hra2.md
  - Week 5:
    - HRa1 - Correlation: week-05/hra1.md
    - HRa2 - T-test & Workshop - Satisfaction: week-05/hra2.md
  - Week 6:
    - HRa1 - ANOVA : week-06/hra1.md
    - HRa2 - Test Overview & Exam Prep & Workshop - Performance Appraisal: week-06/hra2.md
  - Week 7:
    - HRa1 - Turnover: week-07/hra1.md
  - Week 8:
    - HRa1 - Myriad: week-08/hra1.md
    - HRa2 - Q/A: week-08/hra2.md
  - Additional materials: additional-materials/additional.md

